    // ---- MODAL A11Y: Escape cierra el modal superior + focus al abrir ----
    var _modalCloseMap = [
      ['perfil-edit', cerrarPerfilEdit],
      ['modal-vinculos', cerrarVinculosModal],
      ['modal-match', cerrarMatchModal],
      ['modal-papelera', cerrarPapelera],
      ['modal', cerrarModal]
    ];
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Escape') return;
      for (var i = 0; i < _modalCloseMap.length; i++) {
        var el = document.getElementById(_modalCloseMap[i][0]);
        if (el && (el.style.display === 'flex' || el.classList.contains('open'))) { _modalCloseMap[i][1](); return; }
      }
      if (document.getElementById('menu-panel') && document.getElementById('menu-panel').classList.contains('open')) { cerrarMenuPanel(); return; }
      nexusCloseLightbox();
    });
    // focus trap ligero: al abrir un modal, foco al botón cerrar; Tab cicla dentro
    ['modal-vinculos', 'modal-match', 'modal-papelera', 'modal'].forEach(function(mid) {
      var el = document.getElementById(mid);
      if (!el) return;
      new MutationObserver(function() {
        if (el.style.display === 'flex') {
          setTimeout(function() {
            var c = el.querySelector('.modal-close');
            if (c) c.focus();
          }, 60);
        }
        // bloquear scroll del fondo cuando hay algun modal/lightbox abierto
        var anyOpen = ['modal-vinculos', 'modal-match', 'modal-papelera', 'modal']
          .some(function(id) { var m = document.getElementById(id); return m && m.style.display === 'flex'; });
        var lb = document.getElementById('nexus-lightbox');
        if (lb && lb.style.display === 'flex') anyOpen = true;
        document.body.classList.toggle('modal-open', anyOpen);
      }).observe(el, { attributes: true, attributeFilter: ['style'] });
    });

    // ---- BOTTOM SHEET: pull-down para cerrar (solo <=768px) ----
    (function() {
      var mq = window.matchMedia('(max-width: 768px)');
      if (!mq.matches) return;
      var CLOSERS = {
        'modal': cerrarModal, 'modal-papelera': cerrarPapelera, 'modal-match': cerrarMatchModal,
        'modal-vinculos': cerrarVinculosModal, 'modal-share': function() {}, 'perfil-edit': cerrarPerfilEdit
      };
      document.querySelectorAll('.modal-content').forEach(function(mc) {
        var sy = 0, dragging = false;
        mc.addEventListener('touchstart', function(e) {
          if (mc.scrollTop <= 0 && e.touches.length === 1) { sy = e.touches[0].clientY; dragging = true; }
        }, { passive: true });
        mc.addEventListener('touchmove', function(e) {
          if (!dragging || e.touches.length !== 1) return;
          var dy = e.touches[0].clientY - sy;
          if (dy > 0) mc.style.transform = 'translateY(' + Math.min(dy, 220) + 'px)';
        }, { passive: true });
        mc.addEventListener('touchend', function() {
          if (!dragging) return;
          dragging = false;
          var m = mc.style.transform.match(/translateY\((\d+)px\)/);
          mc.style.transform = '';
          if (m && Number(m[1]) > 90) {
            var ov = mc.parentElement;
            var fn = ov && CLOSERS[ov.id];
            if (fn) fn();
          }
        }, { passive: true });
      });
    })();

    // ---- OFFLINE READ-ONLY ----
    function nexusSyncOffline() {
      var off = !navigator.onLine;
      document.body.classList.toggle('offline', off);
      var b = document.getElementById('offline-banner');
      if (b) b.style.display = off ? 'block' : 'none';
    }
    window.addEventListener('online', function() {
      nexusSyncOffline();
      showToast && showToast(t('toast.conn'), 'success');
    });
    window.addEventListener('offline', function() {
      nexusSyncOffline();
      showToast && showToast(t('toast.offline'), 'warning');
    });
    nexusSyncOffline();

    // ---- GAME UPDATE HISTORY (Steam news RSS via Edge Function steam-updates) ----
    var _updatesLoaded = false;

    function detenerUpdates() {
      var box = document.getElementById('m-updates-box');
      var btn = document.getElementById('btn-toggle-updates');
      if (box) { box.style.display = 'none'; }
      if (btn) { btn.classList.remove('active'); btn.innerHTML = `${svgIcon('i-sync', 'ico-sm')} Historial de Updates`; }
    }

    async function toggleUpdates() {
      var box = document.getElementById('m-updates-box');
      var btn = document.getElementById('btn-toggle-updates');
      if (box.style.display === 'block') { detenerUpdates(); return; }
      box.style.display = 'block';
      btn.classList.add('active');
      btn.innerHTML = `${svgIcon('i-x', 'ico-sm')} ${t('upd.hide')}`;
      if (!_updatesLoaded) await nexusFetchUpdates();
    }

    function nexusFmtDate(pub) {
      try {
        var d = new Date(pub);
        return isNaN(d) ? String(pub || '') : d.toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' });
      } catch (e) { return String(pub || ''); }
    }

    async function nexusFetchUpdates() {
      var box = document.getElementById('m-updates-box');
      box.innerHTML = '<div class="upd-empty">' + t('upd.load') + '</div>';
      try {
        var sb = await nexusSb();
        var it = (itemsByCategory[currentCategory] || []).find(function(x) { return String(x.id) === String(currentItemId); });
        var appid = it ? String(it.id) : '';
        var r = await sb.functions.invoke('steam-updates', { body: { appid: appid } });
        if (r.error) throw new Error(r.error.message || 'Error en steam-updates');
        var items = (r.data && r.data.items) || [];
        _updatesLoaded = true;
        if (!items.length) { box.innerHTML = '<div class="upd-empty">' + t('upd.none') + '</div>'; return; }
        box.innerHTML = items.map(function(u) {
          return '<div class="upd-item">'
            + '<div class="upd-title">' + (u.url
                ? '<a href="' + escaparHTML(u.url) + '" target="_blank" rel="noopener noreferrer">' + escaparHTML(u.title) + '</a>'
                : escaparHTML(u.title)) + '</div>'
            + '<div class="upd-meta"><span>' + escaparHTML(nexusFmtDate(u.date)) + '</span>'
            + (u.is_update ? '<span class="upd-badge">Update</span>' : '') + '</div>'
            + '</div>';
        }).join('');
      } catch (e) {
        box.innerHTML = '<div class="upd-empty">' + escaparHTML(t('err.prefix') + (e.message || '')) + '</div>';
      }
    }

    // ---- BOOK EDITIONS (OpenLibrary works/{key}/editions via Edge Function book-editions) ----
    var _editionsLoaded = false;

    function detenerEditions() {
      var box = document.getElementById('m-editions-box');
      var btn = document.getElementById('btn-toggle-editions');
      if (box) { box.style.display = 'none'; }
      if (btn) { btn.classList.remove('active'); btn.innerHTML = `${svgIcon('i-book', 'ico-sm')} Ediciones`; }
    }

    async function toggleEditions() {
      var box = document.getElementById('m-editions-box');
      var btn = document.getElementById('btn-toggle-editions');
      if (box.style.display === 'block') { detenerEditions(); return; }
      box.style.display = 'block';
      btn.classList.add('active');
      btn.innerHTML = `${svgIcon('i-x', 'ico-sm')} ${t('ed.hide')}`;
      if (!_editionsLoaded) await nexusFetchEditions();
    }

    async function nexusFetchEditions() {
      var box = document.getElementById('m-editions-box');
      box.innerHTML = '<div class="upd-empty">' + t('ed.load') + '</div>';
      try {
        var sb = await nexusSb();
        var it = (itemsByCategory[currentCategory] || []).find(function(x) { return String(x.id) === String(currentItemId); });
        var r = await sb.functions.invoke('book-editions', { body: { id: it ? String(it.id) : '' } });
        if (r.error) throw new Error(r.error.message || 'Error en book-editions');
        var editions = (r.data && r.data.editions) || [];
        _editionsLoaded = true;
        if (!editions.length) { box.innerHTML = '<div class="upd-empty">' + escaparHTML((r.data && r.data.error) || 'Sin ediciones en OpenLibrary.') + '</div>'; return; }
        box.innerHTML = editions.map(function(e) {
          var meta = [];
          if (e.translators && e.translators.length) meta.push(t('ed.transl') + e.translators.join(', '));
          if (e.publishers && e.publishers.length) meta.push(e.publishers[0]);
          if (e.publish_date) meta.push(e.publish_date);
          if (e.languages && e.languages.length) meta.push(e.languages.join(', '));
          var links = [];
          if (e.isbn) links.push('<a href="https://openlibrary.org/isbn/' + encodeURIComponent(e.isbn) + '" target="_blank" rel="noopener noreferrer">ISBN ' + escaparHTML(e.isbn) + '</a>');
          if (e.ocaid) links.push('<a href="https://archive.org/details/' + encodeURIComponent(e.ocaid) + '" target="_blank" rel="noopener noreferrer">Leer ↗</a>');
          return '<div class="ed-row">'
            + '<div class="ed-title">' + escaparHTML(e.title || t('ed.edition')) + '</div>'
            + '<div class="ed-meta">' + meta.map(escaparHTML).join(' · ') + (e.languages && e.languages.indexOf('Español') !== -1 ? ' <span class="ed-tag">ES</span>' : '') + '</div>'
            + (links.length ? '<div class="ed-actions">' + links.join('') + '</div>' : '')
            + '</div>';
        }).join('');
      } catch (e) {
        box.innerHTML = '<div class="upd-empty">' + escaparHTML(t('err.prefix') + (e.message || '')) + '</div>';
      }
    }

    // ---- STEAM REVIEWS BREAKDOWN (Edge Function steam-reviews) ----
    var _resenasLoaded = false;

    function detenerResenas() {
      var box = document.getElementById('m-resenas-box');
      var btn = document.getElementById('btn-toggle-resenas');
      if (box) { box.style.display = 'none'; }
      if (btn) { btn.classList.remove('active'); btn.innerHTML = `${svgIcon('i-star', 'ico-sm')} Reseñas Steam`; }
    }

    async function toggleResenas() {
      var box = document.getElementById('m-resenas-box');
      var btn = document.getElementById('btn-toggle-resenas');
      if (box.style.display === 'block') { detenerResenas(); return; }
      box.style.display = 'block';
      btn.classList.add('active');
      btn.innerHTML = `${svgIcon('i-x', 'ico-sm')} ${t('rv.hide')}`;
      if (!_resenasLoaded) await nexusFetchResenas();
    }

    function nexusRenderResenas(d) {
      var pct = Number(d.pct) || 0;
      var total = Number(d.total) || 0;
      var pos = Math.round(pct * total / 100);
      var neg = Math.max(0, total - pos);
      var fmt = function(n) { return n.toLocaleString('es'); };
      var tierColor = pct >= 60 ? '#7ec850' : pct >= 40 ? '#8f98a0' : '#ff8585';
      var segs = ['#c93b3b', '#d98e4a', '#8f98a0', '#a4c96b', '#5ba32b'];
      var bar = '<div class="rev-bar5">' + segs.map(function(c) {
        return '<div class="rev-seg" style="background:' + c + '"></div>';
      }).join('') + '<div class="rev-needle" style="left:' + Math.min(100, Math.max(0, pct)) + '%"></div></div>';
      var trend = '';
      if (d.pct30 != null) {
        var diff = pct - Number(d.pct30);
        var cls = diff > 2 ? 'up' : diff < -2 ? 'down' : 'flat';
        var arrow = diff > 2 ? '▲' : diff < -2 ? '▼' : '→';
        trend = '<span class="rev-trend ' + cls + '">' + arrow + ' ' + Math.abs(Math.round(diff)) + '% ' + t('rv.vs30d') + '</span>';
      }
      return '<div class="rev-wrap">'
        + '<div class="rev-top"><span class="rev-big">' + pct + '%</span>'
        + '<span class="rev-tier" style="color:' + tierColor + '">' + escaparHTML(d.tier || '') + '</span>' + trend + '</div>'
        + bar
        + '<div class="rev-meta"><span>' + fmt(pos) + ' ' + t('rv.pos') + '</span><span>' + fmt(neg) + ' ' + t('rv.neg') + '</span><span>' + fmt(total) + ' ' + t('rv.total') + (d.total30 ? ' · ' + fmt(d.total30) + ' ' + t('rv.30d') : '') + '</span></div>'
        + '</div>';
    }

    async function nexusFetchResenas() {
      var box = document.getElementById('m-resenas-box');
      box.innerHTML = '<div class="upd-empty">' + t('rv.load') + '</div>';
      try {
        var sb = await nexusSb();
        var it = (itemsByCategory[currentCategory] || []).find(function(x) { return String(x.id) === String(currentItemId); });
        var appid = it ? String(it.id) : '';
        var r = await sb.functions.invoke('steam-reviews', { body: { appid: appid } });
        if (r.error) throw new Error(r.error.message || 'Error en steam-reviews');
        _resenasLoaded = true;
        if (!r.data || r.data.pct == null) { box.innerHTML = '<div class="upd-empty">' + t('rv.none') + '</div>'; return; }
        box.innerHTML = nexusRenderResenas(r.data);
      } catch (e) {
        box.innerHTML = '<div class="upd-empty">' + escaparHTML(t('err.prefix') + (e.message || '')) + '</div>';
      }
    }

    // ---- CAROUSEL DOTS + LIGHTBOX ----
    function nexusInitCarouselDots(carEl, dotsEl) {
      if (!carEl || !dotsEl) return;
      var imgs = carEl.querySelectorAll('img');
      dotsEl.innerHTML = '';
      if (imgs.length < 2) { dotsEl.style.display = 'none'; return; }
      dotsEl.style.display = 'flex';
      var dots = [];
      imgs.forEach(function(_, i) {
        var d = document.createElement('span');
        d.className = 'carousel-dot' + (i === 0 ? ' active' : '');
        dots.push(d); dotsEl.appendChild(d);
      });
      var update = function() {
        var idx = Math.round(carEl.scrollLeft / (carEl.scrollWidth / imgs.length));
        dots.forEach(function(d, i) { d.classList.toggle('active', i === Math.min(idx, dots.length - 1)); });
      };
      carEl.onscroll = update;
      dotsEl._update = update;
    }

    // ---- IMAGE LIGHTBOX (covers/screenshots fullscreen in-app) ----
    var _lbUrls = [], _lbIdx = 0;
    function nexusOpenLightbox(urls, idx) {
      _lbUrls = urls || []; _lbIdx = idx || 0;
      var lb = document.getElementById('nexus-lightbox');
      if (!lb) {
        lb = document.createElement('div');
        lb.id = 'nexus-lightbox';
        lb.className = 'lightbox';
        lb.innerHTML = '<button class="lb-close" onclick="nexusCloseLightbox()"><svg class="ico"><use href="#i-x"/></svg></button>'
          + '<button class="lb-nav lb-prev" onclick="nexusLightboxNav(-1)">&#8249;</button>'
          + '<img class="lb-img" alt="">'
          + '<button class="lb-nav lb-next" onclick="nexusLightboxNav(1)">&#8250;</button>'
          + '<div class="lb-counter"></div>';
        lb.addEventListener('click', function(e) { if (e.target === lb) nexusCloseLightbox(); });
        document.body.appendChild(lb);
        document.addEventListener('keydown', function(e) {
          if (lb.style.display !== 'flex') return;
          if (e.key === 'Escape') nexusCloseLightbox();
          if (e.key === 'ArrowLeft') nexusLightboxNav(-1);
          if (e.key === 'ArrowRight') nexusLightboxNav(1);
        });
      }
      lb.style.display = 'flex';
      document.body.classList.add('modal-open');
      nexusLightboxRender();
    }
    function nexusLightboxRender() {
      var lb = document.getElementById('nexus-lightbox');
      if (!lb) return;
      lb.querySelector('.lb-img').src = _lbUrls[_lbIdx];
      lb.querySelector('.lb-counter').textContent = (_lbIdx + 1) + ' / ' + _lbUrls.length;
      lb.querySelector('.lb-prev').style.display = _lbUrls.length > 1 ? 'flex' : 'none';
      lb.querySelector('.lb-next').style.display = _lbUrls.length > 1 ? 'flex' : 'none';
    }
    function nexusLightboxNav(d) {
      _lbIdx = (_lbIdx + d + _lbUrls.length) % _lbUrls.length;
      nexusLightboxRender();
    }
    function nexusCloseLightbox() {
      var lb = document.getElementById('nexus-lightbox');
      if (lb) lb.style.display = 'none';
      var anyModal = ['modal-vinculos', 'modal-match', 'modal-papelera', 'modal']
        .some(function(id) { var m = document.getElementById(id); return m && m.style.display === 'flex'; });
      document.body.classList.toggle('modal-open', anyModal);
    }

    function toggleTrailer() {
      var box = document.getElementById('m-trailer-box');
      var btn = document.getElementById('btn-toggle-trailer');
      if (box.style.display === 'block') return detenerTrailer();

      detenerTrailer();
      box.style.display = 'block';
      btn.classList.add('active');
      btn.innerHTML = `${svgIcon('i-x', 'ico-sm')} ${t('trail.hide')}`;

      var ytId = extraerYouTubeId(currentTrailerUrl);
      if (ytId) {
        var iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&rel=0`;
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
        box.appendChild(iframe);
        return;
      }

      var video = document.createElement('video');
      video.controls = true; video.playsInline = true; video.autoplay = true;
      box.appendChild(video);

      if (currentTrailerUrl.includes('.m3u8')) {
        const iniciarHls = () => {
          if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(currentTrailerUrl);
            hlsInstance.attachMedia(video);
          } else { video.src = currentTrailerUrl; }
        };
        if (typeof Hls === 'undefined') {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1';
          s.onload = iniciarHls;
          document.head.appendChild(s);
        } else { iniciarHls(); }
      } else { video.src = currentTrailerUrl; }
    }

    function detenerTrailer() {
      var box = document.getElementById('m-trailer-box');
      var btn = document.getElementById('btn-toggle-trailer');
      if (hlsInstance) { try { hlsInstance.destroy(); } catch (e) {} hlsInstance = null; }
      if (box) { box.innerHTML = ''; box.style.display = 'none'; }
      if (btn) { btn.classList.remove('active'); btn.innerHTML = `${svgIcon('i-play', 'ico-sm')} ${t('trail.show')}`; }
    }
  </script>

  <script>
    window.addEventListener('error', (e) => {
      console.error('[NexusLib] Error:', e.message, e.filename, e.lineno);
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.error('[NexusLib] Promesa rechazada:', e.reason);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(() => console.log('PWA lista para instalar'))
          .catch(err => console.log('Error en Service Worker:', err));
      });
    }
  </script>
