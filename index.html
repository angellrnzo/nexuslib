  <!-- ==================== NEXUS PHASE 4 — adaptador Supabase ==================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const NEXUS_MODE = true; // false = Apps Script/Sheets (v1)
    const NEXUS_URL = 'https://vkmgnwnlceycauleluwl.supabase.co';
    const NEXUS_KEY = 'sb_publishable_nLhtLiQ7uZ0I2noqeZMNcg_c0sKq9nO';

    var _nexusSb = null, _nexusUser = null, _nexusProfile = null, _nexusLibId = null;

    async function nexusSb() {
      if (!_nexusSb) {
        _nexusSb = window.supabase.createClient(NEXUS_URL, NEXUS_KEY);
        var s = await _nexusSb.auth.getSession();
        _nexusUser = (s.data && s.data.session) ? s.data.session.user : null;
      }
      return _nexusSb;
    }

    async function nexusEnsureProfile() {
      var sb = await nexusSb();
      if (!_nexusUser) {
        var u = await sb.auth.getUser();
        _nexusUser = u.data.user;
      }
      if (!_nexusProfile && _nexusUser) {
        var p = await sb.from('profiles').select('id,display_name,username').eq('id', _nexusUser.id).single();
        _nexusProfile = p.data;
        var lm = await sb.from('library_members').select('library_id').eq('profile_id', _nexusUser.id).limit(1);
        _nexusLibId = (lm.data && lm.data[0]) ? lm.data[0].library_id : null;
      }
      return _nexusProfile;
    }

    function nexusPersona() {
      // el handle visible es username; fallback al primer nombre del display_name
      if (_nexusProfile && _nexusProfile.username) return _nexusProfile.username;
      return (_nexusProfile && _nexusProfile.display_name ? _nexusProfile.display_name : 'Yo').split(' ')[0];
    }

    function nexusPersonaOk(persona) {
      return nexusPersona().toLowerCase() === String(persona || '').toLowerCase();
    }

    async function nexusMediaId(category, externalId) {
      var sb = await nexusSb();
      var r = await sb.from('media_items').select('id')
        .eq('category', category).eq('external_id', String(externalId)).maybeSingle();
      if (r.error) throw new Error(r.error.message);
      return r.data ? r.data.id : null;
    }

    async function nexusTrackingUpsert(category, externalId, fields) {
      var sb = await nexusSb();
      await nexusEnsureProfile();
      var mediaId = await nexusMediaId(category, externalId);
      if (!mediaId) return { success: false, msg: 'Item no encontrado en el catálogo.' };
      var payload = { profile_id: _nexusUser.id, media_item_id: mediaId };
      Object.keys(fields).forEach(function(k) { payload[k] = fields[k]; });
      var r = await sb.from('user_media_tracking')
        .upsert(payload, { onConflict: 'profile_id,media_item_id' });
      if (r.error) throw new Error(r.error.message);
      return { success: true };
    }

    var NEXUS_STATUS_MAP = { 'No jugado': 'backlog', 'En proceso': 'in_progress', 'Completado': 'completed' };

    var nexusRun = {
      _ok: null, _fail: null,
      withSuccessHandler: function(f) { this._ok = f; return this; },
      withFailureHandler: function(f) { this._fail = f; return this; },
      _exec: function(p) {
        Promise.resolve(p).then(function(r) {
          try { if (nexusRun._ok) nexusRun._ok(r); } catch (e) { console.error(e); }
        }).catch(function(e) {
          try { if (nexusRun._fail) nexusRun._fail(e); else console.error(e); } catch (_) {}
        });
      },
      getItems: function(cat) {
        this._exec((async function() {
          var sb = await nexusSb();
          await nexusEnsureProfile();
          var r = await sb.rpc('get_items_merged', { p_category: cat });
          if (r.error) throw new Error(r.error.message);
          return r.data || [];
        })());
      },
      guardarProgresoItem: function(cat, id, persona, estado, estrellas, progreso) {
        this._exec((async function() {
          await nexusSb(); await nexusEnsureProfile();
          if (!nexusPersonaOk(persona)) return { success: false, msg: 'Solo puedes editar tu propio tracking.' };
          return nexusTrackingUpsert(cat, id, {
            status: NEXUS_STATUS_MAP[estado] || null,
            rating: (Number(estrellas) > 0) ? Number(estrellas) : null,
            progress: progreso || null
          });
        })());
      },
      guardarDeseadoItem: function(cat, id, persona, deseado) {
        this._exec((async function() {
          await nexusSb(); await nexusEnsureProfile();
          if (!nexusPersonaOk(persona)) return { success: false, msg: 'Solo puedes editar tu propio tracking.' };
          return nexusTrackingUpsert(cat, id, { is_wishlisted: Boolean(deseado) });
        })());
      },
      guardarNotaItem: function(cat, id, persona, nota) {
        this._exec((async function() {
          await nexusSb(); await nexusEnsureProfile();
          if (!nexusPersonaOk(persona)) return { success: false, msg: 'Solo puedes editar tu propio tracking.' };
          return nexusTrackingUpsert(cat, id, { personal_notes: nota || null });
        })());
      },
      guardarTotalCapitulos: function(cat, id, total) {
        this._exec((async function() {
          var sb = await nexusSb();
          var r = await sb.from('media_items').select('id')
            .eq('category', cat).eq('external_id', String(id)).single();
          if (r.error || !r.data) return { success: false, msg: 'Item no encontrado.' };
          var u = await sb.rpc('set_media_total_chapters', { p_media_id: r.data.id, p_total: Number(total) || 0 });
          if (u.error) throw new Error(u.error.message);
          return { success: true };
        })());
      },
      eliminarItem: function(cat, id) {
        this._exec((async function() {
          var sb = await nexusSb(); await nexusEnsureProfile();
          var mediaId = await nexusMediaId(cat, id);
          if (!mediaId || !_nexusLibId) return { success: false, msg: 'No se encontró el elemento.' };
          var r = await sb.from('library_items')
            .update({ deleted_at: new Date().toISOString() })
            .eq('library_id', _nexusLibId).eq('media_item_id', mediaId).is('deleted_at', null);
          if (r.error) throw new Error(r.error.message);
          return { success: true };
        })());
      },
      restaurarItem: function(cat, id) {
        this._exec((async function() {
          var sb = await nexusSb(); await nexusEnsureProfile();
          var mediaId = await nexusMediaId(cat, id);
          if (!mediaId || !_nexusLibId) return { success: false };
          var r = await sb.from('library_items')
            .update({ deleted_at: null })
            .eq('library_id', _nexusLibId).eq('media_item_id', mediaId).not('deleted_at', 'is', null);
          if (r.error) throw new Error(r.error.message);
          return { success: true };
        })());
      },
      getItemsEliminados: function() {
        this._exec((async function() {
          var sb = await nexusSb(); await nexusEnsureProfile();
          if (!_nexusLibId) return [];
          var r = await sb.from('library_items')
            .select('media_items(category,title,external_id)')
            .eq('library_id', _nexusLibId).not('deleted_at', 'is', null);
          if (r.error) throw new Error(r.error.message);
          return (r.data || []).map(function(x) {
            var mi = x.media_items || {};
            return { categoria: mi.category || '', id: String(mi.external_id || ''), titulo: mi.title || 'Elemento sin título' };
          });
        })());
      },
      buscarCatalogoExterno: function(cat, query) {
        this._exec((async function() {
          var sb = await nexusSb(); await nexusEnsureProfile();
          var r = await sb.functions.invoke('catalog-search', { body: { category: cat, query: query } });
          if (r.error) throw new Error(r.error.message);
          return r.data || [];
        })());
      },
      agregarItem: function(cat, idOUrlOrName) {
        this._exec((async function() {
          var sb = await nexusSb(); await nexusEnsureProfile();
          var r = await sb.functions.invoke('catalog-add', { body: { category: cat, idOrUrlOrName: idOUrlOrName } });
          if (r.error) {
            var ctx = r.error.context;
            if (ctx && typeof ctx.json === 'function') {
              try { var j = await ctx.json(); if (j && j.msg) return { success: false, msg: j.msg }; } catch (_) {}
            }
            throw new Error(r.error.message);
          }
          return r.data;
        })());
      },
      repararItemIndividual: function(cat, id) {
        this._exec((async function() {
          var sb = await nexusSb(); await nexusEnsureProfile();
          var r = await sb.functions.invoke('item-refresh', { body: { category: cat, id: id } });
          if (r.error) {
            var ctx = r.error.context;
            if (ctx && typeof ctx.json === 'function') {
              try { var j = await ctx.json(); if (j && j.msg) return { success: false, msg: j.msg }; } catch (_) {}
            }
            throw new Error(r.error.message);
          }
          return r.data;
        })());
      }
    };

    var RUN = NEXUS_MODE ? nexusRun : google.script.run;

    // ---- auth gate ----
    function nexusShowLogin(onReady) {
      if (document.getElementById('nexus-login')) return;
      var ov = document.createElement('div');
      ov.id = 'nexus-login';
      ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:var(--bg,#0b0e14);display:flex;align-items:center;justify-content:center;padding:20px;';
      ov.innerHTML =
        '<div style="width:100%;max-width:340px;background:var(--panel,#1b2838);border:1px solid var(--border,rgba(255,255,255,.1));border-radius:14px;padding:28px 24px;">' +
        '<div style="text-align:center;margin-bottom:20px;"><div style="font-size:28px;font-weight:900;color:var(--accent,#66c0f4);">NexusLib</div>' +
        '<div style="color:var(--text,#c7d5e0);font-size:13px;margin-top:4px;">Inicia sesión para continuar</div></div>' +
        '<input id="nexus-email" type="email" placeholder="Email" autocomplete="username" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:#0b0e14;color:var(--text);margin-bottom:10px;font-size:14px;box-sizing:border-box;">' +
        '<input id="nexus-pass" type="password" placeholder="Contraseña" autocomplete="current-password" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:#0b0e14;color:var(--text);margin-bottom:14px;font-size:14px;box-sizing:border-box;">' +
        '<button id="nexus-btn-login" style="width:100%;padding:12px;border:none;border-radius:8px;background:var(--accent,#66c0f4);color:#0b0e14;font-weight:700;font-size:14px;cursor:pointer;">Entrar</button>' +
        '<button id="nexus-btn-magic" style="width:100%;padding:10px;margin-top:8px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);font-size:13px;cursor:pointer;">Enviar enlace mágico</button>' +
        '<div id="nexus-login-msg" style="margin-top:12px;font-size:12px;text-align:center;color:#ff8585;min-height:16px;"></div>' +
        '</div>';
      document.body.appendChild(ov);
      var msg = ov.querySelector('#nexus-login-msg');
      async function doLogin() {
        var email = ov.querySelector('#nexus-email').value.trim();
        var pass = ov.querySelector('#nexus-pass').value;
        msg.textContent = '';
        if (!email) { msg.textContent = 'Escribe tu email.'; return; }
        var sb = await nexusSb();
        var r = await sb.auth.signInWithPassword({ email: email, password: pass });
        if (r.error) { msg.textContent = r.error.message; return; }
        _nexusUser = r.data.user;
        ov.remove();
        if (onReady) onReady();
      }
      async function doMagic() {
        var email = ov.querySelector('#nexus-email').value.trim();
        msg.textContent = '';
        if (!email) { msg.textContent = 'Escribe tu email.'; return; }
        var sb = await nexusSb();
        var r = await sb.auth.signInWithOtp({ email: email });
        msg.textContent = r.error ? r.error.message : 'Revisa tu email — enlace enviado.';
        msg.style.color = r.error ? '#ff8585' : '#7bd88f';
      }
      ov.querySelector('#nexus-btn-login').onclick = doLogin;
      ov.querySelector('#nexus-btn-magic').onclick = doMagic;
      ov.querySelector('#nexus-pass').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
    }

    async function nexusBoot(onReady) {
      try {
        var sb = await nexusSb();
        var s = await sb.auth.getSession();
        if (s.data && s.data.session) {
          _nexusUser = s.data.session.user;
          onReady();
        } else {
          nexusShowLogin(onReady);
        }
      } catch (e) {
        console.error('nexusBoot', e);
        nexusShowLogin(onReady);
      }
    }

    // ---- vínculos (Phase 5, solo Nexus mode) ----
    var VINCULOS_LINK_TYPES = {
      pareja: 'Pareja', familia: 'Familia', amigo: 'Amigo', custom: 'Personalizado'
    };

    async function nexusMisVinculos() {
      var sb = await nexusSb();
      await nexusEnsureProfile();
      var out = { invite_code: null, links: [], rpcError: null };
      if (_nexusLibId) {
        var l = await sb.from('libraries').select('invite_code').eq('id', _nexusLibId).single();
        if (l.data) out.invite_code = l.data.invite_code;
      }
      var r = await sb.rpc('get_my_library_links');
      if (r.error) out.rpcError = r.error.message;
      else out.links = r.data || [];
      var rs = await sb.rpc('get_my_item_shares');
      if (!rs.error) out.shares = rs.data || [];
      return out;
    }

    // nombre visible de un vínculo: username (handle) > display_name > 'Usuario'
    function vinculosNombre(other) {
      return (other && (other.username || other.display_name)) || 'Usuario';
    }

    function vinculosEsc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function abrirVinculosModal() {
      var ov = document.getElementById('modal-vinculos');
      if (!ov) return;
      var body = document.getElementById('vinculos-body');
      body.innerHTML = '<p style="color:#8f98a0;font-size:13px;">Cargando…</p>';
      ov.style.display = 'flex';
      requestAnimationFrame(() => requestAnimationFrame(() => ov.style.opacity = '1'));
      nexusMisVinculos().then(function(d) { renderVinculos(d); }).catch(function(e) {
        body.innerHTML = '<p style="color:#ff8585;font-size:13px;">Error: ' + vinculosEsc(e.message) + '</p>';
      });
    }

    function cerrarVinculosModal() {
      var ov = document.getElementById('modal-vinculos');
      if (ov) { ov.style.opacity = '0'; ov.style.display = 'none'; }
    }

    function renderVinculos(d) {
      var body = document.getElementById('vinculos-body');
      var h = '';

      // --- mi código ---
      h += '<div style="background:rgba(255,255,255,.04);border:1px solid var(--border,rgba(255,255,255,.1));border-radius:10px;padding:12px 14px;margin-bottom:14px;">';
      h += '<div style="font-size:11px;color:#8f98a0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Mi código de invitación</div>';
      if (d.invite_code) {
        h += '<div style="display:flex;align-items:center;gap:10px;">' +
             '<code style="font-size:18px;font-weight:700;color:#7ee0a3;letter-spacing:2px;">' + vinculosEsc(d.invite_code) + '</code>' +
             '<button class="btn btn-circle" onclick="vinculosCopiar()" title="Copiar"><svg class="ico"><use href="#i-copy"/></svg></button></div>';
        h += '<div style="font-size:11px;color:#8f98a0;margin-top:6px;">Comparte este código — la otra persona lo introduce en su perfil.</div>';
      } else {
        h += '<div style="font-size:12px;color:#8f98a0;">No disponible.</div>';
      }
      h += '</div>';

      // --- solicitar vínculo ---
      h += '<div style="margin-bottom:14px;">';
      h += '<div style="font-size:11px;color:#8f98a0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Añadir vínculo</div>';
      h += '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
           '<input id="vinc-codigo" type="text" placeholder="Código" style="flex:1;min-width:110px;padding:10px;border-radius:8px;border:1px solid var(--border);background:#0b0e14;color:var(--text);font-size:14px;text-transform:uppercase;">' +
           '<select id="vinc-tipo" onchange="vinculosToggleLabel()" style="padding:10px;border-radius:8px;border:1px solid var(--border);background:#0b0e14;color:var(--text);font-size:13px;">';
      Object.keys(VINCULOS_LINK_TYPES).forEach(function(k) {
        h += '<option value="' + k + '">' + VINCULOS_LINK_TYPES[k] + '</option>';
      });
      h += '</select>' +
           '<button class="btn btn-text" onclick="vinculosSolicitar()">Enviar</button></div>' +
           '<input id="vinc-label" type="text" placeholder="Nombre del vínculo (ej. Vecino, Compañero de trabajo…)" ' +
           'style="display:none;width:100%;margin-top:8px;padding:10px;border-radius:8px;border:1px solid var(--border);background:#0b0e14;color:var(--text);font-size:13px;">';
      h += '<div id="vinc-msg" style="font-size:12px;margin-top:6px;min-height:14px;"></div></div>';

      var links = d.links || [];
      var pendientesIn = links.filter(function(x) { return x.direction === 'incoming' && x.status === 'pending'; });
      var pendientesOut = links.filter(function(x) { return x.direction === 'outgoing' && x.status === 'pending'; });
      // dedupe por persona: la fila inversa del link (respond_library_link)
      // comparte el mismo other.profile_id -> mostrar una sola entrada
      var vistos = {};
      var aceptados = links.filter(function(x) {
        if (x.status !== 'accepted') return false;
        var pid = x.other && x.other.profile_id;
        if (pid && vistos[pid]) return false;
        if (pid) vistos[pid] = true;
        return true;
      });
      // agrupar TODAS las filas accepted por persona: out = lo que YO expongo,
      // in = lo que EL/ELLA me expone (filas inversas de respond_library_link)
      var porPid = {};
      links.forEach(function(x) {
        if (x.status !== 'accepted' || !x.other || !x.other.profile_id) return;
        var pid = x.other.profile_id;
        if (!porPid[pid]) porPid[pid] = { name: vinculosNombre(x.other), type: x.link_type, rows: {} };
        porPid[pid].rows[x.direction] = x;
      });
      window._vincPorPid = porPid;

      // --- pendientes entrantes ---
      if (pendientesIn.length) {
        h += '<div style="margin-bottom:14px;"><div style="font-size:11px;color:#ffd479;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Solicitudes recibidas</div>';
        pendientesIn.forEach(function(x) {
          var nombre = vinculosNombre(x.other);
          h += '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,212,121,.06);border:1px solid rgba(255,212,121,.25);border-radius:8px;margin-bottom:6px;">' +
               '<span style="flex:1;font-size:13px;">' + vinculosEsc(nombre) +
               ' <span style="color:#8f98a0;font-size:11px;">(' + vinculosEsc(vinculosTypeLabel(x)) + ')</span></span>' +
               '<button class="btn btn-text" style="padding:6px 12px;font-size:12px;" onclick="vinculosResponder(\'' + x.link_id + '\',true)">Aceptar</button>' +
               '<button class="btn btn-circle" style="color:#ff8585;" onclick="vinculosResponder(\'' + x.link_id + '\',false)" title="Rechazar"><svg class="ico"><use href="#i-x"/></svg></button></div>';
        });
        h += '</div>';
      }

      // --- pendientes salientes ---
      if (pendientesOut.length) {
        h += '<div style="margin-bottom:14px;"><div style="font-size:11px;color:#8f98a0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Enviadas (esperando respuesta)</div>';
        pendientesOut.forEach(function(x) {
          var nombre = vinculosNombre(x.other);
          h += '<div style="padding:8px 10px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:13px;">' +
               vinculosEsc(nombre) + ' <span style="color:#8f98a0;font-size:11px;">(' + vinculosEsc(vinculosTypeLabel(x)) + ')</span></div>';
        });
        h += '</div>';
      }

      // --- aceptados ---
      h += '<div><div style="font-size:11px;color:#7ee0a3;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Vinculados</div>';
      if (!aceptados.length) {
        h += '<div style="font-size:12px;color:#8f98a0;">Sin vínculos aceptados todavía.</div>';
      }
      aceptados.forEach(function(x) {
        var nombre = vinculosNombre(x.other);
        var pid = x.other ? x.other.profile_id : '';
        h += '<div style="padding:8px 10px;background:rgba(126,224,163,.05);border:1px solid rgba(126,224,163,.2);border-radius:8px;margin-bottom:6px;">' +
             '<div style="display:flex;align-items:center;gap:8px;">' +
             '<span style="flex:1;font-size:13px;">' + vinculosEsc(nombre) + '</span>' +
             nexusLinkBadge(x.link_type, x.link_label) +
             (pid ? '<button class="btn btn-circle" style="width:26px;height:26px;" onclick="toggleVisPanel(\'' + pid + '\')" title="Visibilidad"><svg class="ico ico-sm"><use href="#i-settings"/></svg></button>' : '') +
             '</div>' +
             (pid ? '<div id="vis-panel-' + pid + '" style="display:none;margin-top:8px;"></div>' : '') +
             '</div>';
      });
      h += '</div>';

      // --- items compartidos (Phase 5d) ---
      var shares = d.shares || [];
      var sharesIn = shares.filter(function(x) { return x.direction === 'incoming' && x.status === 'pending'; });
      var sharesOut = shares.filter(function(x) { return x.direction === 'outgoing' && x.status === 'pending'; });
      if (sharesIn.length || sharesOut.length) {
        h += '<div style="margin-top:14px;"><div style="font-size:11px;color:#7ee0a3;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Elementos compartidos</div>';
        sharesIn.forEach(function(x) {
          var it = x.item || {};
          h += '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(126,224,163,.06);border:1px solid rgba(126,224,163,.25);border-radius:8px;margin-bottom:6px;">' +
               '<span style="flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + vinculosEsc(it.titulo || 'Item') +
               ' <span style="color:#8f98a0;font-size:11px;">de ' + vinculosEsc(x.other_name || 'alguien') + '</span></span>' +
               '<button class="btn btn-text" style="padding:6px 12px;font-size:12px;" onclick="vinculosItemResponder(\'' + x.request_id + '\',true)">Aceptar</button>' +
               '<button class="btn btn-circle" style="color:#ff8585;" onclick="vinculosItemResponder(\'' + x.request_id + '\',false)" title="Rechazar"><svg class="ico"><use href="#i-x"/></svg></button></div>';
        });
        sharesOut.forEach(function(x) {
          var it = x.item || {};
          h += '<div style="padding:8px 10px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:13px;">' +
               vinculosEsc(it.titulo || 'Item') + ' <span style="color:#8f98a0;font-size:11px;">→ ' + vinculosEsc(x.other_name || '') + ' (esperando)</span></div>';
        });
        h += '</div>';
      }

      if (d.rpcError) {
        h += '<div style="font-size:11px;color:#ff8585;margin-top:10px;">RPC no disponible: ' + vinculosEsc(d.rpcError) + ' — corre phase4_5.sql sec.3 / phase5b_links_rpc.sql</div>';
      }

      body.innerHTML = h;
      nexusRefreshVinculosBadge();
    }

    // badge de notificaciones en el botón Vínculos: solicitudes de vínculo
    // entrantes + items compartidos pendientes de aceptar
    async function nexusRefreshVinculosBadge() {
      var badge = document.getElementById('vinc-badge');
      if (!badge || !NEXUS_MODE) return;
      try {
        var d = await nexusMisVinculos();
        var n = (d.links || []).filter(function(x) {
          return x.direction === 'incoming' && x.status === 'pending';
        }).length;
        n += (d.shares || []).filter(function(x) {
          return x.direction === 'incoming' && x.status === 'pending';
        }).length;
        badge.style.display = n > 0 ? 'block' : 'none';
        badge.textContent = n > 9 ? '9+' : String(n);
      } catch (e) {}
    }

    function vinculosCopiar() {
      var code = document.querySelector('#vinculos-body code');
      if (code && navigator.clipboard) navigator.clipboard.writeText(code.textContent.trim());
      showToast && showToast('Código copiado.', 'success');
    }

    function vinculosToggleLabel() {
      var sel = document.getElementById('vinc-tipo');
      var inp = document.getElementById('vinc-label');
      if (sel && inp) inp.style.display = (sel.value === 'custom') ? 'block' : 'none';
    }

    async function vinculosSolicitar() {
      var inp = document.getElementById('vinc-codigo');
      var sel = document.getElementById('vinc-tipo');
      var lbl = document.getElementById('vinc-label');
      var msg = document.getElementById('vinc-msg');
      var code = (inp.value || '').trim();
      if (!code) { msg.textContent = 'Escribe un código.'; msg.style.color = '#ff8585'; return; }
      msg.textContent = 'Enviando…'; msg.style.color = '#8f98a0';
      try {
        var sb = await nexusSb();
        var r = await sb.rpc('request_library_link', {
          p_invite_code: code,
          p_link_type: sel.value,
          p_link_label: (lbl && sel.value === 'custom') ? (lbl.value || '').trim() : null
        });
        if (r.error) throw new Error(r.error.message);
        msg.textContent = 'Solicitud enviada.'; msg.style.color = '#7bd88f';
        inp.value = '';
        setTimeout(function() { abrirVinculosModal(); }, 800);
      } catch (e) {
        msg.textContent = e.message || 'Error'; msg.style.color = '#ff8585';
      }
    }

    async function vinculosItemResponder(requestId, accept) {
      try {
        var sb = await nexusSb();
        var r = await sb.rpc('respond_item_share', { p_request_id: requestId, p_accept: accept });
        if (r.error) throw new Error(r.error.message);
        showToast && showToast(accept ? 'Elemento añadido a tu biblioteca.' : 'Solicitud rechazada.', accept ? 'success' : 'warning');
        abrirVinculosModal();
      } catch (e) {
        showToast && showToast('Error: ' + (e.message || ''), 'error');
      }
    }

    async function vinculosResponder(linkId, accept) {
      try {
        var sb = await nexusSb();
        var r = await sb.rpc('respond_library_link', { p_link_id: linkId, p_accept: accept });
        if (r.error) throw new Error(r.error.message);
        showToast && showToast(accept ? 'Vínculo aceptado.' : 'Solicitud rechazada.', accept ? 'success' : 'warning');
        abrirVinculosModal();
      } catch (e) {
        showToast && showToast('Error: ' + (e.message || ''), 'error');
      }
    }

    // ---- editor matriz visibility por vínculo (Phase 5A) ----
    var VINCULOS_CATS = [
      ['Juegos', 'Juegos'], ['Peliculas_Series', 'Películas/Series'],
      ['Libros', 'Libros'], ['Mangas', 'Mangas']
    ];
    var VINCULOS_FIELDS = [
      ['status', 'Estado'], ['rating', 'Valoración'], ['wishlist', 'Deseado'],
      ['progress', 'Progreso'], ['notes', 'Notas']
    ];

    function visSel(pid) {
      window._visSel = window._visSel || {};
      if (!window._visSel[pid]) window._visSel[pid] = { dir: 'out', cat: 'Juegos' };
      return window._visSel[pid];
    }

    function toggleVisPanel(pid) {
      var p = document.getElementById('vis-panel-' + pid);
      if (!p) return;
      if (p.style.display === 'none' || !p.innerHTML) {
        p.style.display = 'block';
        renderVisPanel(pid);
      } else {
        p.style.display = 'none';
      }
    }

    function visSetDir(pid, dir) { visSel(pid).dir = dir; renderVisPanel(pid); }
    function visSetCat(pid, cat) { visSel(pid).cat = cat; renderVisPanel(pid); }

    function renderVisPanel(pid) {
      var p = document.getElementById('vis-panel-' + pid);
      var info = (window._vincPorPid || {})[pid];
      if (!p || !info) return;
      var sel = visSel(pid);
      var dirs = [];
      if (info.rows.out) dirs.push({ k: 'out', label: 'Yo → ' + info.name });
      if (info.rows.in)  dirs.push({ k: 'in',  label: info.name + ' → yo' });
      if (!dirs.length) { p.innerHTML = '<div class="sp-empty">Sin vínculo activo.</div>'; return; }
      if (!info.rows[sel.dir]) sel.dir = dirs[0].k;
      var row = info.rows[sel.dir];
      var catVis = (row.visibility && row.visibility[sel.cat]) || {};

      var h = '<div class="sp-panel" style="padding:10px;">';
      h += '<div class="sp-label" style="margin-bottom:6px;">Dirección</div>' +
           '<div style="display:flex;gap:6px;margin-bottom:10px;">';
      dirs.forEach(function(dd) {
        var on = dd.k === sel.dir;
        h += '<button class="sp-btn" style="flex:1;padding:6px;font-size:11px;' +
             (on ? 'background:var(--accent);color:#0b0e14;border-color:transparent;' : '') +
             '" onclick="visSetDir(\'' + pid + '\',\'' + dd.k + '\')">' + vinculosEsc(dd.label) + '</button>';
      });
      h += '</div>';
      h += '<div class="sp-label" style="margin-bottom:6px;">Categoría</div>' +
           '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">';
      VINCULOS_CATS.forEach(function(cc) {
        var on = cc[0] === sel.cat;
        h += '<button class="sp-btn" style="padding:5px 9px;font-size:11px;' +
             (on ? 'background:rgba(102,192,244,.18);border-color:rgba(102,192,244,.4);color:var(--accent);' : '') +
             '" onclick="visSetCat(\'' + pid + '\',\'' + cc[0] + '\')">' + cc[1] + '</button>';
      });
      h += '</div>';
      h += '<div class="sp-label" style="margin-bottom:6px;">Campos visibles — ' +
           vinculosEsc(sel.dir === 'out' ? 'lo que tú compartes' : 'lo que te comparte') + '</div>';
      VINCULOS_FIELDS.forEach(function(f) {
        var on = catVis[f[0]] === true;
        h += '<label class="sp-row" style="padding:6px 10px;">' +
             '<input type="checkbox" class="sp-check" id="vis-f-' + pid + '-' + f[0] + '"' + (on ? ' checked' : '') + '> ' +
             '<span class="sp-name" style="font-size:12px;">' + f[1] + '</span></label>';
      });
      h += '<div class="sp-hint">Aplica a todas las personas de ese tipo de vínculo según su propia matriz — esto edita solo esta relación.</div>';
      h += '<div class="sp-actions" style="margin-top:10px;">' +
           '<button class="sp-btn sp-btn-primary" onclick="vinculosGuardarVisibilidad(\'' + pid + '\')">Guardar</button></div>';
      h += '</div>';
      p.innerHTML = h;
    }

    async function vinculosGuardarVisibilidad(pid) {
      var info = (window._vincPorPid || {})[pid];
      var sel = visSel(pid);
      if (!info || !info.rows[sel.dir]) return;
      var row = info.rows[sel.dir];
      var vis = JSON.parse(JSON.stringify(row.visibility || {}));
      if (!vis[sel.cat]) vis[sel.cat] = {};
      VINCULOS_FIELDS.forEach(function(f) {
        var el = document.getElementById('vis-f-' + pid + '-' + f[0]);
        if (el) vis[sel.cat][f[0]] = el.checked;
      });
      try {
        var sb = await nexusSb();
        var r = await sb.from('library_links').update({ visibility: vis }).eq('id', row.link_id);
        if (r.error) throw new Error(r.error.message);
        row.visibility = vis;
        showToast && showToast('Visibilidad actualizada.', 'success');
        renderVisPanel(pid);
      } catch (e) {
        showToast && showToast('Error: ' + (e.message || ''), 'error');
      }
    }

    // ---- compartir tracking por item (Phase 5: is_private + shared_with) ----
    var _shareCtx = null; // {cat, id, k} k = 'angel'|'talmai' (mi sección)

    async function nexusFetchMyPrivacy(category, externalId) {
      var sb = await nexusSb();
      await nexusEnsureProfile();
      var mediaId = await nexusMediaId(category, externalId);
      if (!mediaId) return { is_private: false, shared_with: null };
      var r = await sb.from('user_media_tracking')
        .select('is_private,shared_with')
        .eq('profile_id', _nexusUser.id).eq('media_item_id', mediaId).maybeSingle();
      if (r.error) throw new Error(r.error.message);
      return r.data || { is_private: false, shared_with: null };
    }

    // muestra el botón "Compartir" solo en la sección del usuario logueado
    var _shareUiSeq = 0;
    async function nexusSyncShareUI(it) {
      if (!NEXUS_MODE || !it) return;
      var seq = ++_shareUiSeq;
      // sin perfil cargado nexusPersona() devuelve 'Yo' -> todas las secciones
      // quedarian como solo-lectura; esperar a que cargue primero
      try { await nexusEnsureProfile(); } catch (e) {}
      if (seq !== _shareUiSeq) return; // se abrio otro item mientras cargaba
      nexusItemPersonas(it).forEach(function(p) {
        var k = p.key;
        var box = document.getElementById('share-box-' + k);
        var btn = document.getElementById('btn-share-' + k);
        if (!box || !btn) return;
        if (!p.mine) {
          box.style.display = 'none';
          // Phase 5: la sección del vinculado es solo lectura
          var accR = document.getElementById('acc-' + k);
          if (accR) accR.classList.add('is-remote');
          return;
        }
        box.style.display = 'block';
        var accS = document.getElementById('acc-' + k);
        if (accS) accS.classList.remove('is-remote');
        btn.innerHTML = svgIcon('i-users', 'ico-sm') + ' Compartir…';
        nexusFetchMyPrivacy(currentCategory, it.id).then(function(st) {
          var sw = st.shared_with;
          var n = Array.isArray(sw) ? sw.length : 0;
          if (st.is_private) {
            btn.innerHTML = svgIcon('i-lock', 'ico-sm') + ' Privado';
            btn.style.color = '#ff8585'; btn.style.borderColor = 'rgba(255,133,133,.4)';
          } else if (n > 0) {
            btn.innerHTML = svgIcon('i-users', 'ico-sm') + ' Con ' + n + (n === 1 ? ' persona' : ' personas');
            btn.style.color = '#7ee0a3'; btn.style.borderColor = 'rgba(126,224,163,.4)';
          } else {
            btn.innerHTML = svgIcon('i-users', 'ico-sm') + ' Todos los vínculos';
            btn.style.color = ''; btn.style.borderColor = '';
          }
        }).catch(function() {});
      });
    }

    function nexusSharePanel(k) { return document.getElementById('share-panel-' + k); }

    async function toggleSharePanel(k) {
      if (!NEXUS_MODE || !currentItemId) return;
      var panel = nexusSharePanel(k);
      if (!panel) return;
      var sendPanel = nexusSendPanel(k);
      if (sendPanel) sendPanel.style.display = 'none';
      if (panel.style.display !== 'none' && panel.innerHTML) {
        panel.style.display = 'none';
        return;
      }
      panel.style.display = 'block';
      panel.innerHTML = '<div class="sp-empty">Cargando…</div>';
      _shareCtx = { cat: currentCategory, id: currentItemId, k: k };
      try {
        var d = await nexusMisVinculos();
        if (!_shareCtx || _shareCtx.k !== k) return; // usuario cambió de sección
        var st = await nexusFetchMyPrivacy(_shareCtx.cat, _shareCtx.id);
        renderSharePanel(st, d.links || []);
      } catch (e) {
        panel.innerHTML = '<div class="sp-empty" style="color:#ff8585;">Error: ' + vinculosEsc(e.message) + '</div>';
      }
    }

    var VINCULOS_BADGE_COLORS = {
      pareja:  { bg: '#ff8fa3', fg: '#2a0f16' },
      familia: { bg: '#ffd479', fg: '#2a1f08' },
      amigo:   { bg: '#66c0f4', fg: '#0b2436' },
      custom:  { bg: '#b39ddb', fg: '#1c1430' }
    };
    function vinculosTypeLabel(x) {
      if (x && x.link_type === 'custom' && x.link_label) return x.link_label;
      return VINCULOS_LINK_TYPES[x && x.link_type] || (x && x.link_type) || '';
    }

    function nexusLinkBadge(linkType, linkLabel) {
      var c = VINCULOS_BADGE_COLORS[linkType] || VINCULOS_BADGE_COLORS.custom;
      var label = (linkType === 'custom' && linkLabel) ? linkLabel
                : (VINCULOS_LINK_TYPES[linkType] || linkType || '');
      return '<span class="sp-badge" style="background:' + c.bg + '22;color:' + c.bg + ';border:1px solid ' + c.bg + '55;">' + vinculosEsc(label) + '</span>';
    }
    function nexusAvatar(name, color) {
      var ini = (name || '?').trim().charAt(0).toUpperCase();
      return '<span class="sp-avatar" style="background:' + color + ';">' + vinculosEsc(ini) + '</span>';
    }

    function renderSharePanel(st, links) {
      var k = _shareCtx.k;
      var panel = nexusSharePanel(k);
      var aceptados = (links || []).filter(function(x) {
        return x.status === 'accepted' && x.other && x.other.profile_id;
      });
      var vistos = {}, personas = [];
      aceptados.forEach(function(x) {
        var pid = x.other.profile_id;
        if (!vistos[pid]) { vistos[pid] = true; personas.push(x); }
      });

      var sw = Array.isArray(st.shared_with) ? st.shared_with : [];
      var h = '';

      h += '<div class="sp-label" style="color:#ff8585;">' + svgIcon('i-lock', 'ico-sm') + ' Privacidad de tu tracking</div>';

      // toggle privado
      h += '<label class="sp-row' + (st.is_private ? ' sp-row-danger' : '') + '">' +
           '<input type="checkbox" class="sp-check" id="share-privado-' + k + '"' + (st.is_private ? ' checked' : '') + '> ' +
           svgIcon('i-lock', 'ico-sm') + ' <span class="sp-name" style="font-size:12px;">Privado — nadie ve esto</span></label>';

      // audiencia (solo si no está privado)
      h += '<div id="share-aud-' + k + '" style="' + (st.is_private ? 'display:none;' : '') + 'margin-top:10px;">';
      h += '<div class="sp-label">Visible para</div>';
      h += '<label class="sp-row" style="padding:8px 10px;"><input type="radio" class="sp-check" name="share-mode-' + k + '"' + (sw.length === 0 ? ' checked' : '') + '> ' +
           '<span class="sp-name" style="font-size:12px;">Todos mis vínculos</span></label>';
      personas.forEach(function(x) {
        var pid = x.other.profile_id;
        var sel = sw.indexOf(pid) !== -1;
        var col = VINCULOS_BADGE_COLORS[x.link_type] ? VINCULOS_BADGE_COLORS[x.link_type].bg : '#66c0f4';
        h += '<label class="sp-row" style="padding:8px 10px;"><input type="checkbox" class="sp-check share-person-' + k + '" value="' + pid + '"' + (sel ? ' checked' : '') + '> ' +
             nexusAvatar(vinculosNombre(x.other), col) +
             '<span class="sp-name" style="font-size:12px;">' + vinculosEsc(vinculosNombre(x.other)) + '</span>' +
             nexusLinkBadge(x.link_type, x.link_label) + '</label>';
      });
      if (!personas.length) {
        h += '<div class="sp-empty">Sin vínculos aceptados — solo tú verás esto.</div>';
      }
      h += '</div>';
      h += '<div class="sp-hint">El candado es solo para ti — los demás nunca ven que existe.</div>';
      h += '<div class="sp-actions">' +
           '<button class="sp-btn sp-btn-primary" onclick="guardarSharePanel(\'' + k + '\')">Guardar</button>' +
           '<button class="sp-btn" onclick="nexusSharePanel(\'' + k + '\').style.display=\'none\'">Cerrar</button></div>';

      panel.innerHTML = h;
      var priv = document.getElementById('share-privado-' + k);
      priv.addEventListener('change', function() {
        var row = priv.closest('.sp-row');
        if (row) row.classList.toggle('sp-row-danger', priv.checked);
        document.getElementById('share-aud-' + k).style.display = priv.checked ? 'none' : 'block';
      });
    }

    // muestra/oculta acordeones por persona segun visible{Persona} y
    // colapsa el grid a 1 columna cuando solo queda una seccion
    function nexusSetAccordionVisibility(it) {
      var wrap = document.getElementById('tracking-personas');
      if (!wrap) return;
      var visibles = 0;
      nexusItemPersonas(it).forEach(function(p) {
        var acc = document.getElementById('acc-' + p.key);
        if (!acc) return;
        var oculto = it['visible' + p.suffix] === false;
        acc.style.display = oculto ? 'none' : '';
        if (!oculto) visibles++;
      });
      wrap.style.gridTemplateColumns = visibles > 1 ? '' : '1fr';
    }

    // refresca campos de personas/privacidad del item desde la DB al abrir el
    // modal — el cache local puede tener visible{Persona} viejo (TTL 12h)
    async function nexusRefreshItemPrivacy(it) {
      if (!NEXUS_MODE || !it) return;
      try {
        var sb = await nexusSb();
        var r = await sb.rpc('get_item_merged', {
          p_category: currentCategory, p_external_id: String(it.id)
        });
        if (r.error || !r.data || typeof r.data !== 'object') return;
        var fresh = r.data;
        var changed = false;
        Object.keys(fresh).forEach(function(k) {
          if (/^(visible|estado|estrellas|deseado|progreso|nota)/.test(k) && fresh[k] !== it[k]) {
            it[k] = fresh[k]; changed = true;
          }
        });
        if (changed) {
          nexusSetAccordionVisibility(it);
          try {
            localStorage.setItem('media_lib_' + CACHE_VERSION + '_' + currentCategory,
              JSON.stringify(itemsByCategory[currentCategory]));
          } catch (e) {}
        }
      } catch (e) {}
    }

    // ---- enviar item a un vínculo (Phase 5d: item_share_requests) ----
    function nexusSendPanel(k) { return document.getElementById('send-panel-' + k); }

    async function toggleSendPanel(k) {
      if (!NEXUS_MODE || !currentItemId) return;
      var panel = nexusSendPanel(k);
      var sharePanel = nexusSharePanel(k);
      if (sharePanel) sharePanel.style.display = 'none';
      if (panel.style.display !== 'none' && panel.innerHTML) {
        panel.style.display = 'none';
        return;
      }
      panel.style.display = 'block';
      panel.innerHTML = '<div class="sp-empty">Cargando…</div>';
      try {
        var d = await nexusMisVinculos();
        if (!nexusSendPanel(k) || nexusSendPanel(k).style.display === 'none') return;
        var vistos = {}, personas = [];
        (d.links || []).forEach(function(x) {
          if (x.status !== 'accepted' || !x.other || !x.other.profile_id) return;
          var pid = x.other.profile_id;
          if (!vistos[pid]) { vistos[pid] = true; personas.push(x); }
        });
        window._sendPersonas = window._sendPersonas || {};
        window._sendPersonas[k] = {};
        personas.forEach(function(x) { window._sendPersonas[k][x.other.profile_id] = vinculosNombre(x.other); });
        var h = '<div class="sp-label">' + svgIcon('i-send', 'ico-sm') + ' Enviar este elemento a</div>';
        if (!personas.length) {
          h += '<div class="sp-empty">No tienes vínculos aceptados.</div>';
        }
        personas.forEach(function(x) {
          var col = VINCULOS_BADGE_COLORS[x.link_type] ? VINCULOS_BADGE_COLORS[x.link_type].bg : '#66c0f4';
          h += '<button class="sp-row" onclick="nexusSendItem(\'' + k + '\',\'' + x.other.profile_id + '\')">' +
               nexusAvatar(vinculosNombre(x.other), col) +
               '<span class="sp-name">' + vinculosEsc(vinculosNombre(x.other)) + '</span>' +
               nexusLinkBadge(x.link_type, x.link_label) +
               svgIcon('i-chevron-down', 'ico-sm') + '</button>';
        });
        h += '<div class="sp-hint">Te llega una solicitud — al aceptarla, el elemento aparece en su biblioteca.</div>';
        h += '<div id="send-msg-' + k + '" class="sp-msg"></div>';
        panel.innerHTML = h;
      } catch (e) {
        panel.innerHTML = '<div class="sp-empty" style="color:#ff8585;">Error: ' + vinculosEsc(e.message) + '</div>';
      }
    }

    async function nexusSendItem(k, profileId) {
      var nombre = (window._sendPersonas && window._sendPersonas[k] && window._sendPersonas[k][profileId]) || 'la persona';
      var msg = document.getElementById('send-msg-' + k);
      if (msg) { msg.textContent = 'Enviando…'; msg.style.color = '#8f98a0'; }
      try {
        var sb = await nexusSb();
        var r = await sb.rpc('send_item_share', {
          p_category: currentCategory,
          p_external_id: String(currentItemId),
          p_to_profile_id: profileId
        });
        if (r.error) throw new Error(r.error.message);
        if (msg) { msg.textContent = 'Enviado a ' + nombre + ' — esperando confirmación.'; msg.style.color = '#7ee0a3'; }
        showToast && showToast('Elemento enviado a ' + nombre, 'success');
      } catch (e) {
        if (msg) { msg.textContent = e.message || 'Error'; msg.style.color = '#ff8585'; }
      }
    }

    async function guardarSharePanel(k, persona) {
      if (!_shareCtx || _shareCtx.k !== k || !currentItemId) return;
      var priv = document.getElementById('share-privado-' + k);
      var isPrivate = priv && priv.checked;
      var sw = [];
      if (!isPrivate) {
        document.querySelectorAll('.share-person-' + k + ':checked').forEach(function(c) { sw.push(c.value); });
      }
      try {
        await nexusTrackingUpsert(_shareCtx.cat, _shareCtx.id, {
          is_private: isPrivate,
          shared_with: (isPrivate || sw.length === 0) ? null : sw
        });
        var ctx = _shareCtx;
        nexusSharePanel(k).style.display = 'none';
        nexusSyncShareUI({ id: ctx.id });
        showToast && showToast('Privacidad actualizada.', 'success');
      } catch (e) {
        showToast && showToast('Error: ' + (e.message || ''), 'error');
      }
    }
  </script>

  <script>
    const CATEGORY_ORDER = ['Juegos', 'Peliculas_Series', 'Libros', 'Mangas', 'Estadisticas'];
    var currentCategory = 'Juegos';
    var elementosPorPagina = 36;
    var paginaActual = 1;
    var observer = null;
    var itemsByCategory = { Juegos: [], Peliculas_Series: [], Libros: [], Mangas: [] };
    var filteredItems = [];

    // ---- personas dinámicas (Phase 5: multi-vínculo) ----
    // get_items_merged emite campos sufijados por persona: estado{Sufijo},
    // visible{Sufijo}, etc. Sufijo = initcap(username) — ver phase5h_username.sql.
    // 'estadoEmision'/'notaParche' son campos de catálogo — se excluyen.
    var PERSONA_PALETTE = ['#66c0f4', '#ff4d6d', '#7ee0a3', '#ffd479', '#b48cff', '#ff9f43', '#54e0c7', '#f368e0'];
    var _personas = []; // registro global [{suffix,key,color}] ordenado alfabético

    function nexusScanItemPersonas(it, set) {
      Object.keys(it || {}).forEach(function(k) {
        var m = k.match(/^(?:estado|visible|username)([A-Z][A-Za-zÀ-ÿ0-9_]*)$/);
        if (m && m[1] !== 'Emision') set[m[1]] = true;
      });
    }

    function nexusRebuildPersonas() {
      var set = {}, labels = {};
      Object.keys(itemsByCategory).forEach(function(c) {
        var arr = itemsByCategory[c] || [];
        for (var i = 0; i < Math.min(arr.length, 3); i++) {
          var it = arr[i];
          nexusScanItemPersonas(it, set);
          Object.keys(it || {}).forEach(function(k) {
            var m = k.match(/^username([A-Z][A-Za-zÀ-ÿ0-9_]*)$/);
            if (m && it[k] && !labels[m[1]]) labels[m[1]] = String(it[k]);
          });
        }
      });
      var sufs = Object.keys(set).sort(function(a, b) { return a.localeCompare(b); });
      _personas = sufs.map(function(suf, i) {
        return { suffix: suf, key: suf.toLowerCase(), color: PERSONA_PALETTE[i % PERSONA_PALETTE.length],
                 label: labels[suf] || suf };
      });
    }

    // nombre visible de una persona: username{Suf} del item > label global > sufijo
    function nexusPersonaLabel(it, suf) {
      var v = it && it['username' + suf];
      if (v) return String(v);
      var g = (_personas || []).filter(function(p) { return p.suffix === suf; })[0];
      return g ? g.label : suf;
    }

    // personas de UN item concreto (modal): mi persona primero, resto alfabético
    function nexusItemPersonas(it) {
      var set = {};
      nexusScanItemPersonas(it, set);
      var yo = String(nexusPersona() || '').toLowerCase();
      var sufs = Object.keys(set).sort(function(a, b) {
        var am = a.toLowerCase() === yo, bm = b.toLowerCase() === yo;
        if (am !== bm) return am ? -1 : 1;
        return a.localeCompare(b);
      });
      var cmap = {};
      (_personas || []).forEach(function(p) { cmap[p.suffix] = p; });
      return sufs.map(function(suf) {
        var g = cmap[suf];
        return { suffix: suf, key: suf.toLowerCase(), mine: suf.toLowerCase() === yo,
                 color: (g && g.color) || PERSONA_PALETTE[0],
                 label: nexusPersonaLabel(it, suf) };
      });
    }

    // dot de color de persona para chips/badges
    function nexusPersonaDot(p, size) {
      var s = size || 14;
      return '<span style="display:inline-flex;align-items:center;justify-content:center;width:' + s + 'px;height:' + s +
        'px;border-radius:50%;background:' + p.color + ';color:#0b0e14;font-size:' + Math.round(s * 0.55) +
        'px;font-weight:800;flex-shrink:0;">' + vinculosEsc(p.suffix.charAt(0)) + '</span>';
    }

    // reconstruye los controles de filtro por persona (estado, nota mín.,
    // deseados, orden) — preserva selecciones actuales
    function nexusRenderFilterPersonas() {
      var wrap = document.getElementById('filter-personas');
      var selDeseado = document.getElementById('filter-deseado');
      var selOrden = document.getElementById('filter-orden');
      var prevDeseado = selDeseado ? selDeseado.value : 'todos';
      var prevOrden = selOrden ? selOrden.value : 'az';
      var prevEst = {}, prevNota = {};
      (_personas || []).forEach(function(p) {
        var e = document.getElementById('filter-est-' + p.key);
        var n = document.getElementById('filter-nota-' + p.key);
        if (e) prevEst[p.key] = e.value;
        if (n) prevNota[p.key] = n.value;
      });

      var h = '';
      (_personas || []).forEach(function(p) {
        h += '<div class="filter-group"><label>' + nexusPersonaDot(p, 12) + ' ' + vinculosEsc(p.label || p.suffix) + ' (Estado)</label>' +
             '<select id="filter-est-' + p.key + '" onchange="filtrarItems()">' +
             '<option value="todos">Todos</option><option value="No jugado">Pendiente</option>' +
             '<option value="En proceso">En proceso</option><option value="Completado">Completado</option></select></div>';
        h += '<div class="filter-group"><label><svg class="ico ico-sm ico-gold"><use href="#i-star"/></svg> Nota Mínima ' + vinculosEsc(p.label || p.suffix) + '</label>' +
             '<select id="filter-nota-' + p.key + '" onchange="filtrarItems()">' +
             '<option value="0">Todas las notas</option><option value="5">5+ (5/10 o superior)</option>' +
             '<option value="7">7+ (7/10 o superior)</option><option value="9">9+ (9/10 o superior)</option></select></div>';
      });
      if (wrap) wrap.innerHTML = h;
      (_personas || []).forEach(function(p) {
        var e = document.getElementById('filter-est-' + p.key);
        var n = document.getElementById('filter-nota-' + p.key);
        if (e) e.value = prevEst[p.key] || 'todos';
        if (n) n.value = prevNota[p.key] || '0';
      });

      // deseados: todos / cualquiera / ninguno / solo:{key} / all
      if (selDeseado) {
        var dh = '<option value="todos">Todos</option><option value="cualquiera">Cualquiera</option>' +
                 '<option value="ninguno">Ninguno</option>';
        (_personas || []).forEach(function(p) {
          dh += '<option value="solo:' + p.key + '">Solo ' + vinculosEsc(p.label || p.suffix) + '</option>';
        });
        if ((_personas || []).length > 1) dh += '<option value="all">Todos por igual</option>';
        selDeseado.innerHTML = dh;
        selDeseado.value = prevDeseado;
        if (selDeseado.value !== prevDeseado) selDeseado.value = 'todos';
      }

      // orden por nota de cada persona
      if (selOrden) {
        var oh = '<option value="az">Alfabético (A - Z)</option><option value="za">Alfabético (Z - A)</option>' +
                '<option value="recientes">Últimos añadidos</option>';
        (_personas || []).forEach(function(p) {
          oh += '<option value="nota:' + p.key + '">Nota de ' + vinculosEsc(p.label || p.suffix) + '</option>';
        });
        oh += '<option value="puntuacion">Puntuación</option>';
        selOrden.innerHTML = oh;
        selOrden.value = prevOrden;
        if (selOrden.value !== prevOrden) selOrden.value = 'az';
      }
    }
    var currentItemId = '';
    var currentTrailerUrl = '';
    var busquedaFiltroActiva = false;
    var hlsInstance = null;
    var MAX_CACHE_AGE = 12 * 60 * 60 * 1000;
    const CACHE_VERSION = 'v22';
    var currentStatsProfile = 'ambos';
    var currentStatsCategory = 'todas';

    const CAT_CONFIG = {
      Juegos: { label: 'Juegos', icon: 'i-gamepad', searchPlaceholder: 'Filtrar juegos por título, dev, género o tag...', addPlaceholder: 'AppID, URL o nombre...', poster: false },
      Peliculas_Series: { label: 'Cine y Series', icon: 'i-film', searchPlaceholder: 'Filtrar películas, series y animes...', addPlaceholder: 'Buscar película, serie o URL...', poster: true },
      Libros: { label: 'Libros', icon: 'i-book', searchPlaceholder: 'Filtrar libros por título, autor o género...', addPlaceholder: 'Buscar libro, autor o ISBN...', poster: true },
      Mangas: { label: 'Mangas', icon: 'i-manga', searchPlaceholder: 'Filtrar mangas por título, mangaka o género...', addPlaceholder: 'Buscar manga o URL...', poster: true },
      Estadisticas: { label: 'Estadísticas', icon: 'i-stats', searchPlaceholder: '', addPlaceholder: '', poster: false }
    };

    function svgIcon(id, cls) {
      return `<svg class="ico${cls ? ' ' + cls : ''}"><use href="#${id}"/></svg>`;
    }

    function debounce(fn, ms) {
      let t;
      return function(...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), ms); };
    }
    const filtrarItemsDebounced = debounce(() => filtrarItems(), 220);

    function showToast(msg, type) {
      var c = document.getElementById('toast-container');
      var t = document.createElement('div');
      t.className = 'toast' + (type ? ' ' + type : '');
      t.innerText = msg;
      c.appendChild(t);
      requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 220); }, 3000);
    }

    /* NAVEGACIÓN POR DESLIZAMIENTO HORIZONTAL (SWIPE) ENTRE PESTAÑAS */
    function inicializarGestosSwipe() {
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartTime = 0;
      let swipeIgnorado = false;

      document.addEventListener('touchstart', function(e) {
        if (e.touches.length !== 1) { swipeIgnorado = true; return; }
        const t = e.target;
        const hayModal =
          document.getElementById('modal').style.display === 'flex' ||
          document.getElementById('modal-papelera').style.display === 'flex' ||
          document.getElementById('modal-match').style.display === 'flex' ||
          document.getElementById('panel-filtros').classList.contains('open');

        if (hayModal || t.closest('.carousel, .category-tabs, .stats-selectors-row, input, textarea, select')) {
          swipeIgnorado = true;
          return;
        }
        swipeIgnorado = false;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
      }, { passive: true });

      document.addEventListener('touchend', function(e) {
        if (swipeIgnorado || e.changedTouches.length !== 1) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        const dt = Date.now() - touchStartTime;

        if (dt < 550 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) {
          const idx = CATEGORY_ORDER.indexOf(currentCategory);
          if (idx === -1) return;
          if (dx < 0 && idx < CATEGORY_ORDER.length - 1) {
            cambiarCategoria(CATEGORY_ORDER[idx + 1]);
          } else if (dx > 0 && idx > 0) {
            cambiarCategoria(CATEGORY_ORDER[idx - 1]);
          }
        }
      }, { passive: true });
    }

    window.onload = function() {
      if (NEXUS_MODE) { nexusBoot(nexusInitApp); return; }
      nexusInitApp();
    };

    function nexusInitApp() {
      var btnVinc = document.getElementById('btn-vinculos');
      if (btnVinc && NEXUS_MODE) {
        btnVinc.style.display = '';
        nexusRefreshVinculosBadge();
        setInterval(nexusRefreshVinculosBadge, 60000);
      }
      configurarFiltrosCategoria('Juegos');
      cargarCategoria('Juegos', false);
      ['Peliculas_Series', 'Libros', 'Mangas'].forEach(c => precargarCategoriaSilenciosa(c));
      inicializarGestosSwipe();
      var inputBuscarEl = document.getElementById('inputBuscar');
      if (inputBuscarEl) {
        inputBuscarEl.addEventListener('focus', function() {
          cerrarBusquedaAgregar();
          if (!busquedaFiltroActiva) {
            busquedaFiltroActiva = true;
            history.pushState({ sf: true }, '', window.location.href);
          }
        });
        inputBuscarEl.addEventListener('click', function() { cerrarBusquedaAgregar(); });
      }
      var lastScrollY = window.scrollY || window.pageYOffset || 0;
      window.addEventListener('scroll', function() {
        var curY = window.scrollY || window.pageYOffset || 0;
        if (Math.abs(curY - lastScrollY) > 6 && document.getElementById('add-wrapper-box').classList.contains('expanded')) {
          cerrarBusquedaAgregar();
        }
        lastScrollY = curY;
      }, { passive: true });
      var swipeStartX = 0, swipeStartY = 0;
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
          swipeStartX = e.touches[0].clientX;
          swipeStartY = e.touches[0].clientY;
        }
      }, { passive: true });
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length !== 1) return;
        if (!document.getElementById('add-wrapper-box').classList.contains('expanded')) return;
        
        // No cerrar si el toque se origina dentro del dropdown de resultados
        if (e.target.closest('#search-dropdown')) return;

        var dx = Math.abs(e.touches[0].clientX - swipeStartX);
        var dy = Math.abs(e.touches[0].clientY - swipeStartY);
        if (dx > 18 || dy > 18) {
          cerrarBusquedaAgregar();
        }
      }, { passive: true });

      window.addEventListener('popstate', function(event) {
        var dropdown = document.getElementById('search-dropdown');
        var panelFiltros = document.getElementById('panel-filtros');
        var modalDetalle = document.getElementById('modal');
        var modalPapelera = document.getElementById('modal-papelera');
        var modalMatch = document.getElementById('modal-match');

        if (modalDetalle.style.display === 'flex') { cerrarModal(); history.pushState(null, '', window.location.href); }
        else if (modalPapelera.style.display === 'flex') { cerrarPapelera(); history.pushState(null, '', window.location.href); }
        else if (modalMatch.style.display === 'flex') { cerrarMatchModal(); history.pushState(null, '', window.location.href); }
        else if (panelFiltros.classList.contains('open')) {
          panelFiltros.classList.remove('open');
          document.getElementById('btn-toggle-filtros').classList.remove('active');
          history.pushState(null, '', window.location.href);
        }
        else if (busquedaFiltroActiva || document.activeElement === document.getElementById('inputBuscar')) {
          busquedaFiltroActiva = false;
          document.getElementById('inputBuscar').blur();
          history.pushState(null, '', window.location.href);
        }
        else if (dropdown.classList.contains('open') || document.activeElement === document.getElementById('inputAgregar') || document.getElementById('add-wrapper-box').classList.contains('expanded')) {
          cerrarBusquedaAgregar();
          history.pushState(null, '', window.location.href);
        }
      });
      history.pushState(null, '', window.location.href);

      document.addEventListener('click', function(e) {
        var panel = document.getElementById('panel-filtros');
        var btn = document.getElementById('btn-toggle-filtros');
        if (panel.classList.contains('open') && !panel.contains(e.target) && !btn.contains(e.target)) {
          panel.classList.remove('open');
          btn.classList.remove('active');
        }
        var dd = document.getElementById('search-dropdown');
        var addWrap = document.querySelector('.add-wrapper');
        if (dd && dd.classList.contains('open') && !addWrap.contains(e.target)) {
          cerrarBusquedaAgregar();
        }
      });
    };

    function precargarCategoriaSilenciosa(cat) {
      try {
        var raw = localStorage.getItem(`media_lib_${CACHE_VERSION}_${cat}`);
        var ts = localStorage.getItem(`media_lib_time_${CACHE_VERSION}_${cat}`);
        if (raw && ts && (Date.now() - Number(ts) < MAX_CACHE_AGE)) {
          itemsByCategory[cat] = JSON.parse(raw);
          return;
        }
      } catch (e) {}

      RUN
        .withSuccessHandler(function(lista) {
          itemsByCategory[cat] = Array.isArray(lista) ? lista : [];
          try {
            localStorage.setItem(`media_lib_${CACHE_VERSION}_${cat}`, JSON.stringify(itemsByCategory[cat]));
            localStorage.setItem(`media_lib_time_${CACHE_VERSION}_${cat}`, String(Date.now()));
          } catch (e) {}
          if (currentCategory === 'Estadisticas') renderizarEstadisticas();
        })
        .getItems(cat);
    }

    function activarModoBusquedaAgregar(activar) {
      var box = document.getElementById('add-wrapper-box');
      var rightCtrls = document.getElementById('right-ctrls');
      if (activar && !box.classList.contains('expanded')) {
        box.classList.add('expanded');
        rightCtrls.classList.add('hidden');
        history.pushState(null, '', window.location.href);
      }
    }

    function syncAddClearBtn() {
      var box = document.getElementById('add-wrapper-box');
      var inp = document.getElementById('inputAgregar');
      if (box && inp) box.classList.toggle('has-text', inp.value.trim().length > 0);
    }

    function cerrarBusquedaAgregar(soloLimpiar) {
      var input = document.getElementById('inputAgregar');
      input.value = '';
      syncAddClearBtn();
      document.getElementById('search-dropdown').classList.remove('open');
      if (soloLimpiar) {
        activarModoBusquedaAgregar(true);
        input.focus();
        return;
      }
      document.getElementById('add-wrapper-box').classList.remove('expanded');
      document.getElementById('right-ctrls').classList.remove('hidden');
      if (document.activeElement === input) input.blur();

    const autocompletarAgregarDebounced = debounce(function() {
      var val = document.getElementById('inputAgregar').value.trim();
      if (val.length < 3) {
        document.getElementById('search-dropdown').classList.remove('open');
        return;
      }
      var esUrlOId = /^\d+$/.test(val) || val.includes('http://') || val.includes('https://') || /^(movie|tv|al)-\d+$/i.test(val);
      if (!esUrlOId) manejarAgregar(true);
    }, 500);

    function cambiarCategoria(cat) {
      if (cat === currentCategory) return;
      currentCategory = cat;
      paginaActual = 1;

      var panel = document.getElementById('panel-filtros');
      if (panel.classList.contains('open')) {
        panel.classList.remove('open');
        document.getElementById('btn-toggle-filtros').classList.remove('active');
      }

      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-cat') === cat);
      });

      var grid = document.getElementById('grid');
      var statsView = document.getElementById('stats-view');
      var controlsBox = document.getElementById('main-controls-box');
      var statsBar = document.getElementById('stats-bar');

      if (cat === 'Estadisticas') {
        grid.style.display = 'none';
        statsBar.style.display = 'none';
        controlsBox.style.display = 'none';
        statsView.style.display = 'flex';
        document.body.classList.add('view-stats');
        ['Juegos', 'Peliculas_Series', 'Libros', 'Mangas'].forEach(c => precargarCategoriaSilenciosa(c));
        renderizarEstadisticas();
        return;
      } else {
        document.body.classList.remove('view-stats');
        controlsBox.style.display = 'flex';
        statsView.style.display = 'none';
        grid.style.display = 'grid';
      }

      var cfg = CAT_CONFIG[cat];
      document.getElementById('inputBuscar').value = '';
      document.getElementById('inputBuscar').placeholder = cfg.searchPlaceholder;
      document.getElementById('inputAgregar').value = '';
      document.getElementById('inputAgregar').placeholder = cfg.addPlaceholder;
      cerrarBusquedaAgregar();

      grid.classList.toggle('poster-mode', cfg.poster);

      configurarFiltrosCategoria(cat);
      resetFiltros(true);
      cargarCategoria(cat, false);
    }

    function cargarCategoria(cat, forzarRed) {
      if (cat === 'Estadisticas') return;
      if (!forzarRed) {
        try {
          var raw = localStorage.getItem(`media_lib_${CACHE_VERSION}_${cat}`);
          var ts = localStorage.getItem(`media_lib_time_${CACHE_VERSION}_${cat}`);
          if (raw && ts && (Date.now() - Number(ts) < MAX_CACHE_AGE)) {
            itemsByCategory[cat] = JSON.parse(raw);
            nexusRebuildPersonas();
            nexusRenderFilterPersonas();
            filtrarItems();
            return;
          }
        } catch (e) {}
      }

      var grid = document.getElementById('grid');
      if (currentCategory === cat) {
        grid.innerHTML = '<div class="spinner-container"><div class="spinner"></div><div style="color:var(--accent);font-weight:700;">Cargando ' + CAT_CONFIG[cat].label + '...</div></div>';
      }

      RUN
        .withSuccessHandler(function(lista) {
          itemsByCategory[cat] = Array.isArray(lista) ? lista : [];
          try {
            localStorage.setItem(`media_lib_${CACHE_VERSION}_${cat}`, JSON.stringify(itemsByCategory[cat]));
            localStorage.setItem(`media_lib_time_${CACHE_VERSION}_${cat}`, String(Date.now()));
          } catch (e) {}
          nexusRebuildPersonas();
          nexusRenderFilterPersonas();
          if (currentCategory === cat) filtrarItems();
          else if (currentCategory === 'Estadisticas') renderizarEstadisticas();
        })
        .withFailureHandler(function(err) {
          if (currentCategory === cat) {
            grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;color:#ff6b6b;">Error: ' + escaparHTML(err.message) + '</p>';
          }
        })
        .getItems(cat);
    }

    function forzarSincronizacion() {
      if (currentCategory === 'Estadisticas') {
        ['Juegos', 'Peliculas_Series', 'Libros', 'Mangas'].forEach(c => cargarCategoria(c, true));
        showToast('Actualizando estadísticas...', 'success');
      } else {
        cargarCategoria(currentCategory, true);
      }
    }

        f2.innerHTML = '<label>Steam Deck</label><select id="f-extra-2" onchange="filtrarItems()"><option value="todos">Todos</option><option value="Verificado">Verificado</option><option value="Jugable">Jugable</option></select>';
        f3.innerHTML = '<label>Precio</label><select id="f-extra-3" onchange="filtrarItems()"><option value="todos">Todos</option><option value="gratis">Gratis</option><option value="pago">De Pago</option></select>';

        f2.innerHTML = '<label>Plataforma</label><select id="f-extra-2" onchange="filtrarItems()"><option value="todos">Todas</option><option value="Netflix">Netflix</option><option value="Crunchyroll">Crunchyroll</option><option value="Max">Max</option><option value="Prime">Prime Video</option><option value="Disney">Disney+</option></select>';

        f2.innerHTML = '<label>Demografía</label><select id="f-extra-2" onchange="filtrarItems()"><option value="todos">Todas</option><option value="Shounen">Shounen</option><option value="Seinen">Seinen</option><option value="Shoujo">Shoujo</option><option value="Josei">Josei</option></select>';

    function toggleFiltros(e) {
      e.stopPropagation();
      cerrarBusquedaAgregar();
      var panel = document.getElementById('panel-filtros');
      panel.classList.toggle('open');
      document.getElementById('btn-toggle-filtros').classList.toggle('active');
      if (panel.classList.contains('open')) {
        history.pushState(null, '', window.location.href);
      }
