<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <link rel="preconnect" href="https://cdn.cloudflare.steamstatic.com" crossorigin>
  <link rel="preconnect" href="https://covers.openlibrary.org" crossorigin>
  <link rel="preconnect" href="https://s4.anilist.co" crossorigin>
  <meta name="theme-color" content="#0b0e14">
  <meta name="description" content="NexusLib — biblioteca personal de películas, series, libros y juegos.">

  <meta name="twitter:description" content="Biblioteca personal de películas, series, libros y juegos.">
  <meta name="twitter:image" content="https://angellrnzo.github.io/nexuslib/icons/icon-512.png">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" media="print" onload="this.media='all'">
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #1b2838;
      --accent: #66c0f4;
      --text: #c7d5e0;
      --gold: #ffd700;
      --border: rgba(255,255,255,0.1);
      --btn-primary: #66c0f4;
      --success: #5ba32b;
      --warning: #d6a918;
      --danger: #c93b3b;
      --wish: #ff4d6d;
      --angel-color: #66c0f4;
      --talmai-color: #ff4d6d;
      --t-fast: 150ms;
      --t-base: 220ms;
      --t-slow: 320ms;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-inout: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --t-micro: 100ms;
      --t-pop: 260ms;
    }

    * { box-sizing: border-box; }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      background: radial-gradient(circle at top left, #1b2838, #0b0e14 80%);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: calc(160px + env(safe-area-inset-top, 0px)) 12px calc(30px + env(safe-area-inset-bottom, 0px)) 12px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      touch-action: pan-y;
    }

    body.modal-open { overflow: hidden; }
    body.view-stats {
      padding-top: calc(62px + env(safe-area-inset-top, 0px));
    }

    /* ICONOS PLANOS VECTORIALES (SVG) */
    .ico {
      width: 14px;
      height: 14px;
      display: inline-block;
      vertical-align: -2px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .ico-sm { width: 12px; height: 12px; vertical-align: -1.5px; }
    .ico-lg { width: 16px; height: 16px; }
    .ico-fill { fill: currentColor; stroke: none; }
    .ico-angel { color: var(--angel-color); }
    .ico-talmai { color: var(--talmai-color); }
    .ico-gold { color: var(--gold); fill: var(--gold); stroke: none; }
    .ico-wish { color: var(--wish); fill: var(--wish); stroke: none; }

    .card, .btn, .tab-btn, .modal-close, .player-summary, .star, .accordion summary, .status-select, .filter-group select, .filter-reset,  .wish-toggle, .btn-trailer {
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #2a475e; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    #app-screen { max-width: 1400px; margin: 0 auto; width: 100%; }

    .top-header {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: 10px;
      right: 10px;
      width: auto;
      max-width: 1400px;
      margin: 0 auto;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: transparent;
    }

    .category-tabs {
      display: flex;
      gap: 4px;
      background: rgba(16, 24, 36, 0.98);
      padding: 4px 6px;
      border-radius: 30px;
      border: 1px solid rgba(102, 192, 244, 0.22);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 1;
      min-width: max-content;
      padding: 6px 10px;
      border: none;
      border-radius: 20px;
      background: transparent;
      color: #8f98a0;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background-color var(--t-base) var(--ease-inout), color var(--t-base) var(--ease-inout), box-shadow var(--t-base) var(--ease-inout);
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0b0e14;
      box-shadow: 0 2px 10px rgba(102, 192, 244, 0.4);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: linear-gradient(180deg, rgba(27, 40, 56, 0.99) 0%, rgba(20, 30, 45, 0.99) 100%);
      padding: 6px 10px;
      border-radius: 16px;
      border: 1px solid rgba(102, 192, 244, 0.25);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-width: 0;
    }

    .search-wrapper {
      flex-grow: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 20px;
      padding: 0 12px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .search-wrapper:focus-within { border-color: var(--accent); }
    .search-wrapper .ico { margin-right: 8px; color: #8f98a0; }
    #inputBuscar { width: 100%; min-width: 0; border: none; background: transparent; color: white; outline: none; font-family: 'Inter', sans-serif; font-size: 13px; }

    .add-wrapper {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 20px;
      padding: 0 4px 0 10px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      flex-grow: 1;
      min-width: 0;
      transition: flex-grow var(--t-slow) var(--ease-inout), width var(--t-slow) var(--ease-inout), background-color var(--t-slow) var(--ease-inout), border-color var(--t-slow) var(--ease-inout), box-shadow var(--t-slow) var(--ease-inout);
    }
    .add-wrapper.expanded {
      flex-grow: 1;
      width: 100%;
      background: rgba(11, 14, 20, 0.98);
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(102, 192, 244, 0.4);
    }
    
    .btn-clear-add {
      background: transparent; border: none; color: #8f98a0; cursor: pointer;
      width: 24px; height: 24px; border-radius: 50%; display: none;
      align-items: center; justify-content: center; flex-shrink: 0; padding: 0;
    }
    .btn-clear-add:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .add-wrapper.has-text .btn-clear-add { display: inline-flex; }

    #inputAgregar { width: 100%; min-width: 0; border: none; background: transparent; color: white; outline: none; font-family: 'Inter', sans-serif; font-size: 13px; }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      opacity: 1;
      max-width: 250px;
      overflow: hidden;
      transition: flex-grow var(--t-slow) var(--ease-inout), width var(--t-slow) var(--ease-inout), background-color var(--t-slow) var(--ease-inout), border-color var(--t-slow) var(--ease-inout), box-shadow var(--t-slow) var(--ease-inout), transform var(--t-slow) var(--ease-inout), opacity var(--t-slow) var(--ease-inout);
    }
    .right-controls.hidden {
      opacity: 0;
      transform: translateX(20px);
      max-width: 0;
      gap: 0;
      pointer-events: none;
    }

    .search-results-dropdown {
      display: none;
      position: absolute;
      top: 42px;
      left: 0;
      width: 100%;
      max-height: 280px;
      overflow-y: auto;
      background: rgba(20, 30, 45, 0.99);
      border: 1px solid rgba(102, 192, 244, 0.45);
      border-radius: 12px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.9);
      z-index: 10001;
      padding: 6px;
    }
    .search-results-dropdown.open { display: block; }
    .search-result-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color var(--t-fast) var(--ease-out);
    }
    .search-result-item:hover { background: rgba(102, 192, 244, 0.16); }
    .search-result-item img {
      width: 34px; height: 48px; object-fit: cover; border-radius: 5px; background: #111; flex-shrink: 0;
    }
    .search-result-info { flex: 1; min-width: 0; }
    .search-result-title { font-size: 12px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-result-sub { font-size: 10px; color: #8f98a0; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-result-badge { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 10px; background: rgba(102,192,244,0.18); color: var(--accent); flex-shrink: 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      border: none; cursor: pointer; font-weight: 700;
      position: relative; overflow: hidden; font-size: 13px; flex-shrink: 0;
      transition: transform var(--t-fast) var(--ease-out), background-color var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out), box-shadow var(--t-fast) var(--ease-out), opacity var(--t-fast) var(--ease-out);
    }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-circle {
      width: 32px; height: 32px; border-radius: 50%; padding: 0;
      background: rgba(42, 71, 94, 0.85); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-circle.active { background: var(--accent); color: #0b0e14; border-color: var(--accent); }
    .btn-circle.has-filters { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(102, 192, 244, 0.25); }
    .btn-circle.has-filters::after {
      content: ''; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px;
      border-radius: 50%; background: #a4d007;
    }

    .btn-primary {
      background: var(--btn-primary); color: #0b0e14; border-radius: 50%;
      width: 26px; height: 26px; padding: 0; font-size: 15px; font-weight: 900; flex-shrink: 0;
    }
    .btn-text {
      background: var(--btn-primary); color: #0b0e14; border-radius: 8px;
      padding: 10px 16px; font-size: 13px; width: auto; height: auto;
    }
    .btn-text:hover { filter: brightness(1.1); }

    #progress-container {
      width: 100%; display: none; margin-top: 2px;
      background: rgba(0,0,0,0.8); border-radius: 8px; overflow: hidden; height: 16px; position: relative;
    }
    #progress-bar { height: 100%; background: linear-gradient(90deg, var(--warning), #ffeb3b); width: 0%; transition: width var(--t-slow) var(--ease-out); }
    #progress-text {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: bold; color: #0b0e14;
    }

    .stats-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; margin-top: 6px; }
    .stat-pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px;
      background: rgba(24, 35, 50, 0.78); border: 1px solid rgba(102, 192, 244, 0.16);
      font-size: 11px; font-weight: 700; color: #c7d5e0;
    }
    .stat-pill strong { color: #fff; }

    /* PANEL DE FILTROS */
    .menu-wrap { position: relative; flex-shrink: 0; }
    .menu-panel {
      position: fixed; top: 0; right: 0; min-width: 210px; max-width: calc(100vw - 16px);
      background: linear-gradient(180deg, rgba(27,40,56,.99) 0%, rgba(18,27,40,.99) 100%);
      border: 1px solid rgba(102,192,244,.35); border-radius: 14px;
      padding: 6px; box-shadow: 0 14px 40px rgba(0,0,0,.85);
      display: none; flex-direction: column; gap: 2px; z-index: 9999;
    }
    .menu-panel.open { display: flex; animation: menuIn var(--t-fast) var(--ease-out); }
    @keyframes menuIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .menu-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 10px 12px; border: none; border-radius: 9px; background: transparent;
      color: var(--text); font-size: 13px; font-weight: 600; font-family: inherit;
      cursor: pointer; text-align: left; transition: background var(--t-fast) var(--ease-out);
    }
    .menu-item:hover { background: rgba(102,192,244,.12); }
    .menu-sep { height: 1px; background: var(--border); margin: 4px 6px; }
    .menu-badge {
      display: none; margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 99px; background: #ff4d6d; color: #fff; font-size: 10px;
      font-weight: 800; line-height: 18px; text-align: center;
    }
    .perfil-accordion {
      background: linear-gradient(135deg, rgba(102,192,244,.12), rgba(187,134,252,.10));
      border: 1px solid rgba(102,192,244,.3); border-radius: 16px;
      overflow: hidden;
      transition: border-color var(--t-base) var(--ease-out), box-shadow var(--t-base) var(--ease-out);
    }
    .perfil-accordion:has(.perfil-edit.open) {
      border-color: rgba(102,192,244,.55);
      box-shadow: 0 0 0 1px rgba(102,192,244,.35), 0 0 24px rgba(102,192,244,.20), 0 0 42px rgba(187,134,252,.12), 0 12px 32px rgba(0,0,0,.30);
    }
    .stats-profile-card {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 18px;
    }
    .stats-profile-avatar {
      width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 900; color: #fff;
      background: linear-gradient(135deg, #66c0f4, #bb86fc);
    }
    .stats-profile-info { flex: 1; min-width: 0; }
    .stats-profile-name { font-size: 17px; font-weight: 800; color: var(--text); }
    .stats-profile-user { font-size: 12px; color: var(--accent); font-weight: 600; }
    .stats-profile-email { font-size: 11px; color: #8f98a0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stats-profile-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .stats-profile-actions .btn {
      height: 34px; padding: 0 14px; font-size: 12px; font-weight: 700;
      border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
      white-space: nowrap;
      background: rgba(102,192,244,.12); color: var(--accent);
      border: 1px solid rgba(102,192,244,.35);
      transition: background var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out);
    }
    .stats-profile-actions .btn:hover { background: rgba(102,192,244,.22); }
    .stats-profile-actions .btn.open {
      background: rgba(102,192,244,.28); border-color: var(--accent);
    }
    .perfil-edit {
      max-height: 0; opacity: 0; overflow: hidden; margin-top: 0;
      transition: max-height .32s var(--ease-out), opacity .22s var(--ease-out), margin .32s var(--ease-out);
    }
    .perfil-edit.open { max-height: 640px; opacity: 1; }
    /* perfil-edit vive dentro de .perfil-accordion: un solo contenedor
       (patron .player-accordion) — el glow rodea la pieza entera */
    .perfil-edit-inner {
      border-top: 1px solid rgba(102,192,244,.16);
      padding: 12px 14px 14px;
      display: grid; gap: 10px;
    }
    .perfil-edit-inner label { font-size: 11px; color: #8f98a0; font-weight: 700; display: block; margin-bottom: 5px; }
    .perfil-edit-inner .na-in {
      height: 36px; background: #0d1117; border: 1px solid rgba(255,255,255,.09);
      border-radius: 10px; padding: 0 12px; font-size: 13px; color: #fff;
      width: 100%; box-sizing: border-box; font-family: inherit;
    }
    .perfil-edit-inner .na-in:focus { border-color: var(--accent); outline: none; }
    .pf-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pf-sep { border-top: 1px solid rgba(255,255,255,.08); }
    .pf-sub { font-size: 11px; color: #8f98a0; font-weight: 700; }
    .pf-invite-row { display: flex; gap: 8px; align-items: center; }
    .pf-invite-row .na-in {
      flex: 1; height: 36px; text-align: center;
      font-family: monospace; letter-spacing: 1px; text-transform: uppercase;
    }
    .pf-invite-row .btn-circle {
      width: 36px; height: 36px; flex-shrink: 0; align-self: center;
      border-radius: 10px; padding: 0; /* misma forma/altura que el input del codigo */
    }
    .pf-actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 2px; }
    .pf-btn {
      height: 40px; border-radius: 10px; font-size: 13px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      cursor: pointer; border: none; font-family: inherit;
      transition: filter var(--t-fast) var(--ease-out);
    }
    .pf-btn-save { background: linear-gradient(135deg, #66c0f4, #bb86fc); color: #0b0e14; }
    .pf-btn-danger { background: #ff6b6b; color: #0b0e14; }
    .pf-btn:hover { filter: brightness(1.08); }
    @media (max-width: 560px) {
      .pf-grid-2 { grid-template-columns: 1fr; }
      .pf-actions-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .stats-profile-card { flex-wrap: wrap; row-gap: 10px; }
      .stats-profile-actions { width: 100%; }
      .stats-profile-actions .btn { flex: 1; }
    }

    .filter-panel {
      position: fixed;
      top: calc(165px + env(safe-area-inset-top, 0px));
      left: 12px;
      right: 12px;
      max-width: 350px;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(27, 40, 56, 0.99) 0%, rgba(18, 27, 40, 0.99) 100%);
      border: 1px solid rgba(102, 192, 244, 0.35);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.85);
      z-index: 9998;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: calc(100dvh - 185px);
      overflow-y: auto;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: opacity var(--t-base) var(--ease-out), visibility var(--t-base) var(--ease-out), transform var(--t-base) var(--ease-out);
    }
    .filter-panel.open { opacity: 1; visibility: visible; transform: translateY(0); }
    .filter-group { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .filter-group:empty { display: none; }
    .filter-group label { font-size: 11px; color: #8f98a0; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
    .filter-group select {
      background: rgba(0,0,0,0.45); color: white; border: 1px solid rgba(255,255,255,0.12);
      padding: 7px 10px; border-radius: 8px; font-size: 12px; outline: none; cursor: pointer; width: 100%;
    }
    .filter-reset {
      width: 100%; margin-top: 4px; padding: 8px;
      background: rgba(201, 59, 59, 0.15); color: #ff6b6b;
      border: 1px solid rgba(201, 59, 59, 0.3); border-radius: 8px;
      cursor: pointer; font-weight: 700; font-size: 12px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      transition: opacity var(--t-base) var(--ease-out), transform var(--t-base) var(--ease-out);
      width: 100%;
    }
    @media (min-width: 601px) {
      #grid.poster-mode {
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 16px;
      }
      #grid.poster-mode > .card {
        display: flex;
        flex-direction: column;
      }
      #grid.poster-mode .img-container {
        width: 100%;
        min-width: 0;
        height: auto;
        aspect-ratio: 2 / 3;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px 12px 0 0;
      }
      #grid.poster-mode .card-content {
        padding: 10px 12px;
        justify-content: flex-start;

    .stat-card {

    /* MODALES GENERALES */
    #modal, #modal-papelera, #modal-match, #modal-vinculos, #modal-share {

    .modal-content {
      background: #182332; padding: 20px; border-radius: 16px; width: 100%; max-width: 620px; min-width: 0;

      overscroll-behavior: contain;
      border: 1px solid rgba(102, 192, 244, 0.38);

    /* boton cerrar: sticky arriba-derecha — sigue visible al hacer scroll
       dentro del modal; margin-bottom negativo evita reservar fila extra */

      margin-left: auto; margin-bottom: -34px; display: flex;
      width: 34px; height: 34px; padding: 0;

      border: 1px solid rgba(255, 255, 255, 0.28); color: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;

    }
    .modal-close:hover { background: rgba(201, 59, 59, 0.9); border-color: rgba(255, 107, 107, 0.7); }
    .modal-close:active { transform: scale(0.9); }
    /* reserva lateral solo donde el boton puede pisar texto del header */

    .modal-header-grid.poster .modal-img {

      max-width: 144px;
      margin: 0;
      aspect-ratio: 2 / 3;
      object-position: center top;
    }
    .modal-header-grid.poster .modal-header-info {
      grid-area: body;
      min-width: 0;
    }
    .modal-header-info { flex: 1; min-width: 0; width: 100%; }

    .trailer-bar { margin-bottom: 14px; }

    /* 2A skeleton shimmer — mismos ritmos que .card */
    .skel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; width: 100%; }
    .skel-card { background: var(--panel); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,.06); }
    .skel-img { aspect-ratio: 460 / 215; }

    .skel-line.w60 { width: 60%; } .skel-line.w80 { width: 80%; } .skel-line.w40 { width: 40%; }
    .skel-img, .skel-line {
      background: linear-gradient(90deg, rgba(255,255,255,.05) 25%, rgba(255,255,255,.11) 50%, rgba(255,255,255,.05) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s var(--ease-inout) infinite;
    }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* 2B entrada direccional del grid al cambiar de categoria */
    #grid.grid-in-next .card, #grid.grid-in-prev .card {
      animation: gridCardIn var(--t-slow) var(--ease-out) both;
    }
    #grid.grid-in-next .card { animation-name: gridCardInNext; }
    #grid.grid-in-prev .card { animation-name: gridCardInPrev; }
    #grid.grid-in-next .card:nth-child(6n+2), #grid.grid-in-prev .card:nth-child(6n+2) { animation-delay: 30ms; }
    #grid.grid-in-next .card:nth-child(6n+3), #grid.grid-in-prev .card:nth-child(6n+3) { animation-delay: 60ms; }
    #grid.grid-in-next .card:nth-child(6n+4), #grid.grid-in-prev .card:nth-child(6n+4) { animation-delay: 90ms; }
    #grid.grid-in-next .card:nth-child(6n+5), #grid.grid-in-prev .card:nth-child(6n+5) { animation-delay: 120ms; }
    #grid.grid-in-next .card:nth-child(6n+0), #grid.grid-in-prev .card:nth-child(6n+0) { animation-delay: 150ms; }
    @keyframes gridCardInNext { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
    @keyframes gridCardInPrev { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: none; } }

    /* 2C burst de corazon en double-tap */
    .heart-burst {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      pointer-events: none; z-index: 5;
    }
    .heart-burst svg {
      width: 64px; height: 64px; color: var(--wish); filter: drop-shadow(0 2px 10px rgba(0,0,0,.6));
      animation: heartPop 600ms var(--ease-out) forwards;
    }
    @keyframes heartPop {
      0% { opacity: 0; transform: scale(0); }
      30% { opacity: 1; transform: scale(1.25); }
      55% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.1) translateY(-14px); }
    }
    .lightbox {
      display: none; position: fixed; inset: 0; z-index: 10000;
      background: rgba(0,0,0,0.92); align-items: center; justify-content: center;

      .modal-content { padding: 14px; border-radius: 16px 16px 0 0; }
      .modal-title { font-size: 17px; padding-right: 36px; }
      .stats-cards-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .tracking-container { grid-template-columns: 1fr; }
      #grid.poster-mode {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      #grid.poster-mode > .card {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto;
        grid-template-areas:
          "media"
          "body";
      }
      #grid.poster-mode .img-container {
        grid-area: media;
        width: 100%;
        min-width: 0;
        height: auto;
        aspect-ratio: 2 / 3;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px 12px 0 0;
      }
      #grid.poster-mode .card-content {
        grid-area: body;
      }
      .modal-header-grid.poster {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto;
        grid-template-areas:
          "media"
          "body";
        text-align: left;
        gap: 12px;
      }
      .modal-header-grid.poster .modal-img {
        grid-area: media;
        width: 100%;
        max-width: 210px;
        margin: 0 auto;
        aspect-ratio: 2 / 3;
      }
      .modal-header-grid.poster .modal-header-info {
        grid-area: body;
        padding-right: 44px;
      }
      .modal-header-grid.poster .modal-title { padding-right: 36px; justify-content: flex-start; font-size: 17px; }
      .modal-header-grid.poster .version-badges { justify-content: flex-start; }
      .modal-header-grid.poster .modal-genres { justify-content: flex-start; }
      .tab-btn { padding: 7px 8px; font-size: 11px; }
      .tab-btn .ico { width: 16px; height: 16px; }
      .tab-btn .tab-text { display: none; }
    }

    .chapter-tracker-box { background: rgba(16, 24, 36, 0.75); border: 1px solid rgba(102, 192, 244, 0.25); border-radius: 8px; padding: 8px; margin-bottom: 8px; }
    .chapter-inputs-row { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }
    .chapter-num-input { width: 100%; min-width: 0; padding: 6px; border-radius: 6px; background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.14); color: #fff; font-size: 12px; font-weight: 700; text-align: center; outline: none; }
    .chapter-num-input:focus { border-color: var(--accent); }
    .chapter-num-input:disabled { opacity: 0.7; cursor: not-allowed; }
    .chapter-sep { color: #8f98a0; font-weight: 900; font-size: 13px; flex-shrink: 0; }
    .chapter-pct-badge { background: rgba(102, 192, 244, 0.18); color: var(--accent); font-size: 10px; font-weight: 900; padding: 3px 6px; border-radius: 6px; min-width: 42px; text-align: center; flex-shrink: 0; }
    .reading-progress-track { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.08); border-radius: 5px; overflow: hidden; }
    .reading-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #5ba32b); width: 0%; transition: width var(--t-slow) var(--ease-out); }
    .card-reading-bar { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
    .card-reading-labels { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; color: #8f98a0; }
  </style>
</head>

  <div id="app-screen">
    <div class="top-header">
      <div class="category-tabs">
        <button class="tab-btn active" data-cat="Juegos" title="Juegos" onclick="cambiarCategoria('Juegos')">
          <svg class="ico"><use href="#i-gamepad"/></svg> <span class="tab-text" data-i18n="cat.Juegos">Juegos</span>
        </button>
        <button class="tab-btn" data-cat="Peliculas_Series" title="Cine y Series" onclick="cambiarCategoria('Peliculas_Series')">
          <svg class="ico"><use href="#i-film"/></svg> <span class="tab-text" data-i18n="cat.Peliculas_Series">Cine y Series</span>
        </button>
        <button class="tab-btn" data-cat="Libros" title="Libros" onclick="cambiarCategoria('Libros')">
          <svg class="ico"><use href="#i-book"/></svg> <span class="tab-text" data-i18n="cat.Libros">Libros</span>
        </button>
        <button class="tab-btn" data-cat="Mangas" title="Mangas" onclick="cambiarCategoria('Mangas')">
          <svg class="ico"><use href="#i-manga"/></svg> <span class="tab-text" data-i18n="cat.Mangas">Mangas</span>
        </button>
        <button class="tab-btn" data-cat="Coleccionables" title="Coleccionables" onclick="cambiarCategoria('Coleccionables')">
          <svg class="ico"><use href="#i-star"/></svg> <span class="tab-text" data-i18n="cat.Coleccionables">Coleccionables</span>
        </button>

      </div>

      <div class="controls" id="main-controls-box">
        <div class="controls-row">
          <div class="search-wrapper">
            <svg class="ico"><use href="#i-search"/></svg>
            <input type="text" id="inputBuscar" data-i18n-ph="cfg.Juegos.search" placeholder="Filtrar juegos por título, dev, género o tag..." oninput="filtrarItemsDebounced()">
          </div>
        </div>

        <div class="controls-row">
          <div class="add-wrapper" id="add-wrapper-box">
            <svg class="ico ico-sm" style="color:#8f98a0; margin-right:6px;"><use href="#i-plus"/></svg>
            <input type="text" id="inputAgregar" data-i18n-ph="cfg.Juegos.add" placeholder="AppID, URL o nombre..." onfocus="activarModoBusquedaAgregar(true)" oninput="syncAddClearBtn(); autocompletarAgregarDebounced()" onkeydown="if(event.key==='Enter') manejarAgregar()">
            <button type="button" class="btn-clear-add" onclick="cerrarBusquedaAgregar(true)" title="Limpiar" data-i18n-title="tip.limpiar">
              <svg class="ico ico-sm"><use href="#i-x"/></svg>
            </button>
            <button id="btn-add" class="btn btn-primary" onclick="manejarAgregar()" title="Buscar o añadir" data-i18n-title="tip.buscar" style="margin-left:3px;">
              <svg class="ico ico-sm"><use href="#i-plus"/></svg>
            </button>
            <div id="search-dropdown" class="search-results-dropdown"></div>
          </div>

          <div class="right-controls" id="right-ctrls">
            <button id="btn-toggle-filtros" class="btn btn-circle" onclick="toggleFiltros(event)" title="Filtros y Orden" data-i18n-title="tip.filtros">
              <svg class="ico"><use href="#i-filter"/></svg>
            </button>
            <div class="menu-wrap">
              <button class="btn btn-circle" id="btn-menu" onclick="toggleMenu(event)" title="Menú" data-i18n-title="tip.menu">
                <svg class="ico"><use href="#i-menu"/></svg>
              </button>
              <div id="menu-panel" class="menu-panel">
                <button class="menu-item" onclick="menuRun(abrirMatchModal)">
                  <svg class="ico ico-sm" style="color:#ff8fa3;"><use href="#i-heart-fill"/></svg> <span data-i18n="menu.match">Match de Pareja</span>
                </button>
                <button class="menu-item" onclick="menuRun(elegirAleatorio)">
                  <svg class="ico ico-sm"><use href="#i-dice"/></svg> <span data-i18n="menu.random">Elección aleatoria</span>
                </button>
                <button class="menu-item" onclick="menuRun(forzarSincronizacion)">
                  <svg class="ico ico-sm"><use href="#i-sync"/></svg> <span data-i18n="menu.sync">Sincronizar</span>
                </button>
                <button class="menu-item" onclick="menuRun(abrirPapelera)">
                  <svg class="ico ico-sm" style="color:#ff6b6b;"><use href="#i-trash"/></svg> <span data-i18n="menu.papelera">Papelera</span>
                </button>
                <button class="menu-item" onclick="menuRun(abrirVinculosModal)">
                  <svg class="ico ico-sm" style="color:#7ee0a3;"><use href="#i-users"/></svg> <span data-i18n="menu.vinculos">Vínculos</span>

                </button>
                <button class="menu-item" onclick="menuRun(function(){ cambiarCategoria('Estadisticas'); })">
                  <svg class="ico ico-sm"><use href="#i-user"/></svg> <span data-i18n="menu.perfil">Mi perfil</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div id="progress-container">
          <div id="progress-bar"></div>
          <div id="progress-text" data-i18n="progress.init">Iniciando...</div>
        </div>
      </div>
    </div>

    <!-- PANEL DE FILTROS -->
    <div id="panel-filtros" class="filter-panel" onclick="event.stopPropagation()">
      <div id="filter-personas"></div>
      <div class="filter-group">
        <label><svg class="ico ico-sm ico-wish"><use href="#i-heart-fill"/></svg> <span data-i18n="filter.deseados">Lista de Deseados</span></label>
        <select id="filter-deseado" onchange="filtrarItems()"></select>
      </div>
      <div class="filter-group" id="extra-filter-1"></div>
      <div class="filter-group" id="extra-filter-2"></div>
      <div class="filter-group" id="extra-filter-3"></div>

      <div class="filter-group">
        <label><span data-i18n="filter.ordenar">Ordenar por</span></label>
        <select id="filter-orden" onchange="filtrarItems()">
          <option value="az" data-i18n="sort.az">Alfabético (A - Z)</option>
          <option value="za" data-i18n="sort.za">Alfabético (Z - A)</option>
          <option value="recientes" data-i18n="sort.recientes">Últimos añadidos</option>
          <option value="puntuacion" data-i18n="sort.puntuacion">Puntuación</option>
        </select>
      </div>
      <button class="filter-reset" onclick="resetFiltros()"><span data-i18n="filter.limpiar">Limpiar Filtros</span></button>
    </div>

    <div id="stats-bar" class="stats-bar" style="display:none;"></div>
    <div id="grid"></div>

    <!-- VISTA DE ESTADÍSTICAS REORGANIZADA Y COMPACTA -->
    <div id="stats-view">
      <div class="perfil-accordion" id="perfil-accordion">
      <div class="stats-profile-card" id="stats-profile-card"></div>
      <div class="perfil-edit" id="perfil-edit">
        <div class="perfil-edit-inner">
          <div class="pf-grid-2">
            <div>
              <label for="pf-display" data-i18n="pf.display">Nombre público</label>
              <input id="pf-display" class="na-in" type="text" maxlength="60">
            </div>
            <div>
              <label for="pf-username" data-i18n="pf.username">Usuario</label>
              <input id="pf-username" class="na-in" type="text" maxlength="30">
            </div>
          </div>
          <div class="pf-sep"></div>
          <div>
            <div class="pf-sub" data-i18n="pf.invite">Código de vinculación</div>
            <div class="pf-invite-row" style="margin-top:6px;">
              <input id="pf-invite" class="na-in" type="text" readonly>
              <button class="btn btn-circle" onclick="copiarInvitePerfil()" title="Copiar" data-i18n-title="pf.copy"><svg class="ico"><use href="#i-copy"/></svg></button>
            </div>
          </div>
          <div class="pf-actions-row">
            <button class="pf-btn pf-btn-danger" onclick="nexusSignOut()">
              <svg class="ico ico-sm"><use href="#i-logout"/></svg> <span data-i18n="pf.logout">Cerrar sesión</span>
            </button>
            <button class="pf-btn pf-btn-save" onclick="guardarPerfil()">
              <svg class="ico ico-sm"><use href="#i-save"/></svg> Guardar cambios
            </button>
          </div>
        </div>
      </div>
      </div>

  <!-- ==================== NEXUS PHASE 4 — adaptador Supabase ==================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- MODAL PERFIL -->

  <script>
    const NEXUS_MODE = true; // false = Apps Script/Sheets (v1)
    const NEXUS_URL = 'https://vkmgnwnlceycauleluwl.supabase.co';
    const NEXUS_KEY = 'sb_publishable_nLhtLiQ7uZ0I2noqeZMNcg_c0sKq9nO';

    var _nexusSb = null, _nexusUser = null, _nexusProfile = null, _nexusLibId = null;

    async function nexusSb() {
      if (!_nexusSb) {
        _nexusSb = window.supabase.createClient(NEXUS_URL, NEXUS_KEY);
        var s = await _nexusSb.auth.getSession();
        _nexusUser = (s.data && s.data.session) ? s.data.session.user : null;
      }
      return _nexusSb;
    }

    async function nexusEnsureProfile() {
      var sb = await nexusSb();
      if (!_nexusUser) {
        var u = await sb.auth.getUser();
        _nexusUser = u.data.user;
      }
      if (!_nexusProfile && _nexusUser) {
        var p = await sb.from('profiles').select('id,display_name,username').eq('id', _nexusUser.id).single();
        _nexusProfile = p.data;
        var lm = await sb.from('library_members').select('library_id').eq('profile_id', _nexusUser.id).limit(1);
        _nexusLibId = (lm.data && lm.data[0]) ? lm.data[0].library_id : null;
      }
      return _nexusProfile;
    }

    function nexusPersona() {
      // el handle visible es username; fallback al primer nombre del display_name
      if (_nexusProfile && _nexusProfile.username) return _nexusProfile.username;
      return (_nexusProfile && _nexusProfile.display_name ? _nexusProfile.display_name : 'Yo').split(' ')[0];
    }

    function nexusPersonaOk(persona) {
      return nexusPersona().toLowerCase() === String(persona || '').toLowerCase();
    }

    async function nexusMediaId(category, externalId) {
      var sb = await nexusSb();
      var r = await sb.from('media_items').select('id')
        .eq('category', category).eq('external_id', String(externalId)).maybeSingle();
      if (r.error) throw new Error(r.error.message);
      return r.data ? r.data.id : null;
    }

    async function nexusTrackingUpsert(category, externalId, fields) {
      var sb = await nexusSb();
      await nexusEnsureProfile();
      var mediaId = await nexusMediaId(category, externalId);
      if (!mediaId) return { success: false, msg: t('err.itemnf') };
      var payload = { profile_id: _nexusUser.id, media_item_id: mediaId };
      Object.keys(fields).forEach(function(k) { payload[k] = fields[k]; });
      var r = await sb.from('user_media_tracking')
        .upsert(payload, { onConflict: 'profile_id,media_item_id' });
      if (r.error) throw new Error(r.error.message);
      return { success: true };
    }

    var NEXUS_STATUS_MAP = { 'No jugado': 'backlog', 'En proceso': 'in_progress', 'Completado': 'completed' };

    var nexusRun = {
      _ok: null, _fail: null,
      withSuccessHandler: function(f) { this._ok = f; return this; },
      withFailureHandler: function(f) { this._fail = f; return this; },
      _exec: function(p) {
        // capturar handlers al llamar: el singleton compartia _ok/_fail y una
        // llamada posterior podia secuestrar el callback de una promesa pendiente
        var ok = this._ok, fail = this._fail;
        this._ok = null; this._fail = null;
        Promise.resolve(p).then(function(r) {
          try { if (ok) ok(r); } catch (e) { console.error(e); }
        }).catch(function(e) {
          try { if (fail) fail(e); else console.error(e); } catch (_) {}
        });
      },
      getItems: function(cat) {
        this._exec((async function() {
          var sb = await nexusSb();
          await nexusEnsureProfile();
          var r = await sb.rpc('get_items_merged', { p_category: cat });
          if (r.error) throw new Error(r.error.message);
          return r.data || [];
        })());
      },
      guardarProgresoItem: function(cat, id, persona, estado, estrellas, progreso) {
        this._exec((async function() {
          await nexusSb(); await nexusEnsureProfile();
          if (!nexusPersonaOk(persona)) return { success: false, msg: t('err.owntrack') };
          return nexusTrackingUpsert(cat, id, {
            status: NEXUS_STATUS_MAP[estado] || null,
            rating: (Number(estrellas) > 0) ? Number(estrellas) : null,
            progress: progreso || null
          });
        })());
      },
      guardarDeseadoItem: function(cat, id, persona, deseado) {
        this._exec((async function() {
          await nexusSb(); await nexusEnsureProfile();
          if (!nexusPersonaOk(persona)) return { success: false, msg: t('err.owntrack') };
          return nexusTrackingUpsert(cat, id, { is_wishlisted: Boolean(deseado) });
        })());
      },
      guardarNotaItem: function(cat, id, persona, nota) {
        this._exec((async function() {
          await nexusSb(); await nexusEnsureProfile();
          if (!nexusPersonaOk(persona)) return { success: false, msg: t('err.owntrack') };
          return nexusTrackingUpsert(cat, id, { personal_notes: nota || null });
        })());
      },
      guardarTotalCapitulos: function(cat, id, total) {
        this._exec((async function() {
          var sb = await nexusSb();
          var r = await sb.from('media_items').select('id')
            .eq('category', cat).eq('external_id', String(id)).single();
          if (r.error || !r.data) return { success: false, msg: t('err.itemnf2') };
          var u = await sb.rpc('set_media_total_chapters', { p_media_id: r.data.id, p_total: Number(total) || 0 });
          if (u.error) throw new Error(u.error.message);
          return { success: true };
        })());
      },
      eliminarItem: function(cat, id) {
        this._exec((async function() {
          var sb = await nexusSb(); await nexusEnsureProfile();
          var mediaId = await nexusMediaId(cat, id);
          if (!mediaId || !_nexusLibId) return { success: false, msg: t('err.elemnf') };
          var r = await sb.from('library_items')
            .update({ deleted_at: new Date().toISOString() })
            .eq('library_id', _nexusLibId).eq('media_item_id', mediaId).is('deleted_at', null);
          if (r.error) throw new Error(r.error.message);
          return { success: true };
        })());
      },
      restaurarItem: function(cat, id) {
        this._exec((async function() {
          var sb = await nexusSb(); await nexusEnsureProfile();
          var mediaId = await nexusMediaId(cat, id);
          if (!mediaId || !_nexusLibId) return { success: false };
          var r = await sb.from('library_items')
            .update({ deleted_at: null })
            .eq('library_id', _nexusLibId).eq('media_item_id', mediaId).not('deleted_at', 'is', null);
          if (r.error) throw new Error(r.error.message);
          return { success: true };
        })());
      },
      getItemsEliminados: function() {
        this._exec((async function() {
          var sb = await nexusSb(); await nexusEnsureProfile();
          if (!_nexusLibId) return [];
          var r = await sb.from('library_items')
            .select('media_items(category,title,external_id)')
            .eq('library_id', _nexusLibId).not('deleted_at', 'is', null);
          if (r.error) throw new Error(r.error.message);
          return (r.data || []).map(function(x) {
            var mi = x.media_items || {};
            return { categoria: mi.category || '', id: String(mi.external_id || ''), titulo: mi.title || 'Elemento sin título' };
          });
        })());
      },
      buscarCatalogoExterno: function(cat, query) {
        this._exec((async function() {
          var sb = await nexusSb(); await nexusEnsureProfile();
          var r = await sb.functions.invoke('catalog-search', { body: { category: cat, query: query, lang: NEXUS_LANG } });
          if (r.error) throw new Error(r.error.message);
          return r.data || [];
        })());
      },
      agregarItem: function(cat, idOUrlOrName) {
        this._exec((async function() {
          var sb = await nexusSb(); await nexusEnsureProfile();
          var r = await sb.functions.invoke('catalog-add', { body: { category: cat, idOrUrlOrName: idOUrlOrName, lang: NEXUS_LANG } });
          if (r.error) {
            var ctx = r.error.context;
            if (ctx && typeof ctx.json === 'function') {
              try { var j = await ctx.json(); if (j && j.msg) return { success: false, msg: j.msg }; } catch (_) {}
            }
            throw new Error(r.error.message);
          }
          return r.data;
        })());
      },
      repararItemIndividual: function(cat, id) {
        this._exec((async function() {
          var sb = await nexusSb(); await nexusEnsureProfile();
          var r = await sb.functions.invoke('item-refresh', { body: { category: cat, id: id, lang: NEXUS_LANG } });
          if (r.error) {
            var ctx = r.error.context;
            if (ctx && typeof ctx.json === 'function') {
              try { var j = await ctx.json(); if (j && j.msg) return { success: false, msg: j.msg }; } catch (_) {}
            }
            throw new Error(r.error.message);
          }
          return r.data;
        })());
      }
    };

    var RUN = NEXUS_MODE ? nexusRun : google.script.run;

    // ---- auth gate ----
    // ---- PERFIL (modal) ----
    async function togglePerfilEdit(btn) {
      if (!NEXUS_MODE) return;
      var panel = document.getElementById('perfil-edit');
      if (!panel) return;
      if (panel.classList.contains('open')) { panel.classList.remove('open'); if (btn) btn.classList.remove('open'); return; }
      await nexusEnsureProfile();
      var p = _nexusProfile || {};
      var user = _nexusUser || {};
      document.getElementById('pf-display').value = p.display_name || '';
      document.getElementById('pf-username').value = p.username || '';
      // invite_code de mi biblioteca personal
      try {
        var sb = await nexusSb();
        var lib = await sb.from('libraries').select('invite_code').eq('created_by', user.id).eq('kind', 'personal').maybeSingle();
        document.getElementById('pf-invite').value = (lib.data && lib.data.invite_code) || '';
      } catch (e) { document.getElementById('pf-invite').value = ''; }
      panel.classList.add('open');
      if (btn) btn.classList.add('open');
    }
    function cerrarPerfilEdit(btn) {
      var panel = document.getElementById('perfil-edit');
      if (panel) panel.classList.remove('open');
      document.querySelectorAll('.stats-profile-actions .btn.open').forEach(function(b){ b.classList.remove('open'); });
    }
    async function guardarPerfil() {
      try {
        var nombre = document.getElementById('pf-display').value.trim();
        if (!nombre) { showToast && showToast(t('err.noname'), 'error'); return; }
        var uname = document.getElementById('pf-username').value.trim().toLowerCase()
          .replace(/[^a-z0-9_]/g, '').slice(0, 30);
        if (!uname) { showToast && showToast(t('err.nouser'), 'error'); return; }
        var sb = await nexusSb();
        var r = await sb.from('profiles').update({ display_name: nombre, username: uname }).eq('id', _nexusUser.id);
        if (r.error) {
          if (/duplicate|unique|already/i.test(r.error.message || '')) {
            showToast && showToast('Ese usuario ya está en uso.', 'error'); return;
          }
          throw new Error(r.error.message);
        }
        _nexusProfile.display_name = nombre;
        _nexusProfile.username = uname;
        nexusRenderProfileHeader();
        showToast && showToast(t('toast.profile'), 'success');
        cerrarPerfilEdit();
      } catch (e) {
        showToast && showToast(t('err.prefix') + (e.message || ''), 'error');
      }
    }
    function copiarInvitePerfil() {
      var v = document.getElementById('pf-invite').value;
      if (!v) return;
      navigator.clipboard.writeText(v).then(function() {
        showToast && showToast(t('toast.copied'), 'success');
      });
    }
    async function nexusSignOut() {
      try {
        var sb = await nexusSb();
        await sb.auth.signOut();
      } catch (e) {}
      location.reload();
    }

    // ---- auth gate: landing + Entrar / Crear cuenta / Recuperar ----
    function nexusAuthCSS() {
      if (document.getElementById('nexus-auth-css')) return;
      var st = document.createElement('style');
      st.id = 'nexus-auth-css';
      st.textContent =
        '.na-wrap{width:100%;max-width:380px;text-align:center;}' +
        '.na-hero{margin-bottom:22px;}' +
        '.na-logo{font-size:34px;font-weight:900;color:var(--accent,#66c0f4);letter-spacing:-0.5px;}' +
        '.na-tag{color:var(--text,#c7d5e0);font-size:13px;margin-top:6px;line-height:1.5;}' +
        '.na-card{background:var(--panel,#1b2838);border:1px solid var(--border,rgba(255,255,255,.1));border-radius:16px;padding:22px 20px;text-align:left;}' +
        '.na-tabs{display:flex;gap:4px;background:rgba(0,0,0,.25);border-radius:10px;padding:4px;margin-bottom:18px;}' +
        '.na-tab{flex:1;padding:8px;border:none;border-radius:8px;background:transparent;color:#8f98a0;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all var(--t-fast) var(--ease-out);}' +
        '.na-tab.active{background:var(--accent,#66c0f4);color:#0b0e14;}' +

            ov.querySelector('#na-pane-' + k).style.display = (tab.dataset.na === k) ? 'block' : 'none';
          });
          setMsg('');
        };

      async function finishLogin(user) {
        _nexusUser = user;
        ov.remove();
        if (window.location.hash) history.replaceState(null, '', window.location.pathname + window.location.search);
        if (onReady) onReady();
      }

      async function doLogin() {
        var email = val('#na-email'), pass = ov.querySelector('#na-pass').value;
        setMsg('');
        if (!email || !pass) { setMsg(t('auth.err.emailpass')); return; }
        var sb = await nexusSb();
        var r = await sb.auth.signInWithPassword({ email: email, password: pass });
        if (r.error) { setMsg(r.error.message); return; }
        await finishLogin(r.data.user);
      }

      async function doSignup() {
        var name = val('#na-sname'), email = val('#na-sem'), pass = ov.querySelector('#na-spass').value;
        setMsg('');
        if (!email || !pass) { setMsg(t('auth.err.req')); return; }
        if (pass.length < 6) { setMsg(t('auth.err.pass6')); return; }
        var sb = await nexusSb();
        var r = await sb.auth.signUp({
          email: email, password: pass,
          options: { data: { display_name: name || email.split('@')[0] } }
        });
        if (r.error) { setMsg(r.error.message); return; }
        if (r.data.session && r.data.session.user) { await finishLogin(r.data.session.user); return; }
        setMsg(t('auth.msg.created'), true);
        ov.querySelector('.na-tab[data-na="login"]').click();
      }

      async function doMagic() {
        var email = val('#na-email');
        setMsg('');
        if (!email) { setMsg(t('auth.err.email')); return; }
        var sb = await nexusSb();
        var r = await sb.auth.signInWithOtp({ email: email });
        setMsg(r.error ? r.error.message : t('auth.msg.magic'), !r.error);
      }

      async function doRecover() {
        var email = val('#na-rem');
        setMsg('');
        if (!email) { setMsg(t('auth.err.email')); return; }
        var sb = await nexusSb();
        var r = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + window.location.pathname
        });
        setMsg(r.error ? r.error.message : t('auth.msg.recover'), !r.error);
      }

      ov.querySelector('#na-btn-login').onclick = doLogin;
      ov.querySelector('#na-btn-signup').onclick = doSignup;
      ov.querySelector('#na-btn-recover').onclick = doRecover;
      ov.querySelector('#na-btn-magic').onclick = doMagic;
      ov.querySelector('#na-pass').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
      ov.querySelector('#na-spass').addEventListener('keydown', function(e) { if (e.key === 'Enter') doSignup(); });
    }

    async function nexusBoot(onReady) {
      var readyOnce = false;
      function boot() {
        if (readyOnce) return;
        readyOnce = true;
        if (window.location.hash) history.replaceState(null, '', window.location.pathname + window.location.search);
        onReady();
      }
      try {
        nexusAuthCSS();
        var sb = await nexusSb();
        var s = await sb.auth.getSession();
        if (nexusIsRecovery()) {
          nexusShowPasswordReset(function() {
            if (s.data && s.data.session) {
              _nexusUser = s.data.session.user;
              boot();
            } else {
              nexusShowLogin(boot);
            }
          });
          return;
        }
        if (s.data && s.data.session) {
          _nexusUser = s.data.session.user;
          boot();
        } else {
          nexusShowLogin(boot);
          // race: magic link / session que llega despues del primer getSession
          sb.auth.onAuthStateChange(function(ev, sess) {
            if ((ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION') && sess && sess.session) {
              _nexusUser = sess.session.user;
              var ov = document.getElementById('nexus-login');
              if (ov) ov.remove();
              boot();
            }
          });
        }
      } catch (e) {
        console.error('nexusBoot', e);
        nexusShowLogin(boot);
      }
    }

    // ---- vínculos (Phase 5, solo Nexus mode) ----
    var VINCULOS_LINK_TYPES = {
      pareja: 'lt.pareja', familia: 'lt.familia', amigo: 'lt.amigo', custom: 'lt.custom'
    };

    async function nexusMisVinculos() {
      var sb = await nexusSb();
      await nexusEnsureProfile();
      var out = { invite_code: null, links: [], rpcError: null };
      if (_nexusLibId) {
        var l = await sb.from('libraries').select('invite_code').eq('id', _nexusLibId).single();
        if (l.data) out.invite_code = l.data.invite_code;
      }
      var r = await sb.rpc('get_my_library_links');
      if (r.error) out.rpcError = r.error.message;
      else out.links = r.data || [];
      var rs = await sb.rpc('get_my_item_shares');
      if (!rs.error) out.shares = rs.data || [];
      return out;
    }

    // nombre visible de un vínculo: username (handle) > display_name > t('vinc.user')
    function vinculosNombre(other) {
      return (other && (other.username || other.display_name)) || t('vinc.user');
    }

    function vinculosEsc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function renderVinculos(d) {
      var body = document.getElementById('vinculos-body');
      var h = '';

      // --- mi código ---
      h += '<div style="background:rgba(255,255,255,.04);border:1px solid var(--border,rgba(255,255,255,.1));border-radius:10px;padding:12px 14px;margin-bottom:14px;">';
      h += '<div style="font-size:11px;color:#8f98a0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">' + t('vinc.mycode') + '</div>';
      if (d.invite_code) {
        h += '<div style="display:flex;align-items:center;gap:10px;">' +
             '<code style="font-size:18px;font-weight:700;color:#7ee0a3;letter-spacing:2px;">' + vinculosEsc(d.invite_code) + '</code>' +
             '<button class="btn btn-circle" onclick="vinculosCopiar()" title="' + t('pf.copy') + '"><svg class="ico"><use href="#i-copy"/></svg></button></div>';
        h += '<div style="font-size:11px;color:#8f98a0;margin-top:6px;">' + t('vinc.mycodedesc') + '</div>';
      } else {
        h += '<div style="font-size:12px;color:#8f98a0;">' + t('vinc.nodisp') + '</div>';
      }
      h += '</div>';

      // --- solicitar vínculo ---
      h += '<div style="margin-bottom:14px;">';
      h += '<div style="font-size:11px;color:#8f98a0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">' + t('vinc.addlink') + '</div>';
      h += '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
           '<input id="vinc-codigo" type="text" placeholder="' + t('vinc.codeph') + '" style="flex:1;min-width:110px;padding:10px;border-radius:8px;border:1px solid var(--border);background:#0b0e14;color:var(--text);font-size:14px;text-transform:uppercase;">' +
           '<select id="vinc-tipo" onchange="vinculosToggleLabel()" style="padding:10px;border-radius:8px;border:1px solid var(--border);background:#0b0e14;color:var(--text);font-size:13px;">';
      Object.keys(VINCULOS_LINK_TYPES).forEach(function(k) {
        h += '<option value="' + k + '">' + t(VINCULOS_LINK_TYPES[k]) + '</option>';
      });
      h += '</select>' +
           '<button class="btn btn-text" onclick="vinculosSolicitar()">' + t('btn.send') + '</button></div>' +
           '<input id="vinc-label" type="text" placeholder="' + t('vinc.nameph') + '" ' +
           'style="display:none;width:100%;margin-top:8px;padding:10px;border-radius:8px;border:1px solid var(--border);background:#0b0e14;color:var(--text);font-size:13px;">';
      h += '<div id="vinc-msg" style="font-size:12px;margin-top:6px;min-height:14px;"></div></div>';

      var links = d.links || [];
      var pendientesIn = links.filter(function(x) { return x.direction === 'incoming' && x.status === 'pending'; });
      var pendientesOut = links.filter(function(x) { return x.direction === 'outgoing' && x.status === 'pending'; });
      // dedupe por persona: la fila inversa del link (respond_library_link)
      // comparte el mismo other.profile_id -> mostrar una sola entrada
      var vistos = {};
      var aceptados = links.filter(function(x) {
        if (x.status !== 'accepted') return false;
        var pid = x.other && x.other.profile_id;
        if (pid && vistos[pid]) return false;
        if (pid) vistos[pid] = true;
        return true;
      });
      // agrupar TODAS las filas accepted por persona: out = lo que YO expongo,
      // in = lo que EL/ELLA me expone (filas inversas de respond_library_link)
      var porPid = {};
      links.forEach(function(x) {
        if (x.status !== 'accepted' || !x.other || !x.other.profile_id) return;
        var pid = x.other.profile_id;
        if (!porPid[pid]) porPid[pid] = { name: vinculosNombre(x.other), type: x.link_type, rows: {} };
        porPid[pid].rows[x.direction] = x;
      });
      window._vincPorPid = porPid;

      // --- pendientes entrantes ---
      if (pendientesIn.length) {
        h += '<div style="margin-bottom:14px;"><div style="font-size:11px;color:#ffd479;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">' + t('vinc.requests') + '</div>';
        pendientesIn.forEach(function(x) {
          var nombre = vinculosNombre(x.other);
          h += '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,212,121,.06);border:1px solid rgba(255,212,121,.25);border-radius:8px;margin-bottom:6px;">' +
               '<span style="flex:1;font-size:13px;">' + vinculosEsc(nombre) +
               ' <span style="color:#8f98a0;font-size:11px;">(' + vinculosEsc(vinculosTypeLabel(x)) + ')</span></span>' +
               '<button class="btn btn-text" style="padding:6px 12px;font-size:12px;" onclick="vinculosResponder(\'' + x.link_id + '\',true)">' + t('vinc.accept') + '</button>' +
               '<button class="btn btn-circle" style="color:#ff8585;" onclick="vinculosResponder(\'' + x.link_id + '\',false)" title="' + t('vinc.reject') + '"><svg class="ico"><use href="#i-x"/></svg></button></div>';
        });
        h += '</div>';
      }

      // --- pendientes salientes ---
      if (pendientesOut.length) {
        h += '<div style="margin-bottom:14px;"><div style="font-size:11px;color:#8f98a0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">' + t('vinc.sentwait') + '</div>';
        pendientesOut.forEach(function(x) {
          var nombre = vinculosNombre(x.other);
          h += '<div style="padding:8px 10px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:13px;">' +
               vinculosEsc(nombre) + ' <span style="color:#8f98a0;font-size:11px;">(' + vinculosEsc(vinculosTypeLabel(x)) + ')</span></div>';
        });
        h += '</div>';
      }

      // --- aceptados ---
      h += '<div><div style="font-size:11px;color:#7ee0a3;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">' + t('vinc.linked') + '</div>';
      if (!aceptados.length) {
        h += '<div style="font-size:12px;color:#8f98a0;">' + t('vinc.nolink') + '</div>';
      }
      aceptados.forEach(function(x) {
        var nombre = vinculosNombre(x.other);
        var pid = x.other ? x.other.profile_id : '';
        h += '<div style="padding:8px 10px;background:rgba(126,224,163,.05);border:1px solid rgba(126,224,163,.2);border-radius:8px;margin-bottom:6px;">' +
             '<div style="display:flex;align-items:center;gap:8px;">' +
             '<span style="flex:1;font-size:13px;">' + vinculosEsc(nombre) + '</span>' +
             nexusLinkBadge(x.link_type, x.link_label) +
             (pid ? '<button class="btn btn-circle" style="width:26px;height:26px;" onclick="toggleVisPanel(\'' + pid + '\')" title="' + t('vinc.visib') + '"><svg class="ico ico-sm"><use href="#i-settings"/></svg></button>' : '') +
             '</div>' +
             (pid ? '<div id="vis-panel-' + pid + '" style="display:none;margin-top:8px;"></div>' : '') +
             '</div>';
      });
      h += '</div>';

      // --- items compartidos (Phase 5d) ---
      var shares = d.shares || [];
      var sharesIn = shares.filter(function(x) { return x.direction === 'incoming' && x.status === 'pending'; });
      var sharesOut = shares.filter(function(x) { return x.direction === 'outgoing' && x.status === 'pending'; });
      if (sharesIn.length || sharesOut.length) {
        h += '<div style="margin-top:14px;"><div style="font-size:11px;color:#7ee0a3;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">' + t('vinc.shared') + '</div>';
        sharesIn.forEach(function(x) {
          var it = x.item || {};
          h += '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(126,224,163,.06);border:1px solid rgba(126,224,163,.25);border-radius:8px;margin-bottom:6px;">' +
               '<span style="flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + vinculosEsc(it.titulo || t('vinc.item')) +
               ' <span style="color:#8f98a0;font-size:11px;">' + t('vinc.de') + ' ' + vinculosEsc(x.other_name || t('vinc.someone')) + '</span></span>' +
               '<button class="btn btn-text" style="padding:6px 12px;font-size:12px;" onclick="vinculosItemResponder(\'' + x.request_id + '\',true)">' + t('vinc.accept') + '</button>' +
               '<button class="btn btn-circle" style="color:#ff8585;" onclick="vinculosItemResponder(\'' + x.request_id + '\',false)" title="' + t('vinc.reject') + '"><svg class="ico"><use href="#i-x"/></svg></button></div>';
        });
        sharesOut.forEach(function(x) {
          var it = x.item || {};
          h += '<div style="padding:8px 10px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:13px;">' +
               vinculosEsc(it.titulo || 'Item') + ' <span style="color:#8f98a0;font-size:11px;">→ ' + vinculosEsc(x.other_name || '') + ' ' + t('vinc.waiting') + '</span></div>';
        });
        h += '</div>';
      }

      if (d.rpcError) {
        h += '<div style="font-size:11px;color:#ff8585;margin-top:10px;">RPC no disponible: ' + vinculosEsc(d.rpcError) + ' — corre phase4_5.sql sec.3 / phase5b_links_rpc.sql</div>';
      }

      body.innerHTML = h;
      nexusRefreshVinculosBadge();
    }

    // badge de notificaciones en el botón Vínculos: solicitudes de vínculo
    // entrantes + items compartidos pendientes de aceptar
    async function nexusRefreshVinculosBadge() {
      var badge = document.getElementById('vinc-badge');
      if (!badge || !NEXUS_MODE) return;
      try {
        var d = await nexusMisVinculos();
        var n = (d.links || []).filter(function(x) {
          return x.direction === 'incoming' && x.status === 'pending';
        }).length;
        n += (d.shares || []).filter(function(x) {
          return x.direction === 'incoming' && x.status === 'pending';
        }).length;
        badge.style.display = n > 0 ? 'block' : 'none';
        badge.textContent = n > 9 ? '9+' : String(n);
      } catch (e) {}
    }

    function vinculosCopiar() {
      var code = document.querySelector('#vinculos-body code');
      if (code && navigator.clipboard) navigator.clipboard.writeText(code.textContent.trim());
      showToast && showToast('Código copiado.', 'success');
    }

    function vinculosToggleLabel() {
      var sel = document.getElementById('vinc-tipo');
      var inp = document.getElementById('vinc-label');
      if (sel && inp) inp.style.display = (sel.value === 'custom') ? 'block' : 'none';
    }

    async function vinculosSolicitar() {
      var inp = document.getElementById('vinc-codigo');
      var sel = document.getElementById('vinc-tipo');
      var lbl = document.getElementById('vinc-label');
      var msg = document.getElementById('vinc-msg');
      var code = (inp.value || '').trim();
      if (!code) { msg.textContent = t('vinc.errcode'); msg.style.color = '#ff8585'; return; }
      msg.textContent = t('vinc.sending'); msg.style.color = '#8f98a0';
      try {
        var sb = await nexusSb();
        var r = await sb.rpc('request_library_link', {
          p_invite_code: code,
          p_link_type: sel.value,
          p_link_label: (lbl && sel.value === 'custom') ? (lbl.value || '').trim() : null
        });
        if (r.error) throw new Error(r.error.message);
        msg.textContent = t('vinc.sentok'); msg.style.color = '#7bd88f';
        inp.value = '';
        setTimeout(function() { abrirVinculosModal(); }, 800);
      } catch (e) {
        msg.textContent = e.message || 'Error'; msg.style.color = '#ff8585';
      }
    }

    async function vinculosItemResponder(requestId, accept) {

        showToast && showToast(accept ? t('toast.itemadded') : t('toast.rechazada'), accept ? 'success' : 'warning');
        abrirVinculosModal();

        showToast && showToast(t('err.prefix') + (e.message || ''), 'error');

    async function vinculosResponder(linkId, accept) {

        var sb = await nexusSb();

        if (r.error) throw new Error(r.error.message);
