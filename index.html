  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" media="print" onload="this.media='all'">
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #1b2838;
      --accent: #66c0f4;
      --text: #c7d5e0;
      --gold: #ffd700;
      --border: rgba(255,255,255,0.1);
      --btn-primary: #66c0f4;
      --success: #5ba32b;
      --warning: #d6a918;
      --danger: #c93b3b;
      --wish: #ff4d6d;
      --angel-color: #66c0f4;
      --talmai-color: #ff4d6d;
      --t-fast: 150ms;
      --t-base: 220ms;
      --t-slow: 320ms;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-inout: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      background: radial-gradient(circle at top left, #1b2838, #0b0e14 80%);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: calc(160px + env(safe-area-inset-top, 0px)) 12px calc(30px + env(safe-area-inset-bottom, 0px)) 12px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      touch-action: pan-y;
    }

    body.view-stats {
      padding-top: calc(85px + env(safe-area-inset-top, 0px));
    }

    /* ICONOS PLANOS VECTORIALES (SVG) */
    .ico {
      width: 14px;
      height: 14px;
      display: inline-block;
      vertical-align: -2px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .ico-sm { width: 12px; height: 12px; vertical-align: -1.5px; }
    .ico-lg { width: 16px; height: 16px; }
    .ico-fill { fill: currentColor; stroke: none; }
    .ico-angel { color: var(--angel-color); }
    .ico-talmai { color: var(--talmai-color); }
    .ico-gold { color: var(--gold); fill: var(--gold); stroke: none; }
    .ico-wish { color: var(--wish); fill: var(--wish); stroke: none; }

    .card, .btn, .tab-btn, .modal-close, .player-summary, .star, .accordion summary, .status-select, .filter-group select, .filter-reset, .wish-toggle, .btn-trailer {
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #2a475e; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    #app-screen { max-width: 1400px; margin: 0 auto; width: 100%; }

    .top-header {
      position: fixed;
      top: calc(10px + env(safe-area-inset-top, 0px));
      left: 10px;
      right: 10px;
      width: auto;
      max-width: 1400px;
      margin: 0 auto;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: transparent;
    }

    .category-tabs {
      display: flex;
      gap: 4px;
      background: rgba(16, 24, 36, 0.98);
      padding: 4px 6px;
      border-radius: 30px;
      border: 1px solid rgba(102, 192, 244, 0.22);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      flex: 1;
      min-width: max-content;
      padding: 6px 10px;
      border: none;
      border-radius: 20px;
      background: transparent;
      color: #8f98a0;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background-color var(--t-base) var(--ease-inout), color var(--t-base) var(--ease-inout), box-shadow var(--t-base) var(--ease-inout);
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0b0e14;
      box-shadow: 0 2px 10px rgba(102, 192, 244, 0.4);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: linear-gradient(180deg, rgba(27, 40, 56, 0.99) 0%, rgba(20, 30, 45, 0.99) 100%);
      padding: 6px 10px;
      border-radius: 16px;
      border: 1px solid rgba(102, 192, 244, 0.25);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-width: 0;
    }

    .search-wrapper {
      flex-grow: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 20px;
      padding: 0 12px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .search-wrapper:focus-within { border-color: var(--accent); }
    .search-wrapper .ico { margin-right: 8px; color: #8f98a0; }
    #inputBuscar { width: 100%; min-width: 0; border: none; background: transparent; color: white; outline: none; font-family: 'Inter', sans-serif; font-size: 13px; }

    .add-wrapper {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 20px;
      padding: 0 4px 0 10px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      flex-grow: 1;
      min-width: 0;
      transition: flex-grow var(--t-slow) var(--ease-inout), width var(--t-slow) var(--ease-inout), background-color var(--t-slow) var(--ease-inout), border-color var(--t-slow) var(--ease-inout), box-shadow var(--t-slow) var(--ease-inout);
    }
    .add-wrapper.expanded {
      flex-grow: 1;
      width: 100%;
      background: rgba(11, 14, 20, 0.98);
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(102, 192, 244, 0.4);
    }
    
    .btn-clear-add {
      background: transparent; border: none; color: #8f98a0; cursor: pointer;
      width: 24px; height: 24px; border-radius: 50%; display: none;
      align-items: center; justify-content: center; flex-shrink: 0; padding: 0;
    }
    .btn-clear-add:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .add-wrapper.has-text .btn-clear-add { display: inline-flex; }

    #inputAgregar { width: 100%; min-width: 0; border: none; background: transparent; color: white; outline: none; font-family: 'Inter', sans-serif; font-size: 13px; }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      opacity: 1;
      transform: translateX(0);
      max-width: 250px;
      overflow: hidden;
      transition: flex-grow var(--t-slow) var(--ease-inout), width var(--t-slow) var(--ease-inout), background-color var(--t-slow) var(--ease-inout), border-color var(--t-slow) var(--ease-inout), box-shadow var(--t-slow) var(--ease-inout);
    }
    .right-controls.hidden {
      opacity: 0;
      transform: translateX(20px);
      max-width: 0;
      gap: 0;
      pointer-events: none;
    }

    .search-results-dropdown {
      display: none;
      position: absolute;
      top: 42px;
      left: 0;
      width: 100%;
      max-height: 280px;
      overflow-y: auto;
      background: rgba(20, 30, 45, 0.99);
      border: 1px solid rgba(102, 192, 244, 0.45);
      border-radius: 12px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.9);
      z-index: 10001;
      padding: 6px;
    }
    .search-results-dropdown.open { display: block; }
    .search-result-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color var(--t-fast) var(--ease-out);
    }
    .search-result-item:hover { background: rgba(102, 192, 244, 0.16); }
    .search-result-item img {
      width: 34px; height: 48px; object-fit: cover; border-radius: 5px; background: #111; flex-shrink: 0;
    }
    .search-result-info { flex: 1; min-width: 0; }
    .search-result-title { font-size: 12px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-result-sub { font-size: 10px; color: #8f98a0; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-result-badge { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 10px; background: rgba(102,192,244,0.18); color: var(--accent); flex-shrink: 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      border: none; cursor: pointer; font-weight: 700;
      position: relative; overflow: hidden; font-size: 13px; flex-shrink: 0;
      transition: transform var(--t-fast) var(--ease-out), background-color var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out), box-shadow var(--t-fast) var(--ease-out), opacity var(--t-fast) var(--ease-out);
    }
    .btn:active { transform: scale(0.95); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-circle {
      width: 32px; height: 32px; border-radius: 50%; padding: 0;
      background: rgba(42, 71, 94, 0.85); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-circle.active { background: var(--accent); color: #0b0e14; border-color: var(--accent); }
    .btn-circle.has-filters { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(102, 192, 244, 0.25); }
    .btn-circle.has-filters::after {
      content: ''; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px;
      border-radius: 50%; background: #a4d007;
    }

    .btn-primary {
      background: var(--btn-primary); color: #0b0e14; border-radius: 50%;
      width: 26px; height: 26px; padding: 0; font-size: 15px; font-weight: 900; flex-shrink: 0;
    }
    .btn-text {
      background: var(--btn-primary); color: #0b0e14; border-radius: 8px;
      padding: 10px 16px; font-size: 13px; width: auto; height: auto;
    }
    .btn-text:hover { filter: brightness(1.1); }

    #progress-container {
      width: 100%; display: none; margin-top: 2px;
      background: rgba(0,0,0,0.8); border-radius: 8px; overflow: hidden; height: 10px; position: relative;
    }
    #progress-bar { height: 100%; background: linear-gradient(90deg, var(--warning), #ffeb3b); width: 0%; transition: width var(--t-slow) var(--ease-out); }
    #progress-text {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: bold; color: #0b0e14;
    }

    .stats-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; margin-top: 6px; }
    .stat-pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px;
      background: rgba(24, 35, 50, 0.78); border: 1px solid rgba(102, 192, 244, 0.16);
      font-size: 11px; font-weight: 700; color: #c7d5e0;
    }
    .stat-pill strong { color: #fff; }

    /* PANEL DE FILTROS */
    .filter-panel {
      position: fixed;
      top: calc(165px + env(safe-area-inset-top, 0px));
      left: 12px;
      right: 12px;
      max-width: 350px;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(27, 40, 56, 0.99) 0%, rgba(18, 27, 40, 0.99) 100%);
      border: 1px solid rgba(102, 192, 244, 0.35);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.85);
      z-index: 9998;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: calc(100dvh - 185px);
      overflow-y: auto;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: opacity var(--t-base) var(--ease-out), visibility var(--t-base) var(--ease-out), transform var(--t-base) var(--ease-out);
    }
    .filter-panel.open { opacity: 1; visibility: visible; transform: translateY(0); }
    .filter-group { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .filter-group:empty { display: none; }
    .filter-group label { font-size: 11px; color: #8f98a0; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
    .filter-group select {
      background: rgba(0,0,0,0.45); color: white; border: 1px solid rgba(255,255,255,0.12);
      padding: 7px 10px; border-radius: 8px; font-size: 12px; outline: none; cursor: pointer; width: 100%;
    }
    .filter-reset {
      width: 100%; margin-top: 4px; padding: 8px;
      background: rgba(201, 59, 59, 0.15); color: #ff6b6b;
      border: 1px solid rgba(201, 59, 59, 0.3); border-radius: 8px;
      cursor: pointer; font-weight: 700; font-size: 12px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      transition: opacity var(--t-base) var(--ease-out), transform var(--t-base) var(--ease-out);
      width: 100%;
    }
    @media (min-width: 601px) {
      #grid.poster-mode {
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 16px;
      }
      #grid.poster-mode > .card {
        display: flex;
        flex-direction: column;
      }
      #grid.poster-mode .img-container {
        width: 100%;
        min-width: 0;
        height: auto;
        aspect-ratio: 2 / 3;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px 12px 0 0;
      }
      #grid.poster-mode .card-content {
        padding: 10px 12px;
        justify-content: flex-start;
        flex-grow: 1;
        min-width: 0;
      }
      #grid.poster-mode .top-badge {
        top: 8px;
        left: 8px;
        padding: 3px 8px;
        font-size: 10px;
        max-width: calc(60% - 10px);
      }
      #grid.poster-mode .wishlist-badge {
        top: 8px;
        bottom: auto;
        right: 8px;
        padding: 3px 8px;
        font-size: 10px;
      }
    }

    #grid > .card {
      content-visibility: auto;
      contain-intrinsic-size: 0 320px;
      background: #182332; border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(102, 192, 244, 0.24);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      cursor: pointer; display: flex; flex-direction: column;
      min-width: 0;
      transition: transform var(--t-base) var(--ease-out), border-color var(--t-base) var(--ease-out);
    }

    .img-container {
      position: relative; width: 100%; aspect-ratio: 460 / 215;
      background-color: #131922; overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    #grid.poster-mode .img-container { aspect-ratio: 2 / 3; }
    .img-container img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform var(--t-slow) var(--ease-out); }

    .top-badge {
      position: absolute; top: 8px; left: 8px; z-index: 5;
      max-width: calc(56% - 10px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding: 3px 8px; border-radius: 20px;
      background: rgba(11, 14, 20, 0.85); backdrop-filter: blur(6px);
      border: 1px solid rgba(102, 192, 244, 0.55);
      font-size: 10px; font-weight: 800; color: var(--accent);
      display: inline-flex; align-items: center; gap: 4px;
    }
    .wishlist-badge {
      position: absolute; top: 8px; right: 8px; z-index: 5;
      padding: 3px 8px; border-radius: 20px;
      background: rgba(11, 14, 20, 0.85); backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 77, 109, 0.65);
      font-size: 10px; font-weight: 800; color: #fff;
      display: inline-flex; align-items: center; gap: 4px;
    }

    .card-content { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; min-width: 0; }
    .card-title {
      font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 3px;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; overflow-wrap: break-word; word-break: break-word;
    }
    .card-dev {
      font-size: 11px; color: #8f98a0; margin-bottom: 10px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .status-container { display: flex; gap: 5px; flex-wrap: wrap; margin-top: auto; }
    .status-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 700;
      border: 1px solid transparent; max-width: 100%;
    }
    .status-none { background: rgba(255,255,255,0.05); color: #8f98a0; border-color: rgba(255,255,255,0.12); }
    .status-playing { background: rgba(214, 169, 24, 0.15); color: #f4d03f; border-color: rgba(214, 169, 24, 0.4); }
    .status-done { background: rgba(91, 163, 43, 0.15); color: #8fe35e; border-color: rgba(91, 163, 43, 0.4); }

    /* VISTA DE ESTADÍSTICAS REORGANIZADA Y COMPACTA */
    #stats-view { display: none; flex-direction: column; gap: 8px; animation: fadeIn var(--t-base) var(--ease-out); width: 100%; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .stats-selectors-row {
      display: flex;
      gap: 6px;
      background: rgba(16, 24, 36, 0.95);
      padding: 5px;
      border-radius: 10px;
      border: 1px solid rgba(102, 192, 244, 0.22);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .stats-selectors-row::-webkit-scrollbar { display: none; }

    .stat-prof-name { display: inline-block; max-width: 12ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
    .stats-prof-btn, .stats-cat-btn {
      flex: 1;
      min-width: max-content;
      padding: 6px 8px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: #8f98a0;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background-color var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out), box-shadow var(--t-fast) var(--ease-out);
    }
    .stats-prof-btn.active, .stats-cat-btn.active {
      background: var(--accent);
      color: #0b0e14;
      box-shadow: 0 2px 8px rgba(102, 192, 244, 0.3);
    }
    .stats-prof-btn.active .ico-angel,
    .stats-prof-btn.active .ico-talmai,
    .tab-btn.active .ico,
    .match-tab.active .ico {
      color: #0b0e14;
    }

    .stats-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .stat-card {
      background: linear-gradient(180deg, rgba(27, 40, 56, 0.95) 0%, rgba(18, 27, 40, 0.95) 100%);
      border: 1px solid rgba(102, 192, 244, 0.22);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      cursor: pointer;
      user-select: none;
      transition: border-color var(--t-fast) var(--ease-out);
      min-width: 0;
    }
    .stat-card:hover { border-color: var(--accent); }
    .stat-card-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .stat-card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #8f98a0; font-weight: 800; }
    .stat-card-value { font-size: 22px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 6px; }
    .stat-card-sub { font-size: 11px; color: #c7d5e0; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }

      border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .match-tab.active { background: var(--accent); color: #0b0e14; }
    .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-height: 48dvh; overflow-y: auto; padding-right: 4px; }
    .match-card {
      background: rgba(0,0,0,0.3); border: 1px solid rgba(102,192,244,0.2); border-radius: 8px;
      overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform var(--t-fast) var(--ease-out), border-color var(--t-fast) var(--ease-out); min-width: 0;
    }
    .match-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .match-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; }
    .match-card-body { padding: 6px; display: flex; flex-direction: column; flex-grow: 1; min-width: 0; }
    .match-card-title {
      font-size: 11px; font-weight: 800; color: #fff; margin-bottom: 3px;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    #toast-container {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      width: max-content; max-width: calc(100vw - 24px);
      z-index: 20000; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
    }
    .toast {
      background: rgba(24, 35, 50, 0.96); color: #fff; padding: 8px 16px; border-radius: 25px;
      border: 1px solid rgba(102, 192, 244, 0.45); font-size: 12px; font-weight: 700;
      text-align: center; max-width: 100%;
      opacity: 0; transform: translateY(10px); transition: opacity var(--t-base) var(--ease-out), transform var(--t-base) var(--ease-out);
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { border-color: rgba(91, 163, 43, 0.75); color: #b7f592; }
    .toast.warning { border-color: rgba(214, 169, 24, 0.75); color: #ffe380; }
    .toast.error { border-color: rgba(201, 59, 59, 0.75); color: #ff9999; }

    .spinner-container { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 45vh; grid-column: 1 / -1; }
    .spinner { width: 35px; height: 35px; border: 3px solid rgba(102, 192, 244, 0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 600px) {
      .modal-content { padding: 14px; border-radius: 14px; }
      .modal-title { font-size: 17px; padding-right: 36px; }
      .stats-cards-grid { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .tracking-container { grid-template-columns: 1fr; }
      #grid.poster-mode {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      #grid.poster-mode > .card {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto;
        grid-template-areas:
          "media"
          "body";
      }
      #grid.poster-mode .img-container {
        grid-area: media;
        width: 100%;
        min-width: 0;
        height: auto;
        aspect-ratio: 2 / 3;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px 12px 0 0;
      }
      #grid.poster-mode .card-content {
        grid-area: body;
      }
      .modal-header-grid.poster {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto;
        grid-template-areas:
          "media"
          "body";
        text-align: left;
        gap: 12px;
      }
      .modal-header-grid.poster .modal-img {
        grid-area: media;
        width: 100%;
        max-width: 210px;
        margin: 0 auto;
        aspect-ratio: 2 / 3;
      }
      .modal-header-grid.poster .modal-header-info {
        grid-area: body;
        padding-right: 44px;
      }
      .modal-header-grid.poster .modal-title { padding-right: 36px; justify-content: flex-start; font-size: 17px; }
      .modal-header-grid.poster .version-badges { justify-content: flex-start; }
      .modal-header-grid.poster .modal-genres { justify-content: flex-start; }
      .tab-btn { padding: 7px 8px; font-size: 11px; }
      .tab-btn .ico { width: 16px; height: 16px; }
      .tab-btn .tab-text { display: none; }
    }

    .chapter-tracker-box { background: rgba(16, 24, 36, 0.75); border: 1px solid rgba(102, 192, 244, 0.25); border-radius: 8px; padding: 8px; margin-bottom: 8px; }
    .chapter-inputs-row { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }
    .chapter-num-input { width: 100%; min-width: 0; padding: 6px; border-radius: 6px; background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.14); color: #fff; font-size: 12px; font-weight: 700; text-align: center; outline: none; }
    .chapter-num-input:focus { border-color: var(--accent); }
    .chapter-num-input:disabled { opacity: 0.7; cursor: not-allowed; }
    .chapter-sep { color: #8f98a0; font-weight: 900; font-size: 13px; flex-shrink: 0; }
    .chapter-pct-badge { background: rgba(102, 192, 244, 0.18); color: var(--accent); font-size: 10px; font-weight: 900; padding: 3px 6px; border-radius: 6px; min-width: 42px; text-align: center; flex-shrink: 0; }
    .reading-progress-track { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.08); border-radius: 5px; overflow: hidden; }
    .reading-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #5ba32b); width: 0%; transition: width var(--t-slow) var(--ease-out); }
    .card-reading-bar { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
    .card-reading-labels { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; color: #8f98a0; }
  </style>
</head>
<body>

  <div id="app-screen">
    <div class="top-header">
      <div class="category-tabs">
        <button class="tab-btn active" data-cat="Juegos" title="Juegos" onclick="cambiarCategoria('Juegos')">
          <svg class="ico"><use href="#i-gamepad"/></svg> <span class="tab-text">Juegos</span>
        </button>
        <button class="tab-btn" data-cat="Peliculas_Series" title="Cine y Series" onclick="cambiarCategoria('Peliculas_Series')">
          <svg class="ico"><use href="#i-film"/></svg> <span class="tab-text">Cine y Series</span>
        </button>
        <button class="tab-btn" data-cat="Libros" title="Libros" onclick="cambiarCategoria('Libros')">
          <svg class="ico"><use href="#i-book"/></svg> <span class="tab-text">Libros</span>
        </button>
        <button class="tab-btn" data-cat="Mangas" title="Mangas" onclick="cambiarCategoria('Mangas')">
          <svg class="ico"><use href="#i-manga"/></svg> <span class="tab-text">Mangas</span>
        </button>
        <button class="tab-btn" data-cat="Estadisticas" title="Estadísticas" onclick="cambiarCategoria('Estadisticas')">
          <svg class="ico"><use href="#i-stats"/></svg> <span class="tab-text">Stats</span>
        </button>
      </div>

      <div class="controls" id="main-controls-box">
        <div class="controls-row">
          <div class="search-wrapper">
            <svg class="ico"><use href="#i-search"/></svg>
            <input type="text" id="inputBuscar" placeholder="Filtrar juegos por título, dev, género o tag..." oninput="filtrarItemsDebounced()">
          </div>
        </div>

        <div class="controls-row">
          <div class="add-wrapper" id="add-wrapper-box">
            <svg class="ico ico-sm" style="color:#8f98a0; margin-right:6px;"><use href="#i-plus"/></svg>
            <input type="text" id="inputAgregar" placeholder="AppID, URL o nombre..." onfocus="activarModoBusquedaAgregar(true)" oninput="syncAddClearBtn(); autocompletarAgregarDebounced()" onkeydown="if(event.key==='Enter') manejarAgregar()">
            <button type="button" class="btn-clear-add" onclick="cerrarBusquedaAgregar(true)" title="Limpiar">
              <svg class="ico ico-sm"><use href="#i-x"/></svg>
            </button>
            <button id="btn-add" class="btn btn-primary" onclick="manejarAgregar()" title="Buscar o añadir" style="margin-left:3px;">
              <svg class="ico ico-sm"><use href="#i-plus"/></svg>
            </button>
            <div id="search-dropdown" class="search-results-dropdown"></div>
          </div>

          <div class="right-controls" id="right-ctrls">
            <button class="btn btn-circle" onclick="abrirMatchModal()" title="Modo Match de Pareja" style="color:#ff8fa3;">
              <svg class="ico"><use href="#i-heart-fill"/></svg>
            </button>
            <button class="btn btn-circle" onclick="elegirAleatorio()" title="Elección aleatoria">
              <svg class="ico"><use href="#i-dice"/></svg>
            </button>
            <button id="btn-toggle-filtros" class="btn btn-circle" onclick="toggleFiltros(event)" title="Filtros y Orden">
              <svg class="ico"><use href="#i-filter"/></svg>
            </button>
            <button id="btn-sync" class="btn btn-circle" onclick="forzarSincronizacion()" title="Sincronizar pestaña actual">
              <svg class="ico"><use href="#i-sync"/></svg>
            </button>
            <button class="btn btn-circle" onclick="abrirPapelera()" title="Papelera" style="color:#ff6b6b;">
              <svg class="ico"><use href="#i-trash"/></svg>
            </button>
            <button class="btn btn-circle" id="btn-vinculos" onclick="abrirVinculosModal()" title="Vínculos" style="display:none;color:#7ee0a3;position:relative;">
              <svg class="ico"><use href="#i-users"/></svg>
              <span id="vinc-badge" style="display:none;position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:#ff4d6d;color:#fff;font-size:10px;font-weight:800;line-height:16px;text-align:center;pointer-events:none;">0</span>
            </button>
          </div>
        </div>

        <div id="progress-container">
          <div id="progress-bar"></div>
          <div id="progress-text">Iniciando...</div>
        </div>
      </div>
    </div>

    <!-- PANEL DE FILTROS -->
    <div id="panel-filtros" class="filter-panel" onclick="event.stopPropagation()">
      <div id="filter-personas"></div>
      <div class="filter-group">
        <label><svg class="ico ico-sm ico-wish"><use href="#i-heart-fill"/></svg> Lista de Deseados</label>
        <select id="filter-deseado" onchange="filtrarItems()"></select>
      </div>
      <div class="filter-group" id="extra-filter-1"></div>
      <div class="filter-group" id="extra-filter-2"></div>
      <div class="filter-group" id="extra-filter-3"></div>

      <div class="filter-group">
        <label>Ordenar por</label>
        <select id="filter-orden" onchange="filtrarItems()">
          <option value="az">Alfabético (A - Z)</option>
          <option value="za">Alfabético (Z - A)</option>
          <option value="recientes">Últimos añadidos</option>
          <option value="puntuacion">Puntuación</option>
        </select>
      </div>
      <button class="filter-reset" onclick="resetFiltros()">Limpiar Filtros</button>
    </div>

    <div id="stats-bar" class="stats-bar" style="display:none;"></div>
    <div id="grid"></div>

    <!-- VISTA DE ESTADÍSTICAS REORGANIZADA Y COMPACTA -->
    <div id="stats-view">
      <div class="stats-selectors-row" id="stats-prof-buttons"></div>
      <div class="stats-selectors-row">
        <button class="stats-cat-btn active" data-statcat="todas" onclick="cambiarCategoriaStats('todas')">
          <svg class="ico ico-sm"><use href="#i-globe"/></svg> Global
        </button>
        <button class="stats-cat-btn" data-statcat="Juegos" onclick="cambiarCategoriaStats('Juegos')">
          <svg class="ico ico-sm"><use href="#i-gamepad"/></svg> Juegos
        </button>
        <button class="stats-cat-btn" data-statcat="Peliculas_Series" onclick="cambiarCategoriaStats('Peliculas_Series')">
          <svg class="ico ico-sm"><use href="#i-film"/></svg> Cine
        </button>
        <button class="stats-cat-btn" data-statcat="Libros" onclick="cambiarCategoriaStats('Libros')">
          <svg class="ico ico-sm"><use href="#i-book"/></svg> Libros
        </button>
        <button class="stats-cat-btn" data-statcat="Mangas" onclick="cambiarCategoriaStats('Mangas')">
          <svg class="ico ico-sm"><use href="#i-manga"/></svg> Mangas
