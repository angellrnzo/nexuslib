    // ---- editor matriz visibility por vínculo (Phase 5A) ----
    var VINCULOS_CATS = [
      ['Juegos', 'cfg.Juegos.label'], ['Peliculas_Series', 'Películas/Series'],
      ['Libros', 'cfg.Libros.label'], ['Mangas', 'cfg.Mangas.label']
    ];
    var VINCULOS_FIELDS = [
      ['status', 'vf.status'], ['rating', 'vf.rating'], ['wishlist', 'vf.wishlist'],
      ['progress', 'vf.progress'], ['notes', 'vf.notes']
    ];

    function visSel(pid) {
      window._visSel = window._visSel || {};
      if (!window._visSel[pid]) window._visSel[pid] = { dir: 'out', cat: 'Juegos' };
      return window._visSel[pid];
    }

    function toggleVisPanel(pid) {
      var p = document.getElementById('vis-panel-' + pid);
      if (!p) return;
      if (p.style.display === 'none' || !p.innerHTML) {
        p.style.display = 'block';
        renderVisPanel(pid);
      } else {
        p.style.display = 'none';
      }
    }

    function visSetDir(pid, dir) { visSel(pid).dir = dir; renderVisPanel(pid); }
    function visSetCat(pid, cat) { visSel(pid).cat = cat; renderVisPanel(pid); }

    function renderVisPanel(pid) {
      var p = document.getElementById('vis-panel-' + pid);
      var info = (window._vincPorPid || {})[pid];
      if (!p || !info) return;
      var sel = visSel(pid);
      var dirs = [];
      if (info.rows.out) dirs.push({ k: 'out', label: 'Yo → ' + info.name });
      if (info.rows.in)  dirs.push({ k: 'in',  label: info.name + ' → yo' });
      if (!dirs.length) { p.innerHTML = '<div class="sp-empty">' + t('vis.none') + '</div>'; return; }
      if (!info.rows[sel.dir]) sel.dir = dirs[0].k;
      var row = info.rows[sel.dir];
      var catVis = (row.visibility && row.visibility[sel.cat]) || {};

      var h = '<div class="sp-panel" style="padding:10px;">';
      h += '<div class="sp-label" style="margin-bottom:6px;">' + t('vis.dir') + '</div>' +
           '<div style="display:flex;gap:6px;margin-bottom:10px;">';
      dirs.forEach(function(dd) {
        var on = dd.k === sel.dir;
        h += '<button class="sp-btn" style="flex:1;padding:6px;font-size:11px;' +
             (on ? 'background:var(--accent);color:#0b0e14;border-color:transparent;' : '') +
             '" onclick="visSetDir(\'' + pid + '\',\'' + dd.k + '\')">' + vinculosEsc(dd.label) + '</button>';
      });
      h += '</div>';
      h += '<div class="sp-label" style="margin-bottom:6px;">' + t('vis.cat') + '</div>' +
           '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">';
      VINCULOS_CATS.forEach(function(cc) {
        var on = cc[0] === sel.cat;
        h += '<button class="sp-btn" style="padding:5px 9px;font-size:11px;' +
             (on ? 'background:rgba(102,192,244,.18);border-color:rgba(102,192,244,.4);color:var(--accent);' : '') +
             '" onclick="visSetCat(\'' + pid + '\',\'' + cc[0] + '\')">' + t(cc[1]) + '</button>';
      });
      h += '</div>';
      h += '<div class="sp-label" style="margin-bottom:6px;">' + t('vis.fields') + ' — ' +
           vinculosEsc(sel.dir === 'out' ? t('vis.you') : t('vis.them')) + '</div>';
      VINCULOS_FIELDS.forEach(function(f) {
        var on = catVis[f[0]] === true;
        h += '<label class="sp-row" style="padding:6px 10px;">' +
             '<input type="checkbox" class="sp-check" id="vis-f-' + pid + '-' + f[0] + '"' + (on ? ' checked' : '') + '> ' +
             '<span class="sp-name" style="font-size:12px;">' + t(f[1]) + '</span></label>';
      });
      h += '<div class="sp-hint">' + t('vis.hint') + '</div>';
      h += '<div class="sp-actions" style="margin-top:10px;">' +
           '<button class="sp-btn sp-btn-primary" onclick="vinculosGuardarVisibilidad(\'' + pid + '\')">' + t('btn.guardar') + '</button></div>';
      h += '</div>';
      p.innerHTML = h;
    }

    async function vinculosGuardarVisibilidad(pid) {
      var info = (window._vincPorPid || {})[pid];
      var sel = visSel(pid);
      if (!info || !info.rows[sel.dir]) return;
      var row = info.rows[sel.dir];
      var vis = JSON.parse(JSON.stringify(row.visibility || {}));
      if (!vis[sel.cat]) vis[sel.cat] = {};
      VINCULOS_FIELDS.forEach(function(f) {
        var el = document.getElementById('vis-f-' + pid + '-' + f[0]);
        if (el) vis[sel.cat][f[0]] = el.checked;
      });
      try {
        var sb = await nexusSb();
        var r = await sb.from('library_links').update({ visibility: vis }).eq('id', row.link_id);
        if (r.error) throw new Error(r.error.message);
        row.visibility = vis;
        showToast && showToast(t('toast.visupd'), 'success');
        renderVisPanel(pid);
      } catch (e) {
        showToast && showToast(t('err.prefix') + (e.message || ''), 'error');
      }
    }

    // ---- compartir tracking por item (Phase 5: is_private + shared_with) ----
    var _shareCtx = null; // {cat, id, k} k = 'angel'|'talmai' (mi sección)

    async function nexusFetchMyPrivacy(category, externalId) {
      var sb = await nexusSb();
      await nexusEnsureProfile();
      var mediaId = await nexusMediaId(category, externalId);
      if (!mediaId) return { is_private: false, shared_with: null };
      var r = await sb.from('user_media_tracking')
        .select('is_private,shared_with')
        .eq('profile_id', _nexusUser.id).eq('media_item_id', mediaId).maybeSingle();
      if (r.error) throw new Error(r.error.message);
      return r.data || { is_private: false, shared_with: null };
    }

    // muestra el botón "Compartir" solo en la sección del usuario logueado
    var _shareUiSeq = 0;
    async function nexusSyncShareUI(it) {
      if (!NEXUS_MODE || !it) return;
      var seq = ++_shareUiSeq;
      // sin perfil cargado nexusPersona() devuelve 'Yo' -> todas las secciones
      // quedarian como solo-lectura; esperar a que cargue primero
      try { await nexusEnsureProfile(); } catch (e) {}
      if (seq !== _shareUiSeq) return; // se abrio otro item mientras cargaba
      nexusItemPersonas(it).forEach(function(p) {
        var k = p.key;
        var box = document.getElementById('share-box-' + k);
        var btn = document.getElementById('btn-share-' + k);
        if (!box || !btn) return;
        if (!p.mine) {
          box.style.display = 'none';
          // Phase 5: la sección del vinculado es solo lectura
          var accR = document.getElementById('acc-' + k);
          if (accR) accR.classList.add('is-remote');
          return;
        }
        box.style.display = 'block';
        var accS = document.getElementById('acc-' + k);
        if (accS) accS.classList.remove('is-remote');
        btn.innerHTML = svgIcon('i-users', 'ico-sm') + ' ' + t('sh.links');
        nexusFetchMyPrivacy(currentCategory, it.id).then(function(st) {
          var sw = st.shared_with;
          var n = Array.isArray(sw) ? sw.length : 0;
          if (st.is_private) {
            btn.innerHTML = svgIcon('i-lock', 'ico-sm') + ' ' + t('sh.privatebtn');
            btn.style.background = 'rgba(255,107,107,.10)';
            btn.style.color = '#ff8585'; btn.style.borderColor = 'rgba(255,133,133,.4)';
            btn.style.boxShadow = '0 0 10px rgba(255,107,107,.12)';
          } else if (n > 0) {
            btn.innerHTML = svgIcon('i-users', 'ico-sm') + ' ' + tf('sh.withn', { n: n, w: n === 1 ? t('sh.person') : t('sh.people') });
            btn.style.background = 'rgba(126,224,163,.10)';
            btn.style.color = '#7ee0a3'; btn.style.borderColor = 'rgba(126,224,163,.4)';
            btn.style.boxShadow = '0 0 10px rgba(126,224,163,.12)';
          } else {
            btn.innerHTML = svgIcon('i-users', 'ico-sm') + ' ' + t('sh.links');
            btn.style.background = 'rgba(126,224,163,.10)';
            btn.style.color = '#7ee0a3';
            btn.style.borderColor = 'rgba(126,224,163,.4)';
            btn.style.boxShadow = '0 0 10px rgba(126,224,163,.14)';
          }
        }).catch(function() {});
      });
    }

    function nexusSharePanel(k) { return document.getElementById('share-panel-' + k); }

    async function toggleSharePanel(k) {
      if (!NEXUS_MODE || !currentItemId) return;
      var panel = nexusSharePanel(k);
      if (!panel) return;
      var sendPanel = nexusSendPanel(k);
      if (sendPanel) sendPanel.style.display = 'none';
      if (panel.style.display !== 'none' && panel.innerHTML) {
        panel.style.display = 'none';
        return;
      }
      panel.style.display = 'block';
      panel.innerHTML = '<div class="sp-empty">' + t('vinc.loading') + '</div>';
      _shareCtx = { cat: currentCategory, id: currentItemId, k: k };
      try {
        var d = await nexusMisVinculos();
        if (!_shareCtx || _shareCtx.k !== k) return; // usuario cambió de sección
        var st = await nexusFetchMyPrivacy(_shareCtx.cat, _shareCtx.id);
        renderSharePanel(st, d.links || []);
      } catch (e) {
        panel.innerHTML = '<div class="sp-empty" style="color:#ff8585;">Error: ' + vinculosEsc(e.message) + '</div>';
      }
    }

    var VINCULOS_BADGE_COLORS = {
      pareja:  { bg: '#ff8fa3', fg: '#2a0f16' },
      familia: { bg: '#ffd479', fg: '#2a1f08' },
      amigo:   { bg: '#66c0f4', fg: '#0b2436' },
      custom:  { bg: '#b39ddb', fg: '#1c1430' }
    };
    function vinculosTypeLabel(x) {
      if (x && x.link_type === 'custom' && x.link_label) return x.link_label;
      return t(VINCULOS_LINK_TYPES[x && x.link_type]) || (x && x.link_type) || '';
    }

    function nexusLinkBadge(linkType, linkLabel) {
      var c = VINCULOS_BADGE_COLORS[linkType] || VINCULOS_BADGE_COLORS.custom;
      var label = (linkType === 'custom' && linkLabel) ? linkLabel
                : t(VINCULOS_LINK_TYPES[linkType] || linkType || '');
      return '<span class="sp-badge" style="background:' + c.bg + '22;color:' + c.bg + ';border:1px solid ' + c.bg + '55;">' + vinculosEsc(label) + '</span>';
    }
    function nexusAvatar(name, color) {
      var ini = (name || '?').trim().charAt(0).toUpperCase();
      return '<span class="sp-avatar" style="background:' + color + ';">' + vinculosEsc(ini) + '</span>';
    }

    function renderSharePanel(st, links) {
      var k = _shareCtx.k;
      var panel = nexusSharePanel(k);
      var aceptados = (links || []).filter(function(x) {
        return x.status === 'accepted' && x.other && x.other.profile_id;
      });
      var vistos = {}, personas = [];
      aceptados.forEach(function(x) {
        var pid = x.other.profile_id;
        if (!vistos[pid]) { vistos[pid] = true; personas.push(x); }
      });

      var sw = Array.isArray(st.shared_with) ? st.shared_with : [];
      var h = '';

      h += '<div class="sp-label" style="color:#ff8585;">' + svgIcon('i-lock', 'ico-sm') + ' ' + t('sh.privacy') + '</div>';

      // toggle privado
      h += '<label class="sp-row' + (st.is_private ? ' sp-row-danger' : '') + '">' +
           '<input type="checkbox" class="sp-check" id="share-privado-' + k + '"' + (st.is_private ? ' checked' : '') + '> ' +
           svgIcon('i-lock', 'ico-sm') + ' <span class="sp-name" style="font-size:12px;">' + t('sh.private') + '</span></label>';

      // audiencia (solo si no está privado)
      h += '<div id="share-aud-' + k + '" style="' + (st.is_private ? 'display:none;' : '') + 'margin-top:10px;">';
      h += '<div class="sp-label">' + t('sh.visible') + '</div>';
      h += '<label class="sp-row" style="padding:8px 10px;"><input type="radio" class="sp-check" name="share-mode-' + k + '"' + (sw.length === 0 ? ' checked' : '') + '> ' +
           '<span class="sp-name" style="font-size:12px;">' + t('sh.all') + '</span></label>';
      personas.forEach(function(x) {
        var pid = x.other.profile_id;
        var sel = sw.indexOf(pid) !== -1;
        var col = VINCULOS_BADGE_COLORS[x.link_type] ? VINCULOS_BADGE_COLORS[x.link_type].bg : '#66c0f4';
        h += '<label class="sp-row" style="padding:8px 10px;"><input type="checkbox" class="sp-check share-person-' + k + '" value="' + pid + '"' + (sel ? ' checked' : '') + '> ' +
             nexusAvatar(vinculosNombre(x.other), col) +
             '<span class="sp-name" style="font-size:12px;">' + vinculosEsc(vinculosNombre(x.other)) + '</span>' +
             nexusLinkBadge(x.link_type, x.link_label) + '</label>';
      });
      if (!personas.length) {
        h += '<div class="sp-empty">' + t('sh.nolink') + '</div>';
      }
      h += '</div>';
      h += '<div class="sp-hint">' + t('sh.hint') + '</div>';
      h += '<div class="sp-actions">' +
           '<button class="sp-btn sp-btn-primary" onclick="guardarSharePanel(\'' + k + '\')">' + t('btn.guardar') + '</button>' +
           '<button class="sp-btn" onclick="nexusSharePanel(\'' + k + '\').style.display=\'none\'">' + t('btn.cerrar') + '</button></div>';

      panel.innerHTML = h;
      var priv = document.getElementById('share-privado-' + k);
      priv.addEventListener('change', function() {
        var row = priv.closest('.sp-row');
        if (row) row.classList.toggle('sp-row-danger', priv.checked);
        document.getElementById('share-aud-' + k).style.display = priv.checked ? 'none' : 'block';
      });
    }

    // muestra/oculta acordeones por persona segun visible{Persona} y
    // colapsa el grid a 1 columna cuando solo queda una seccion
    function nexusSetAccordionVisibility(it) {
      var wrap = document.getElementById('tracking-personas');
      if (!wrap) return;
      var visibles = 0;
      nexusItemPersonas(it).forEach(function(p) {
        var acc = document.getElementById('acc-' + p.key);
        if (!acc) return;
        var oculto = it['visible' + p.suffix] === false;
        acc.style.display = oculto ? 'none' : '';
        if (!oculto) visibles++;
      });
      wrap.style.gridTemplateColumns = visibles > 1 ? '' : '1fr';
    }

    // refresca campos de personas/privacidad del item desde la DB al abrir el
    // modal — el cache local puede tener visible{Persona} viejo (TTL 12h)
    async function nexusRefreshItemPrivacy(it) {
      if (!NEXUS_MODE || !it) return;
      try {
        var sb = await nexusSb();
        var r = await sb.rpc('get_item_merged', {
          p_category: currentCategory, p_external_id: String(it.id)
        });
        if (r.error || !r.data || typeof r.data !== 'object') return;
        var fresh = r.data;
        var changed = false;
        Object.keys(fresh).forEach(function(k) {
          if (/^(visible|estado|estrellas|deseado|progreso|nota)/.test(k) && fresh[k] !== it[k]) {
            it[k] = fresh[k]; changed = true;
          }
        });
        if (changed) {
          nexusSetAccordionVisibility(it);
          try {
            localStorage.setItem('media_lib_' + CACHE_VERSION + '_' + currentCategory,
              JSON.stringify(itemsByCategory[currentCategory]));
          } catch (e) {}
        }
      } catch (e) {}
    }

    // ---- enviar item a un vínculo (Phase 5d: item_share_requests) ----
    function nexusSendPanel(k) { return document.getElementById('send-panel-' + k); }

    async function toggleSendPanel(k) {
      if (!NEXUS_MODE || !currentItemId) return;
      var panel = nexusSendPanel(k);
      var sharePanel = nexusSharePanel(k);
      if (sharePanel) sharePanel.style.display = 'none';
      if (panel.style.display !== 'none' && panel.innerHTML) {
        panel.style.display = 'none';
        return;
      }
      panel.style.display = 'block';
      panel.innerHTML = '<div class="sp-empty">' + t('vinc.loading') + '</div>';
      try {
        var d = await nexusMisVinculos();
        if (!nexusSendPanel(k) || nexusSendPanel(k).style.display === 'none') return;
        var vistos = {}, personas = [];
        (d.links || []).forEach(function(x) {
          if (x.status !== 'accepted' || !x.other || !x.other.profile_id) return;
          var pid = x.other.profile_id;
          if (!vistos[pid]) { vistos[pid] = true; personas.push(x); }
        });
        window._sendPersonas = window._sendPersonas || {};
        window._sendPersonas[k] = {};
        personas.forEach(function(x) { window._sendPersonas[k][x.other.profile_id] = vinculosNombre(x.other); });
        var h = '<div class="sp-label">' + svgIcon('i-send', 'ico-sm') + ' ' + t('send.to') + '</div>';
        if (!personas.length) {
          h += '<div class="sp-empty">' + t('send.nolink') + '</div>';
        }
        personas.forEach(function(x) {
          var col = VINCULOS_BADGE_COLORS[x.link_type] ? VINCULOS_BADGE_COLORS[x.link_type].bg : '#66c0f4';
          h += '<button class="sp-row" onclick="nexusSendItem(\'' + k + '\',\'' + x.other.profile_id + '\')">' +
               nexusAvatar(vinculosNombre(x.other), col) +
               '<span class="sp-name">' + vinculosEsc(vinculosNombre(x.other)) + '</span>' +
               nexusLinkBadge(x.link_type, x.link_label) +
               svgIcon('i-chevron-down', 'ico-sm') + '</button>';
        });
        h += '<div class="sp-hint">' + t('send.hint') + '</div>';
        h += '<div id="send-msg-' + k + '" class="sp-msg"></div>';
        panel.innerHTML = h;
      } catch (e) {
        panel.innerHTML = '<div class="sp-empty" style="color:#ff8585;">Error: ' + vinculosEsc(e.message) + '</div>';
      }
    }

    async function nexusSendItem(k, profileId) {
      var nombre = (window._sendPersonas && window._sendPersonas[k] && window._sendPersonas[k][profileId]) || t('send.person');
      var msg = document.getElementById('send-msg-' + k);
      if (msg) { msg.textContent = t('vinc.sending'); msg.style.color = '#8f98a0'; }
      try {
        var sb = await nexusSb();
        var r = await sb.rpc('send_item_share', {
          p_category: currentCategory,
          p_external_id: String(currentItemId),
          p_to_profile_id: profileId
        });
        if (r.error) throw new Error(r.error.message);
        if (msg) { msg.textContent = tf('send.sent', { n: nombre }); msg.style.color = '#7ee0a3'; }
        showToast && showToast(tf('send.toast', { n: nombre }), 'success');
      } catch (e) {
        if (msg) { msg.textContent = e.message || 'Error'; msg.style.color = '#ff8585'; }
      }
    }

    async function guardarSharePanel(k, persona) {
      if (!_shareCtx || _shareCtx.k !== k || !currentItemId) return;
      var priv = document.getElementById('share-privado-' + k);
      var isPrivate = priv && priv.checked;
      var sw = [];
      if (!isPrivate) {
        document.querySelectorAll('.share-person-' + k + ':checked').forEach(function(c) { sw.push(c.value); });
      }
      try {
        await nexusTrackingUpsert(_shareCtx.cat, _shareCtx.id, {
          is_private: isPrivate,
          shared_with: (isPrivate || sw.length === 0) ? null : sw
        });
        var ctx = _shareCtx;
        nexusSharePanel(k).style.display = 'none';
        nexusSyncShareUI({ id: ctx.id });
        showToast && showToast(t('toast.privupd'), 'success');
      } catch (e) {
        showToast && showToast(t('err.prefix') + (e.message || ''), 'error');
      }
    }
  </script>

  <script>
    const CATEGORY_ORDER = ['Juegos', 'Peliculas_Series', 'Libros', 'Mangas', 'Coleccionables'];
    var currentCategory = 'Juegos';
    var elementosPorPagina = 36;
    var paginaActual = 1;
    var observer = null;
    var itemsByCategory = { Juegos: [], Peliculas_Series: [], Libros: [], Mangas: [] };
    var filteredItems = [];

    // ---- personas dinámicas (Phase 5: multi-vínculo) ----
    // get_items_merged emite campos sufijados por persona: estado{Sufijo},
    // visible{Sufijo}, etc. Sufijo = initcap(username) — ver phase5h_username.sql.
    // 'estadoEmision'/'notaParche' son campos de catálogo — se excluyen.
    var PERSONA_PALETTE = ['#66c0f4', '#ff4d6d', '#7ee0a3', '#ffd479', '#b48cff', '#ff9f43', '#54e0c7', '#f368e0'];
    var _personas = []; // registro global [{suffix,key,color}] ordenado alfabético

    function nexusScanItemPersonas(it, set) {
      Object.keys(it || {}).forEach(function(k) {
        var m = k.match(/^(?:estado|visible|username)([A-Z][A-Za-zÀ-ÿ0-9_]*)$/);
        if (m && m[1] !== 'Emision') set[m[1]] = true;
      });
    }

    function nexusRebuildPersonas() {
      var set = {}, labels = {};
      Object.keys(itemsByCategory).forEach(function(c) {
        var arr = itemsByCategory[c] || [];
        for (var i = 0; i < Math.min(arr.length, 3); i++) {
          var it = arr[i];
          nexusScanItemPersonas(it, set);
          Object.keys(it || {}).forEach(function(k) {
            var m = k.match(/^username([A-Z][A-Za-zÀ-ÿ0-9_]*)$/);
            if (m && it[k] && !labels[m[1]]) labels[m[1]] = String(it[k]);
          });
        }
      });
      var sufs = Object.keys(set).sort(function(a, b) { return a.localeCompare(b); });
      _personas = sufs.map(function(suf, i) {
        return { suffix: suf, key: suf.toLowerCase(), color: PERSONA_PALETTE[i % PERSONA_PALETTE.length],
                 label: labels[suf] || suf };
      });
    }

    // nombre visible de una persona: username{Suf} del item > label global > sufijo
    function nexusPersonaLabel(it, suf) {
      var v = it && it['username' + suf];
      if (v) return String(v);
      var g = (_personas || []).filter(function(p) { return p.suffix === suf; })[0];
      return g ? g.label : suf;
    }

    // personas de UN item concreto (modal): mi persona primero, resto alfabético
    function nexusItemPersonas(it) {
      var set = {};
      nexusScanItemPersonas(it, set);
      var yo = String(nexusPersona() || '').toLowerCase();
      var sufs = Object.keys(set).sort(function(a, b) {
        var am = a.toLowerCase() === yo, bm = b.toLowerCase() === yo;
        if (am !== bm) return am ? -1 : 1;
        return a.localeCompare(b);
      });
      var cmap = {};
      (_personas || []).forEach(function(p) { cmap[p.suffix] = p; });
      return sufs.map(function(suf) {
        var g = cmap[suf];
        return { suffix: suf, key: suf.toLowerCase(), mine: suf.toLowerCase() === yo,
                 color: (g && g.color) || PERSONA_PALETTE[0],
                 label: nexusPersonaLabel(it, suf) };
      });
    }

    // dot de color de persona para chips/badges
    function nexusPersonaDot(p, size) {
      var s = size || 14;
      return '<span style="display:inline-flex;align-items:center;justify-content:center;width:' + s + 'px;height:' + s +
        'px;border-radius:50%;background:' + p.color + ';color:#0b0e14;font-size:' + Math.round(s * 0.55) +
        'px;font-weight:800;flex-shrink:0;">' + vinculosEsc(p.suffix.charAt(0)) + '</span>';
    }

             '<option value="7">' + t('fl.nota7') + '</option><option value="9">' + t('fl.nota9') + '</option></select></div>';
      });
      if (wrap) wrap.innerHTML = h;
      (_personas || []).forEach(function(p) {
        var e = document.getElementById('filter-est-' + p.key);
        var n = document.getElementById('filter-nota-' + p.key);

        selDeseado.innerHTML = dh;
        selDeseado.value = prevDeseado;
        if (selDeseado.value !== prevDeseado) selDeseado.value = 'todos';
      }

      // orden por nota de cada persona
      if (selOrden) {
        var oh = '<option value="az">' + t('sort.az') + '</option><option value="za">' + t('sort.za') + '</option>' +
                '<option value="recientes">' + t('sort.recientes') + '</option>';
        (_personas || []).forEach(function(p) {
          oh += '<option value="nota:' + p.key + '">' + tf('fl.nota', { n: vinculosEsc(p.label || p.suffix) }) + '</option>';
        });

        selOrden.innerHTML = oh;
        selOrden.value = prevOrden;
        if (selOrden.value !== prevOrden) selOrden.value = 'az';
      }
    }

    /* NAVEGACIÓN POR DESLIZAMIENTO HORIZONTAL (SWIPE) ENTRE PESTAÑAS */
    function inicializarGestosSwipe() {
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartTime = 0;
      let swipeIgnorado = false;

      document.addEventListener('touchstart', function(e) {
        if (e.touches.length !== 1) { swipeIgnorado = true; return; }
        const t = e.target;
        const hayModal =
          document.getElementById('modal').style.display === 'flex' ||
          document.getElementById('modal-papelera').style.display === 'flex' ||
          document.getElementById('modal-match').style.display === 'flex' ||
          document.getElementById('panel-filtros').classList.contains('open');

        if (hayModal || t.closest('.carousel, .category-tabs, .stats-selectors-row, input, textarea, select')) {
          swipeIgnorado = true;
          return;
        }
        swipeIgnorado = false;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
      }, { passive: true });

      document.addEventListener('touchend', function(e) {
        if (swipeIgnorado || e.changedTouches.length !== 1) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        const dt = Date.now() - touchStartTime;

        if (dt < 550 && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) {
          const idx = CATEGORY_ORDER.indexOf(currentCategory);
          if (idx === -1) return;
          if (dx < 0 && idx < CATEGORY_ORDER.length - 1) {
            cambiarCategoria(CATEGORY_ORDER[idx + 1]);
          } else if (dx > 0 && idx > 0) {
            cambiarCategoria(CATEGORY_ORDER[idx - 1]);
          }
        }
      }, { passive: true });
    }

    window.onload = function() {
      if (NEXUS_MODE) { nexusBoot(nexusInitApp); return; }
      nexusInitApp();
    };

    function nexusInitApp() {
      if (NEXUS_MODE) {
        nexusRefreshVinculosBadge();
        setInterval(nexusRefreshVinculosBadge, 60000);
      }
      configurarFiltrosCategoria('Juegos');
      applyStaticI18n();
      cargarCategoria('Juegos', false);
      setTimeout(nexusSyncHeaderSpace, 50);
      ['Peliculas_Series', 'Libros', 'Mangas'].forEach(c => precargarCategoriaSilenciosa(c));
      inicializarGestosSwipe();
      var inputBuscarEl = document.getElementById('inputBuscar');
      if (inputBuscarEl) {
        inputBuscarEl.addEventListener('focus', function() {
          cerrarBusquedaAgregar();
          if (!busquedaFiltroActiva) {
            busquedaFiltroActiva = true;
            history.pushState({ sf: true }, '', window.location.href);
          }
        });
        inputBuscarEl.addEventListener('click', function() { cerrarBusquedaAgregar(); });
      }
      var lastScrollY = window.scrollY || window.pageYOffset || 0;
      window.addEventListener('scroll', function() {
        var curY = window.scrollY || window.pageYOffset || 0;
        if (Math.abs(curY - lastScrollY) > 6 && document.getElementById('add-wrapper-box').classList.contains('expanded')) {
          cerrarBusquedaAgregar();
        }
        lastScrollY = curY;
      }, { passive: true });
      var swipeStartX = 0, swipeStartY = 0;
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
          swipeStartX = e.touches[0].clientX;
          swipeStartY = e.touches[0].clientY;
        }
      }, { passive: true });
      document.addEventListener('touchmove', function(e) {
        if (e.touches.length !== 1) return;
        if (!document.getElementById('add-wrapper-box').classList.contains('expanded')) return;
        
        // No cerrar si el toque se origina dentro del dropdown de resultados
        if (e.target.closest('#search-dropdown')) return;

        var dx = Math.abs(e.touches[0].clientX - swipeStartX);
        var dy = Math.abs(e.touches[0].clientY - swipeStartY);
        if (dx > 18 || dy > 18) {
          cerrarBusquedaAgregar();
        }
      }, { passive: true });

      window.addEventListener('popstate', function(event) {
        var dropdown = document.getElementById('search-dropdown');
        var panelFiltros = document.getElementById('panel-filtros');
        var modalDetalle = document.getElementById('modal');
        var modalPapelera = document.getElementById('modal-papelera');
        var modalMatch = document.getElementById('modal-match');

        if (modalDetalle.style.display === 'flex') { cerrarModal(); history.pushState(null, '', window.location.href); }
        else if (modalPapelera.style.display === 'flex') { cerrarPapelera(); history.pushState(null, '', window.location.href); }
        else if (modalMatch.style.display === 'flex') { cerrarMatchModal(); history.pushState(null, '', window.location.href); }
        else if (document.getElementById('menu-panel') && document.getElementById('menu-panel').classList.contains('open')) {
          cerrarMenuPanel();
          history.pushState(null, '', window.location.href);
        }
        else if (panelFiltros.classList.contains('open')) {
          panelFiltros.classList.remove('open');
          document.getElementById('btn-toggle-filtros').classList.remove('active');
          history.pushState(null, '', window.location.href);
        }
        else if (busquedaFiltroActiva || document.activeElement === document.getElementById('inputBuscar')) {
          busquedaFiltroActiva = false;
          document.getElementById('inputBuscar').blur();
          history.pushState(null, '', window.location.href);
        }
        else if (dropdown.classList.contains('open') || document.activeElement === document.getElementById('inputAgregar') || document.getElementById('add-wrapper-box').classList.contains('expanded')) {
          cerrarBusquedaAgregar();
          history.pushState(null, '', window.location.href);
        }
      });
      history.pushState(null, '', window.location.href);

      document.addEventListener('click', function(e) {
        var panel = document.getElementById('panel-filtros');
        var btn = document.getElementById('btn-toggle-filtros');
        if (panel.classList.contains('open') && !panel.contains(e.target) && !btn.contains(e.target)) {
          panel.classList.remove('open');
          btn.classList.remove('active');
        }
        var mPanel = document.getElementById('menu-panel');
        var mBtn = document.getElementById('btn-menu');
        if (mPanel && mPanel.classList.contains('open') && !mPanel.contains(e.target) && !(mBtn && mBtn.contains(e.target))) {
          cerrarMenuPanel();
        }
        var dd = document.getElementById('search-dropdown');
        var addWrap = document.querySelector('.add-wrapper');
        if (dd && dd.classList.contains('open') && !addWrap.contains(e.target)) {
          cerrarBusquedaAgregar();
        }
      });
    };

    function precargarCategoriaSilenciosa(cat) {
      var _hasFresh = false;
      try {
        var raw = localStorage.getItem(`media_lib_${CACHE_VERSION}_${cat}`);
        var ts = localStorage.getItem(`media_lib_time_${CACHE_VERSION}_${cat}`);
        if (raw && ts) {
          itemsByCategory[cat] = JSON.parse(raw);
          _hasFresh = (Date.now() - Number(ts) < MAX_CACHE_AGE);
          if (_hasFresh) return;
        }
      } catch (e) {}

      RUN
        .withSuccessHandler(function(lista) {
          itemsByCategory[cat] = Array.isArray(lista) ? lista : [];
          try {
            localStorage.setItem(`media_lib_${CACHE_VERSION}_${cat}`, JSON.stringify(itemsByCategory[cat]));
            localStorage.setItem(`media_lib_time_${CACHE_VERSION}_${cat}`, String(Date.now()));
          } catch (e) {}
          if (currentCategory === 'Estadisticas') renderizarEstadisticas();
        })
        .getItems(cat);
    }

    function cambiarCategoria(cat) {
      if (cat === currentCategory) return;
      var _prevIdx = CATEGORY_ORDER.indexOf(currentCategory);
      var _newIdx = CATEGORY_ORDER.indexOf(cat);
      var _dir = (_prevIdx !== -1 && _newIdx > _prevIdx) ? 'next' : (_prevIdx !== -1 ? 'prev' : '');
      currentCategory = cat;
      paginaActual = 1;
      window._pendingGridDir = _dir;

      var panel = document.getElementById('panel-filtros');
      if (panel.classList.contains('open')) {
        panel.classList.remove('open');
        document.getElementById('btn-toggle-filtros').classList.remove('active');
      }

      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-cat') === cat);
      });

      var grid = document.getElementById('grid');
      var statsView = document.getElementById('stats-view');
      var controlsBox = document.getElementById('main-controls-box');
      var statsBar = document.getElementById('stats-bar');

      if (cat === 'Estadisticas') {
        grid.style.display = 'none';
        statsBar.style.display = 'none';
        controlsBox.style.display = 'none';
        statsView.style.display = 'flex';
        document.body.classList.add('view-stats');
        ['Juegos', 'Peliculas_Series', 'Libros', 'Mangas'].forEach(c => precargarCategoriaSilenciosa(c));
        renderizarEstadisticas();
        setTimeout(nexusSyncHeaderSpace, 0);
        return;
      } else {
        document.body.classList.remove('view-stats');
        controlsBox.style.display = 'flex';
        statsView.style.display = 'none';
        grid.style.display = 'grid';
        setTimeout(nexusSyncHeaderSpace, 0);
      }

      var cfg = CAT_CONFIG[cat];
      document.getElementById('inputBuscar').value = '';
      document.getElementById('inputBuscar').placeholder = catText(cat, 'searchPlaceholder');
      document.getElementById('inputAgregar').value = '';
      document.getElementById('inputAgregar').placeholder = catText(cat, 'addPlaceholder');
      cerrarBusquedaAgregar();

      grid.classList.toggle('poster-mode', cfg.poster);
      if (window._pendingGridDir) {
        grid.classList.remove('grid-in-next', 'grid-in-prev');
        void grid.offsetWidth;
        grid.classList.add('grid-in-' + window._pendingGridDir);
        var _gd = window._pendingGridDir;
        window._pendingGridDir = '';
        setTimeout(function() { grid.classList.remove('grid-in-' + _gd); }, 700);
      }

      configurarFiltrosCategoria(cat);
      resetFiltros(true);
      cargarCategoria(cat, false);
    }

    function cargarCategoria(cat, forzarRed) {
      if (cat === 'Estadisticas') return;
      if (cat === 'Coleccionables') {
        if (currentCategory === cat) {
          document.getElementById('grid').innerHTML = nexusStateBox('empty', 'i-star',
            'Coleccionables — próximamente',
            'Figuras, juegos de mesa, rompecabezas, LEGO y más. Esta sección llega en una fase posterior del roadmap.');
        }
        return;
      }
      var _stale = false;
      if (!forzarRed) {
        try {
          var raw = localStorage.getItem(`media_lib_${CACHE_VERSION}_${cat}`);
          var ts = localStorage.getItem(`media_lib_time_${CACHE_VERSION}_${cat}`);
          if (raw && ts) {
            var cached = JSON.parse(raw);
            itemsByCategory[cat] = cached;
            if (Date.now() - Number(ts) < MAX_CACHE_AGE) {
              nexusRebuildPersonas();
              nexusRenderFilterPersonas();
              filtrarItems();
              return;
            }
            _stale = true; // cache viejo: mostrar ya y refrescar en segundo plano
          }
        } catch (e) {}
      }
      if (_stale && currentCategory === cat) {
        nexusRebuildPersonas();
        nexusRenderFilterPersonas();
        filtrarItems();
      }

      var grid = document.getElementById('grid');
      if (currentCategory === cat) {
        grid.innerHTML = nexusSkeletonGrid(8);
      }

      RUN
        .withSuccessHandler(function(lista) {
          itemsByCategory[cat] = Array.isArray(lista) ? lista : [];
          try {
            localStorage.setItem(`media_lib_${CACHE_VERSION}_${cat}`, JSON.stringify(itemsByCategory[cat]));
            localStorage.setItem(`media_lib_time_${CACHE_VERSION}_${cat}`, String(Date.now()));
          } catch (e) {}
          nexusRebuildPersonas();
          nexusRenderFilterPersonas();
          if (currentCategory === cat) filtrarItems();
          else if (currentCategory === 'Estadisticas') renderizarEstadisticas();
        })
        .withFailureHandler(function(err) {
          // si habia cache stale, el grid ya tiene datos — solo avisar
          if (currentCategory === cat && !(itemsByCategory[cat] && itemsByCategory[cat].length)) {
            grid.innerHTML = nexusStateBox('err', 'i-x', t('toast.errload'), err.message || '', '<button class="sb-action" onclick="cargarCategoria(\'' + cat + '\', true)">' + t('toast.reintentar') + '</button>');
          } else if (currentCategory === cat) {
            showToast && showToast(t('toast.offupd'), 'warning');
          }
        })
        .getItems(cat);
    }

    function forzarSincronizacion() {
      if (currentCategory === 'Estadisticas') {
        ['Juegos', 'Peliculas_Series', 'Libros', 'Mangas'].forEach(c => cargarCategoria(c, true));
        showToast(t('toast.statsupd'), 'success');
      } else if (currentCategory === 'Coleccionables') {
        showToast(t('toast.nocolec'), 'warning');
      } else {
        cargarCategoria(currentCategory, true);
      }
    }

    function resetFiltros(noRender) {
      (_personas || []).forEach(function(p) {
        var e = document.getElementById('filter-est-' + p.key);
        var n = document.getElementById('filter-nota-' + p.key);
        if (e) e.value = 'todos';
        if (n) n.value = '0';
      });
      document.getElementById('filter-deseado').value = 'todos';
      document.getElementById('filter-orden').value = 'az';
      fSubcat = 'todos';
      ['f-extra-1', 'f-extra-2', 'f-extra-3'].forEach(id => {
        var el = document.getElementById(id);
        if (el) el.value = 'todos';
      });
      if (!noRender) filtrarItems();
    }

    var fSubcat = 'todos'; // sub-filtro Cine y Series: todos|pelicula|serie|anime

    function filtrarItems() {
      paginaActual = 1;
      var lista = itemsByCategory[currentCategory] || [];
      var q = document.getElementById('inputBuscar').value.toLowerCase().trim();
      var fDeseado = document.getElementById('filter-deseado').value;
      var fOrden = document.getElementById('filter-orden').value;
      var e1 = document.getElementById('f-extra-1')?.value || 'todos';
      var e2 = document.getElementById('f-extra-2')?.value || 'todos';
      var e3 = document.getElementById('f-extra-3')?.value || 'todos';

      // filtros por persona: {key: {est, notaMin}}
      var fPers = {};
      var hayPers = false;
      (_personas || []).forEach(function(p) {
        var est = document.getElementById('filter-est-' + p.key);
        var nota = document.getElementById('filter-nota-' + p.key);
        var fv = est ? est.value : 'todos';
        var nv = nota ? (parseInt(nota.value, 10) || 0) : 0;
        fPers[p.key] = { est: fv, notaMin: nv, suffix: p.suffix };
        if (fv !== 'todos' || nv > 0) hayPers = true;
      });

      var hayFiltros = hayPers || fDeseado !== 'todos' || e1 !== 'todos' || e2 !== 'todos' || e3 !== 'todos' || fOrden !== 'az';
      document.getElementById('btn-toggle-filtros').classList.toggle('has-filters', hayFiltros);

      // sub-filtro superior solo para Peliculas_Series
      if (currentCategory === 'Peliculas_Series' && fSubcat !== 'todos') {
        lista = lista.filter(function(it) {
          var tipo = String(it.tipo || '');
          var esAnime = tipo === 'Serie' && /animaci/i.test(String(it.generos || ''));
          if (fSubcat === 'pelicula') return tipo === 'Película';
          if (fSubcat === 'serie') return tipo === 'Serie' && !esAnime;
          if (fSubcat === 'anime') return esAnime;
          return true;
        });
      }

      var filtrados = lista.filter(function(it) {
        var matchQ = !q ||
          String(it.titulo).toLowerCase().includes(q) ||
          String(it.creador).toLowerCase().includes(q) ||
          String(it.generos).toLowerCase().includes(q) ||
          String(it.tags || '').toLowerCase().includes(q) ||
          String(it.id).toLowerCase().includes(q);

        // filtros por persona
        var dMap = {};
        var allDeseado = true, anyDeseado = false;
        for (var pk in fPers) {
          var fp = fPers[pk];
          var est = it['estado' + fp.suffix] || 'No jugado';
          if (fp.est !== 'todos' && est !== fp.est) return false;
          var pts = Number(it['estrellas' + fp.suffix]) || 0;
          if (fp.notaMin > 0 && pts < fp.notaMin) return false;
          var d = Boolean(it['deseado' + fp.suffix]);
          dMap[pk] = d;
          if (d) anyDeseado = true; else allDeseado = false;
        }
        if (fDeseado === 'cualquiera' && !anyDeseado) return false;
        if (fDeseado === 'ninguno' && anyDeseado) return false;
        if (fDeseado === 'all' && !allDeseado) return false;
        if (fDeseado.indexOf('solo:') === 0) {
          var sk = fDeseado.slice(5);
          var sp = (_personas || []).filter(function(x) { return x.key === sk; })[0];
          if (sp && !it['deseado' + sp.suffix]) return false;
        }

        if (currentCategory === 'Juegos') {
          var modos = String(it.modos || '').toLowerCase();
          if (e1 === 'coop' && !(modos.includes('co-op') || modos.includes('cooperativo') || modos.includes('remote play'))) return false;
          if (e1 !== 'todos' && e1 !== 'coop' && !modos.includes(e1.toLowerCase())) return false;
          if (e2 !== 'todos' && !String(it.steamdeck || '').toLowerCase().includes(e2.toLowerCase())) return false;
          var pr = String(it.precio || '').toLowerCase();
          var gratis = pr.includes('gratis') || pr.includes('free');
          if (e3 === 'gratis' && !gratis) return false;
          if (e3 === 'pago' && (gratis || !pr || pr === 'n/a')) return false;
        } else if (currentCategory === 'Peliculas_Series') {
          // e1 (Tipo) lo maneja el sub-filtro fSubcat — evita doble filtro
          if (e2 !== 'todos' && !String(it.plataformas || '').toLowerCase().includes(e2.toLowerCase())) return false;
          if (e3 !== 'todos' && !String(it.estadoEmision || '').toLowerCase().includes(e3.toLowerCase())) return false;
        } else if (currentCategory === 'Libros') {
          var pags = parseInt(String(it.extension || '').replace(/\D/g, ''), 10) || 0;
          if (e1 === 'corto' && (pags === 0 || pags >= 250)) return false;
          if (e1 === 'medio' && (pags < 250 || pags > 500)) return false;
          if (e1 === 'largo' && pags <= 500) return false;
        } else if (currentCategory === 'Mangas') {
          if (e1 !== 'todos' && !String(it.estadoEmision || '').toLowerCase().includes(e1.toLowerCase())) return false;
          if (e2 !== 'todos' && !String(it.demografia || '').toLowerCase().includes(e2.toLowerCase())) return false;
        }

        return matchQ;
      });

      function obtenerPuntuacionNormalizada(puntuacionRaw) {
        var s = formatearPuntuacionBadge_(puntuacionRaw);
        if (!s) return 0;
        var num = parseFloat(s);
        if (isNaN(num)) return 0;
        if (num > 10) return num / 10;
        return num;
      }

      filteredItems = [].concat(filtrados).sort(function(a, b) {
        if (fOrden === 'za') return String(b.titulo).localeCompare(String(a.titulo));
        if (fOrden === 'recientes') return (b.index || 0) - (a.index || 0);
        if (fOrden.indexOf('nota:') === 0) {
          var ok = fOrden.slice(5);
          var op = (_personas || []).filter(function(x) { return x.key === ok; })[0];
          if (op) return (b['estrellas' + op.suffix] || 0) - (a['estrellas' + op.suffix] || 0);
        }
        if (fOrden === 'puntuacion') return obtenerPuntuacionNormalizada(b.puntuacion) - obtenerPuntuacionNormalizada(a.puntuacion);
        return String(a.titulo).localeCompare(String(b.titulo));
      });

      actualizarStats(lista.length, filteredItems.length);
      renderGrid(filteredItems);
    }

    function actualizarStats(total, mostrados) {
      var bar = document.getElementById('stats-bar');
      if (!total) { bar.style.display = 'none'; return; }
      var lista = itemsByCategory[currentCategory] || [];
      var pills = '';
      (_personas || []).forEach(function(p) {
        var cN = lista.filter(function(x) {
          return x['estado' + p.suffix] === 'Completado' && x['visible' + p.suffix] !== false;
        }).length;
        pills += `<div class="stat-pill">${nexusPersonaDot(p, 12)} Completados: <strong>${cN}</strong></div>`;
      });
      var des = lista.filter(function(x) {
        return (_personas || []).some(function(p) { return x['deseado' + p.suffix] && x['visible' + p.suffix] !== false; });
      }).length;

      bar.style.display = 'flex';
      bar.innerHTML =
        `<div class="stat-pill">${svgIcon('i-folder', 'ico-sm')} Mostrando <strong>${mostrados} / ${total}</strong></div>` +
        pills +
        `<div class="stat-pill">${svgIcon('i-heart-fill', 'ico-sm ico-wish')} Deseados: <strong>${des}</strong></div>`;
    }

    function escaparHTML(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    const FALLBACK_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='450'><rect width='100%25' height='100%25' fill='%23171a21'/><text x='50%25' y='50%25' fill='%2366c0f4' font-family='sans-serif' font-size='16' font-weight='bold' text-anchor='middle' dominant-baseline='middle'>Sin Imagen</text></svg>";

    // srcset por proveedor — el browser baja solo el peso que necesita:
    //   OpenLibrary: -S(128)/-M(250)/-L(500) · TMDB: w342/w500/w780 · Steam: header/capsule616
    function nexusCoverSrcset(url) {
      var u = String(url || '');
      var m = u.match(/^(https:\/\/covers\.openlibrary\.org\/b\/id\/\d+)-(?:S|M|L)\.jpg$/);
      if (m) { var b = m[1]; return b + '-S.jpg 128w, ' + b + '-M.jpg 250w, ' + b + '-L.jpg 500w'; }
      m = u.match(/^(https:\/\/image\.tmdb\.org\/t\/p\/)(?:w\d+|original)(\/.*)$/);
      if (m) return m[1] + 'w342' + m[2] + ' 342w, ' + m[1] + 'w500' + m[2] + ' 500w, ' + m[1] + 'w780' + m[2] + ' 780w';
      m = u.match(/^(https:\/\/cdn\.cloudflare\.steamstatic\.com\/steam\/apps\/\d+\/)header\.jpg$/);
      if (m) return m[1] + 'header.jpg 460w, ' + m[1] + 'capsule_616x353.jpg 616w';
      return '';
    }
    // version grande para lightbox (OL -L, TMDB original, Steam capsule 616)
    function nexusCoverFull(url) {
      var u = String(url || '');
      u = u.replace(/-(S|M)\.jpg$/, '-L.jpg');
      u = u.replace(/(\/t\/p\/)(?:w\d+|original)(\/)/, '$1original$2');
      u = u.replace(/(\/steam\/apps\/\d+\/)header\.jpg$/, '$1capsule_616x353.jpg');
      return u;
    }

    var _nexusLastTouchTs = 0;
    document.addEventListener('touchstart', function() { _nexusLastTouchTs = Date.now(); }, true);

    // double-tap en tarjeta: burst + toggle wishlist propio (sin abrir modal)
    function nexusHeartBurst(card) {
      var hb = document.createElement('div');
      hb.className = 'heart-burst';
      hb.innerHTML = '<svg class="ico"><use href="#i-heart-fill"/></svg>';
      card.querySelector('.img-container').appendChild(hb);
      setTimeout(function() { hb.remove(); }, 650);
    }
    function nexusToggleDeseadoCard(it) {
      var me = (_personas || []).find(function(p) { return p.mine; });
      if (!me) return;
      var suf = me.suffix;
      var nuevo = !Boolean(it['deseado' + suf]);
      it['deseado' + suf] = nuevo;
      try { localStorage.setItem('media_lib_' + CACHE_VERSION + '_' + currentCategory, JSON.stringify(itemsByCategory[currentCategory])); } catch (e) {}
      filtrarItems();
      RUN.guardarDeseadoItem(currentCategory, it.id, suf, nuevo).withFailureHandler(function(){ showToast(t('toast.savefail'), 'error'); });
    }

    function renderGrid(items) {
      var grid = document.getElementById('grid');
      if (!items || items.length === 0) {
        grid.innerHTML = nexusStateBox('empty', 'i-search', t('grid.empty'), t('grid.emptydesc'));
        return;
      }
      var itemsVisibles = items.slice(0, paginaActual * elementosPorPagina);
      var frag = document.createDocumentFragment();

      itemsVisibles.forEach(function(it) {
        var card = document.createElement('div');
        card.className = 'card';
        var _tapTs = 0, _suppressUntil = 0;
        card.addEventListener('touchend', function() {
          var n = Date.now();
          if (n - _tapTs < 300) {
            _suppressUntil = n + 450;
            nexusHeartBurst(card);
            nexusToggleDeseadoCard(it);
          }
          _tapTs = n;
        }, { passive: true });
        card.addEventListener('dblclick', function(e) {
          if (Date.now() - _nexusLastTouchTs < 1000) return; // touch ya lo maneja touchend
          e.preventDefault();
          nexusHeartBurst(card);
          nexusToggleDeseadoCard(it);
        });
        card.addEventListener('click', function(e) {
          if (e.detail > 1) return;
          if (Date.now() < _suppressUntil) return;
          var recentTouch = (Date.now() - _nexusLastTouchTs) < 1000;
          if (recentTouch) {
            setTimeout(function() {
              if (Date.now() >= _suppressUntil) abrirModal(it.id);
            }, 300);
          } else {
            abrirModal(it.id);
          }
        });

        // personas del item (dinámico multi-vínculo)
        var pers = nexusItemPersonas(it);
        var chipsHTML = '';
        var wishDots = '';
        var anyWish = false;
        pers.forEach(function(p) {
          var vis = it['visible' + p.suffix] !== false;
          if (!vis) return;
          var est = it['estado' + p.suffix] || 'No jugado';
          var cls = est === 'Completado' ? 'status-done' : (est === 'En proceso' ? 'status-playing' : 'status-none');
          var lbl = (!est || est === 'No jugado') ? t('grid.pend') : metaTr(est);
          var lock = p.mine && it['privado' + p.suffix] === true ? svgIcon('i-lock', 'ico-sm') + ' ' : '';
          chipsHTML += `<div class="status-chip ${cls}" style="display:inline-flex;align-items:center;gap:5px;">${nexusPersonaDot(p, 13)} ${lock}${escaparHTML(lbl)}</div>`;
          if (it['deseado' + p.suffix]) { wishDots += nexusPersonaDot(p, 13); anyWish = true; }
        });

        var topBadgeHTML = '';
        if (currentCategory === 'Juegos') {
          var m = String(it.modos || '').toLowerCase();
          if (m.includes('co-op') || m.includes('cooperativo')) topBadgeHTML = `<div class="top-badge">${svgIcon('i-users', 'ico-sm')} Co-op</div>`;
        } else if (currentCategory === 'Peliculas_Series' && it.tipo) {
          topBadgeHTML = `<div class="top-badge">${it.tipo === 'Serie' ? svgIcon('i-tv', 'ico-sm') + ' ' + t('grid.serie') : svgIcon('i-film', 'ico-sm') + ' ' + t('grid.pelicula')}</div>`;
        } else if (currentCategory === 'Libros' && it.extension && it.extension !== 'N/A') {
          topBadgeHTML = `<div class="top-badge">${svgIcon('i-book', 'ico-sm')} ${escaparHTML(metaTr(it.extension))}</div>`;
        } else if (currentCategory === 'Mangas' && it.demografia) {
          topBadgeHTML = `<div class="top-badge">${svgIcon('i-manga', 'ico-sm')} ${escaparHTML(it.demografia)}</div>`;
        }

        var wishBadgeHTML = anyWish ?
          `<div class="wishlist-badge" style="display:flex;align-items:center;gap:2px;">${svgIcon('i-heart-fill', 'ico-sm ico-wish')}${wishDots}</div>` : '';

        card.innerHTML = `
          <div class="img-container">
            ${topBadgeHTML} ${wishBadgeHTML}
            <img src="${escaparHTML(it.portada)}" srcset="${nexusCoverSrcset(it.portada)}" sizes="(max-width:600px) 50vw, 300px" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=FALLBACK_SVG;">
          </div>
          <div class="card-content">
            <div class="card-title">${escaparHTML(it.titulo)}</div>
            <div class="card-dev">${escaparHTML((it.creador && String(it.creador).toLowerCase() !== 'undefined') ? it.creador : ((it.autor && String(it.autor).toLowerCase() !== 'undefined') ? it.autor : t('grid.author')))}</div>
            <div class="status-container">
              ${chipsHTML}
            </div>
            ${generarBarraLecturaCard(it)}
          </div>`;
        frag.appendChild(card);
      });
      grid.replaceChildren(frag);

      if (itemsVisibles.length < items.length) {
        var sentinel = document.createElement('div');
        sentinel.id = 'scroll-sentinel';
        sentinel.style.gridColumn = '1 / -1'; sentinel.style.height = '35px'; sentinel.style.textAlign = 'center';
        sentinel.innerHTML = '<span style="color:#8f98a0;font-size:11px;">' + t('grid.more') + '</span>';
        grid.appendChild(sentinel);
        configurarObserver();
      }
    }

    function configurarObserver() {
      if (observer) observer.disconnect();
      var sentinel = document.getElementById('scroll-sentinel');
      if (!sentinel) return;
      observer = new IntersectionObserver(function(entries) {
        if (entries[0].isIntersecting) { paginaActual++; renderGrid(filteredItems); }
      }, { rootMargin: '250px' });
      observer.observe(sentinel);
    }

    function manejarAgregar(silencioso) {
      var val = document.getElementById('inputAgregar').value.trim();
      if (!val) { if (!silencioso) showToast(t('toast.addreq'), 'warning'); return; }

      var esDirecto = false;
      if (currentCategory === 'Juegos' && (/^\d+$/.test(val) || val.includes('steampowered.com/app/'))) esDirecto = true;
      if (currentCategory === 'Peliculas_Series' && (/^(movie|tv)-\d+$/i.test(val) || val.includes('themoviedb.org/'))) esDirecto = true;
      if (currentCategory === 'Libros' && (/^OL\d+[WM]$/i.test(val) || /^(\d{10}|\d{13})$/.test(val.replace(/[-\s]/g, '')) || val.includes('openlibrary.org/'))) esDirecto = true;
      if (currentCategory === 'Mangas' && (/^(al-)?\d+$/i.test(val) || val.includes('myanimelist.net/manga/') || val.includes('anilist.co/manga/'))) esDirecto = true;

      if (esDirecto) { ejecutarAgregarDirecto(val); return; }

      activarModoBusquedaAgregar(true);

      var btn = document.getElementById('btn-add');
      var dd = document.getElementById('search-dropdown');
      btn.innerHTML = '...'; btn.disabled = true;
      dd.innerHTML = '<div style="padding:12px;text-align:center;color:var(--accent);font-size:12px;"">' + t('toast.busy') + '</div>';
      dd.classList.add('open');

      var finalizado = false;
      var timer = setTimeout(function() {
        if (finalizado) return;
        finalizado = true;
        btn.innerHTML = svgIcon('i-plus', 'ico-sm'); btn.disabled = false;
        dd.innerHTML = '<div style="padding:12px;text-align:center;color:#ff8585;font-size:12px;"">' + t('toast.timeout') + '</div>';
      }, 12000);

      RUN
        .withSuccessHandler(function(resultados) {
          if (finalizado) return;
          finalizado = true; clearTimeout(timer);
          btn.innerHTML = svgIcon('i-plus', 'ico-sm'); btn.disabled = false;
          if (!resultados || resultados.length === 0) {
            dd.innerHTML = '<div style="padding:12px;text-align:center;color:#8f98a0;font-size:12px;"">' + t('toast.noresults') + '</div>';
            return;
          }
          dd.innerHTML = resultados.map(r => `
            <div class="search-result-item" onclick="ejecutarAgregarDirecto('${escaparHTML(r.id)}')">
              <img src="${escaparHTML(r.portada)}" srcset="${nexusCoverSrcset(r.portada)}" sizes="(max-width:600px) 80vw, 340px" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=FALLBACK_SVG;">
              <div class="search-result-info">
                <div class="search-result-title">${escaparHTML(r.titulo)}</div>
                <div class="search-result-sub">${escaparHTML(r.subtitulo)}</div>
              </div>
              <span class="search-result-badge">' + t('toast.addbtn') + '</span>
            </div>
          `).join('');
        })
        .withFailureHandler(function(err) {
          if (finalizado) return;
          finalizado = true; clearTimeout(timer);
          btn.innerHTML = svgIcon('i-plus', 'ico-sm'); btn.disabled = false;
          dd.classList.remove('open');
          showToast(err.message, 'error');
        })
        .buscarCatalogoExterno(currentCategory, val);
    }

    function ejecutarAgregarDirecto(idOUrl) {
      var btn = document.getElementById('btn-add');
      document.getElementById('search-dropdown').classList.remove('open');
      btn.innerHTML = '...'; btn.disabled = true;

      RUN
        .withSuccessHandler(function(res) {
          btn.innerHTML = svgIcon('i-plus', 'ico-sm'); btn.disabled = false;
          if (res.success) {
            document.getElementById('inputAgregar').value = '';
            cerrarBusquedaAgregar();
            showToast(res.msg, 'success');
            forzarSincronizacion();
          } else {
            showToast(res.msg || t('toast.noadd'), 'warning');
          }
        })
        .withFailureHandler(function(err) {
          btn.innerHTML = svgIcon('i-plus', 'ico-sm'); btn.disabled = false;
          showToast(t('err.prefix') + err.message, 'error');
        })
        .agregarItem(currentCategory, idOUrl);
    }

    function formatearPuntuacionBadge_(val) {
      if (val === null || val === undefined) return '';
      var s = String(val).trim();
      if (!s || s === 'N/A' || s.toLowerCase() === 'undefined' || s.toLowerCase() === 'null' || s === 'NaT') return '';
      // Bloquea fechas (YYYY-MM-DD, ISO o DD/MM/YYYY) para no mostrarlas como puntuación
      if (/^\d{4}-\d{2}-\d{2}/.test(s) || /^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/.test(s)) return '';
      return s;
    }

    function abrirModal(id) {
      var lista = itemsByCategory[currentCategory] || [];
      var indexEnFiltrados = filteredItems.findIndex(x => String(x.id) === String(id));
      if (indexEnFiltrados !== -1) {
        var paginaRequerida = Math.floor(indexEnFiltrados / elementosPorPagina) + 1;
        if (paginaRequerida > paginaActual) {
          paginaActual = paginaRequerida;
          renderGrid(filteredItems);
        }
      }

      var it = lista.find(x => String(x.id) === String(id));
      if (!it) return;

      document.querySelectorAll('.modal-content').forEach(function(el) { el.scrollTop = 0; });
      currentItemId = it.id;
      detenerTrailer();

      var headerGrid = document.getElementById('m-header-grid');
      headerGrid.className = 'modal-header-grid ' + (CAT_CONFIG[currentCategory].poster ? 'poster' : 'landscape');

      var mImg = document.getElementById('m-img');
      mImg.onerror = function() { this.onerror = null; this.src = FALLBACK_SVG; };
      var _olss = nexusCoverSrcset(it.portada);
      mImg.srcset = _olss;
      mImg.sizes = _olss ? '(max-width:600px) 80vw, 340px' : '';
      mImg.src = it.portada || FALLBACK_SVG;
      mImg.style.cursor = 'zoom-in';
      mImg.onclick = function() {
        var urls = [];
        if (it.portada && String(it.portada).startsWith('http')) urls.push(nexusCoverFull(it.portada));
        if (it.capturas) {
          it.capturas.split(',').forEach(function(u) {
            u = u.trim();
            if (u.startsWith('http')) { u = nexusCoverFull(u); if (urls.indexOf(u) === -1) urls.push(u); }
          });
        }
        if (urls.length) nexusOpenLightbox(urls, 0);
      };

      var autorTexto = (it.creador && String(it.creador).trim() && String(it.creador).trim().toLowerCase() !== 'undefined')
        ? String(it.creador).trim()

    async function nexusModsMediaId() {
      if (_modsCtx && _modsCtx.cat === currentCategory && String(_modsCtx.extId) === String(currentItemId)) {
        return _modsCtx.mediaId;

    async function nexusLoadMods() {
      var list = document.getElementById('mods-list');
      list.innerHTML = '<div class="mods-empty">Cargando...</div>';
      try {
        await nexusEnsureProfile();
        var mediaId = await nexusModsMediaId();
        if (!mediaId) { list.innerHTML = '<div class="mods-empty">' + t('err.itemnf') + '</div>'; return; }
        var sb = await nexusSb();
        var r = await sb.from('mods').select('id,name,source,url,version_juego,notes,created_at')
          .eq('media_item_id', mediaId).order('created_at', { ascending: true });
        if (r.error) throw new Error(r.error.message);
        _modsList = r.data || [];
        nexusRenderMods();
        nexusRenderModsSearch();
      } catch (e) {
        list.innerHTML = '<div class="mods-empty">Error: ' + escaparHTML(e.message || '') + '</div>';
      }
    }

    function nexusRenderMods() {
      var list = document.getElementById('mods-list');
      var count = document.getElementById('mods-count');
      count.textContent = _modsList.length ? (_modsList.length + (_modsList.length === 1 ? ' mod' : ' mods')) : '';
      if (!_modsList.length) { list.innerHTML = '<div class="mods-empty">Sin mods guardados todavía.</div>'; return; }
      var groups = {}, order = [];
      _modsList.forEach(function(m) {
        var v = (m.version_juego && String(m.version_juego).trim()) ? String(m.version_juego).trim() : 'Sin versión';
        if (!groups[v]) { groups[v] = []; order.push(v); }
        groups[v].push(m);
      });
      list.innerHTML = order.map(function(v) {
        var rows = groups[v].map(function(m) {
          var src = MODS_SOURCE_LABEL[m.source] || m.source;
          return '<div class="mod-row">'
            + '<div class="mod-row-main">'
            +   '<div class="mod-name">' + (m.url
                  ? '<a href="' + escaparHTML(m.url) + '" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;">' + escaparHTML(m.name) + '</a>'
                  : escaparHTML(m.name)) + '</div>'
            +   '<div class="mod-meta"><span class="mod-source">' + escaparHTML(src) + '</span><span class="mod-version">' + escaparHTML(v) + '</span></div>'
            +   (m.notes ? '<div class="mod-notes">' + escaparHTML(m.notes) + '</div>' : '')
            + '</div>'
            + '<div class="mod-actions">'
            +   (m.url ? '<a class="mod-act" href="' + escaparHTML(m.url) + '" target="_blank" rel="noopener noreferrer" title="Abrir"><svg class="ico ico-sm"><use href="#i-globe"/></svg></a>' : '')
            +   '<button class="mod-act del" onclick="nexusModBorrar(\'' + m.id + '\')" title="Eliminar"><svg class="ico ico-sm"><use href="#i-trash"/></svg></button>'
            + '</div></div>';
        }).join('');
        return '<details class="mods-group" open><summary><svg class="ico ico-sm"><use href="#i-chevron-down"/></svg> ' + escaparHTML(v)
          + ' <span class="mods-group-tag">· ' + groups[v].length + '</span></summary>' + rows + '</details>';
      }).join('');
    }

    function nexusRenderModsSearch() {
      var it = (itemsByCategory[currentCategory] || []).find(function(x) { return String(x.id) === String(currentItemId); });
      var title = it ? (it.titulo || '') : '';
      var q = encodeURIComponent(title);
      var appid = it ? String(it.id) : '';
      var links = [
        ['Nexus Mods', 'https://www.nexusmods.com/search/?gterm=' + q],
        ['Workshop', 'https://steamcommunity.com/workshop/browse/?appid=' + appid + '&searchtext=' + q],
        ['CurseForge', 'https://www.curseforge.com/search?searchText=' + q],
        ['Google', 'https://www.google.com/search?q=' + q + '+mod']
      ];
      document.getElementById('mods-search-row').innerHTML = links.map(function(l) {
        return '<a class="mods-search-btn" href="' + l[1] + '" target="_blank" rel="noopener noreferrer">'

    async function nexusModGuardar() {
      var nombre = document.getElementById('mod-nombre').value.trim();
      var fuente = document.getElementById('mod-fuente').value;
      var version = document.getElementById('mod-version').value.trim();
      var url = document.getElementById('mod-url').value.trim();
      var notas = document.getElementById('mod-notas').value.trim();
      if (!nombre) { showToast && showToast('Ponle nombre al mod.', 'error'); return; }
      try {
        await nexusEnsureProfile();
        var mediaId = await nexusModsMediaId();
        if (!mediaId) throw new Error(t('err.itemnf'));
        var sb = await nexusSb();
        var r = await sb.from('mods').insert({
          profile_id: _nexusUser.id, media_item_id: mediaId,
          name: nombre, source: fuente,
          url: url || null, version_juego: version || null, notes: notas || null
        });
        if (r.error) throw new Error(r.error.message);
        ['mod-nombre', 'mod-url', 'mod-version', 'mod-notas'].forEach(function(id) { document.getElementById(id).value = ''; });
        showToast && showToast('Mod guardado.', 'success');
        await nexusLoadMods();
      } catch (e) {
        showToast && showToast(t('err.prefix') + (e.message || ''), 'error');
      }
    }

    async function nexusModBorrar(id) {
      try {
        var sb = await nexusSb();
        var r = await sb.from('mods').delete().eq('id', id);
        if (r.error) throw new Error(r.error.message);
        _modsList = _modsList.filter(function(m) { return m.id !== id; });
        nexusRenderMods();
      } catch (e) {
        showToast && showToast(t('err.prefix') + (e.message || ''), 'error');
      }
    }

    function extraerNumeroCapitulo(progStr) {
      const m = String(progStr || '').match(/(\d+)/);
      return m ? parseInt(m[1], 10) : 0;
    }

    function obtenerTotalCapitulosItem(it) {
      if (it.capitulosTotales && Number(it.capitulosTotales) > 0) return Number(it.capitulosTotales);
      const mCaps = String(it.extension || '').match(/(\d+)\s*caps/i);
      if (mCaps) return parseInt(mCaps[1], 10);
      return 0;
    }

    function calcularPorcentajeLectura(actual, total) {
      if (!total || total <= 0 || !actual || actual <= 0) return 0;
      return Math.min(100, Math.round((actual / total) * 100));
    }

    function generarBarraLecturaCard(it) {
      if (currentCategory !== 'Libros' && currentCategory !== 'Mangas') return '';
      const total = obtenerTotalCapitulosItem(it);
      const pers = nexusItemPersonas(it);
      let html = '';
      pers.forEach(function(p) {
        const vis = it['visible' + p.suffix] !== false;
        const act = extraerNumeroCapitulo(it['progreso' + p.suffix]);
        if (!vis || (!act && it['estado' + p.suffix] !== 'En proceso')) return;
        const pct = calcularPorcentajeLectura(act, total);
        const txt = (total > 0 ? `Cap. ${act}/${total} (${pct}%)` : `Cap. ${act}`);
        html += `<div class="card-reading-labels"><span style="display:inline-flex;align-items:center;gap:5px;">${nexusPersonaDot(p, 13)} ${txt}</span></div>` +
                (total > 0 ? `<div class="reading-progress-track"><div class="reading-progress-fill" style="width:${pct}%"></div></div>` : '');
      });
      return html ? '<div class="card-reading-bar">' + html + '</div>' : '';
    }

    function inicializarCapitulosModal(k, it, progStr) {
      const actual = extraerNumeroCapitulo(progStr);
      const total = obtenerTotalCapitulosItem(it);
      const curEl = document.getElementById('chap-cur-' + k);
      const totEl = document.getElementById('chap-tot-' + k);
      const hintEl = document.getElementById('chap-hint-' + k);

      curEl.value = actual > 0 ? actual : '';
      totEl.value = total > 0 ? total : '';

      if (currentCategory === 'Mangas') {
        totEl.disabled = true;
        totEl.placeholder = 'Auto';
        hintEl.innerText = 'Auto API (semanal)';
      } else {
        totEl.disabled = false;
        totEl.placeholder = 'Desconocido';
        hintEl.innerText = 'Total editable';
      }
      refrescarPorcentajeUI(k, actual, total);
    }

    function refrescarPorcentajeUI(k, actual, total) {
      const pct = calcularPorcentajeLectura(actual, total);
      document.getElementById('chap-pct-' + k).innerText = pct + '%';
      document.getElementById('chap-bar-' + k).style.width = pct + '%';
    }

    function actualizarCapitulosUI(persona) {
      const k = persona.toLowerCase();
      const actual = Math.max(0, parseInt(document.getElementById('chap-cur-' + k).value, 10) || 0);
      const total = Math.max(0, parseInt(document.getElementById('chap-tot-' + k).value, 10) || 0);
      refrescarPorcentajeUI(k, actual, total);

      document.getElementById('prog-' + k).value = actual > 0 ? `Cap. ${actual}` : '';
      if (actual > 0 && (!document.getElementById('select-estado-' + k).value || document.getElementById('select-estado-' + k).value === 'No jugado')) {
        document.getElementById('select-estado-' + k).value = (total > 0 && actual >= total) ? 'Completado' : 'En proceso';
      }
      guardarTracking(persona);
    }

    function guardarTotalCapsDesdeModal(persona) {
      if (currentCategory === 'Mangas') return;
      const k = persona.toLowerCase();
      const total = Math.max(0, parseInt(document.getElementById('chap-tot-' + k).value, 10) || 0);
      // sincroniza el total con TODAS las demás secciones de persona del modal
      document.querySelectorAll('#tracking-personas [id^="chap-tot-"]').forEach(function(el) {
        if (el.id !== 'chap-tot-' + k) el.value = total > 0 ? total : '';
      });

      const actK = Math.max(0, parseInt(document.getElementById('chap-cur-' + k).value, 10) || 0);
      document.querySelectorAll('#tracking-personas .player-accordion').forEach(function(acc) {
        var kk = acc.id.replace('acc-', '');
        var act = Math.max(0, parseInt((document.getElementById('chap-cur-' + kk) || {}).value, 10) || 0);
        refrescarPorcentajeUI(kk, act, total);
      });

      const it = (itemsByCategory[currentCategory] || []).find(x => String(x.id) === String(currentItemId));
      if (it) {
        it.capitulosTotales = total;
        try { localStorage.setItem(`media_lib_${CACHE_VERSION}_${currentCategory}`, JSON.stringify(itemsByCategory[currentCategory])); } catch (e) {}
        filtrarItems();
      }
      RUN.guardarTotalCapitulos(currentCategory, currentItemId, total).withFailureHandler(function(){ showToast('No se pudo guardar el cambio.', 'error'); });
    }

    function guardarTracking(persona, estrellasOverride) {
      var it = (itemsByCategory[currentCategory] || []).find(x => String(x.id) === String(currentItemId));
      if (!it) return;
      var k = persona.toLowerCase();
      var est = document.getElementById('select-estado-' + k).value || 'No jugado';
      var prog = document.getElementById('prog-' + k).value;
      var pts = estrellasOverride !== undefined ? estrellasOverride : (it['estrellas' + persona] || 0);

      it['estado' + persona] = est;
      it['estrellas' + persona] = pts;
      it['progreso' + persona] = prog;

      actualizarResumenJugador(k, est, pts, Boolean(it['deseado' + persona]), it['nota' + persona]);
      try { localStorage.setItem(`media_lib_${CACHE_VERSION}_${currentCategory}`, JSON.stringify(itemsByCategory[currentCategory])); } catch (e) {}
      filtrarItems();

      RUN.guardarProgresoItem(currentCategory, currentItemId, persona, est, pts, prog).withFailureHandler(function(){ showToast('No se pudo guardar el cambio.', 'error'); });
    }

      var k = persona.toLowerCase();

      filtrarItems();

    }

        .withSuccessHandler(function(res) {
          btn.disabled = false; btn.innerHTML = `${svgIcon('i-wrench', 'ico-sm')} ${t('toast.repair')}`;
          if (res.success && res.data) {
            var lista = itemsByCategory[currentCategory];

            filtrarItems();
            showToast(t('toast.actualizada'), 'success');

        .withFailureHandler(function(err) {

      // ---- Phase 3.5A: Release Calendar (wishlist + fecha futura <=90d) ----

    // focus trap: Tab cicla solo dentro del .modal-content visible
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Tab') return;
      var open = null;
      ['modal-vinculos','modal-match','modal-papelera','modal'].forEach(function(mid) {
        var el = document.getElementById(mid);
        if (el && el.style.display === 'flex') open = el;
      });
      if (!open) return;
      var items = open.querySelectorAll('.modal-content button, .modal-content input, .modal-content select, .modal-content textarea, .modal-content a[href], .modal-content summary, .modal-content [tabindex]');
      var vis = Array.prototype.filter.call(items, function(el) { return el.offsetParent !== null && !el.disabled; });
      if (!vis.length) return;
      var first = vis[0], last = vis[vis.length - 1];
      if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
      else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
    });

    function nexusSkeletonGrid(n) {
      var h = '<div class="skel-grid">';
