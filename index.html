    function resetFiltros(noRender) {
      (_personas || []).forEach(function(p) {
        var e = document.getElementById('filter-est-' + p.key);
        var n = document.getElementById('filter-nota-' + p.key);
        if (e) e.value = 'todos';
        if (n) n.value = '0';
      });
      document.getElementById('filter-deseado').value = 'todos';
      document.getElementById('filter-orden').value = 'az';
      ['f-extra-1', 'f-extra-2', 'f-extra-3'].forEach(id => {
        var el = document.getElementById(id);
        if (el) el.value = 'todos';
      });
      if (!noRender) filtrarItems();
    }

    function filtrarItems() {
      paginaActual = 1;
      var lista = itemsByCategory[currentCategory] || [];
      var q = document.getElementById('inputBuscar').value.toLowerCase().trim();
      var fDeseado = document.getElementById('filter-deseado').value;
      var fOrden = document.getElementById('filter-orden').value;
      var e1 = document.getElementById('f-extra-1')?.value || 'todos';
      var e2 = document.getElementById('f-extra-2')?.value || 'todos';
      var e3 = document.getElementById('f-extra-3')?.value || 'todos';

      // filtros por persona: {key: {est, notaMin}}
      var fPers = {};
      var hayPers = false;
      (_personas || []).forEach(function(p) {
        var est = document.getElementById('filter-est-' + p.key);
        var nota = document.getElementById('filter-nota-' + p.key);
        var fv = est ? est.value : 'todos';
        var nv = nota ? (parseInt(nota.value, 10) || 0) : 0;
        fPers[p.key] = { est: fv, notaMin: nv, suffix: p.suffix };
        if (fv !== 'todos' || nv > 0) hayPers = true;
      });

      var hayFiltros = hayPers || fDeseado !== 'todos' || e1 !== 'todos' || e2 !== 'todos' || e3 !== 'todos' || fOrden !== 'az' || q.length > 0;
      document.getElementById('btn-toggle-filtros').classList.toggle('has-filters', hayFiltros);

      var filtrados = lista.filter(function(it) {
        var matchQ = !q ||
          String(it.titulo).toLowerCase().includes(q) ||
          String(it.creador).toLowerCase().includes(q) ||
          String(it.generos).toLowerCase().includes(q) ||
          String(it.tags || '').toLowerCase().includes(q) ||
          String(it.id).toLowerCase().includes(q);

        // filtros por persona
        var dMap = {};
        var allDeseado = true, anyDeseado = false;
        for (var pk in fPers) {
          var fp = fPers[pk];
          var est = it['estado' + fp.suffix] || 'No jugado';
          if (fp.est !== 'todos' && est !== fp.est) return false;
          var pts = Number(it['estrellas' + fp.suffix]) || 0;
          if (fp.notaMin > 0 && pts < fp.notaMin) return false;
          var d = Boolean(it['deseado' + fp.suffix]);
          dMap[pk] = d;
          if (d) anyDeseado = true; else allDeseado = false;
        }
        if (fDeseado === 'cualquiera' && !anyDeseado) return false;
        if (fDeseado === 'ninguno' && anyDeseado) return false;
        if (fDeseado === 'all' && !allDeseado) return false;
        if (fDeseado.indexOf('solo:') === 0) {
          var sk = fDeseado.slice(5);
          var sp = (_personas || []).filter(function(x) { return x.key === sk; })[0];
          if (sp && !it['deseado' + sp.suffix]) return false;
        }

        if (currentCategory === 'Juegos') {
          var modos = String(it.modos || '').toLowerCase();
          if (e1 === 'coop' && !(modos.includes('co-op') || modos.includes('cooperativo') || modos.includes('remote play'))) return false;
          if (e1 !== 'todos' && e1 !== 'coop' && !modos.includes(e1.toLowerCase())) return false;
          if (e2 !== 'todos' && !String(it.steamdeck || '').toLowerCase().includes(e2.toLowerCase())) return false;
          var pr = String(it.precio || '').toLowerCase();
          var gratis = pr.includes('gratis') || pr.includes('free');
          if (e3 === 'gratis' && !gratis) return false;
          if (e3 === 'pago' && (gratis || !pr || pr === 'n/a')) return false;
        } else if (currentCategory === 'Peliculas_Series') {
          if (e1 !== 'todos' && it.tipo !== e1) return false;
          if (e2 !== 'todos' && !String(it.plataformas || '').toLowerCase().includes(e2.toLowerCase())) return false;
          if (e3 !== 'todos' && !String(it.estadoEmision || '').toLowerCase().includes(e3.toLowerCase())) return false;
        } else if (currentCategory === 'Libros') {
          var pags = parseInt(String(it.extension || '').replace(/\D/g, ''), 10) || 0;
          if (e1 === 'corto' && (pags === 0 || pags >= 250)) return false;
          if (e1 === 'medio' && (pags < 250 || pags > 500)) return false;
          if (e1 === 'largo' && pags <= 500) return false;
        } else if (currentCategory === 'Mangas') {
          if (e1 !== 'todos' && !String(it.estadoEmision || '').toLowerCase().includes(e1.toLowerCase())) return false;
          if (e2 !== 'todos' && !String(it.demografia || '').toLowerCase().includes(e2.toLowerCase())) return false;
        }

        return matchQ;
      });

      function obtenerPuntuacionNormalizada(puntuacionRaw) {
        var s = formatearPuntuacionBadge_(puntuacionRaw);
        if (!s) return 0;
        var num = parseFloat(s);
        if (isNaN(num)) return 0;
        if (num > 10) return num / 10;
        return num;
      }

      filteredItems = [].concat(filtrados).sort(function(a, b) {
        if (fOrden === 'za') return String(b.titulo).localeCompare(String(a.titulo));
        if (fOrden === 'recientes') return (b.index || 0) - (a.index || 0);
        if (fOrden.indexOf('nota:') === 0) {
          var ok = fOrden.slice(5);
          var op = (_personas || []).filter(function(x) { return x.key === ok; })[0];
          if (op) return (b['estrellas' + op.suffix] || 0) - (a['estrellas' + op.suffix] || 0);
        }
        if (fOrden === 'puntuacion') return obtenerPuntuacionNormalizada(b.puntuacion) - obtenerPuntuacionNormalizada(a.puntuacion);
        return String(a.titulo).localeCompare(String(b.titulo));
      });

      actualizarStats(lista.length, filteredItems.length);
      renderGrid(filteredItems);
    }

    function actualizarStats(total, mostrados) {
      var bar = document.getElementById('stats-bar');
      if (!total) { bar.style.display = 'none'; return; }
      var lista = itemsByCategory[currentCategory] || [];
      var pills = '';
      (_personas || []).forEach(function(p) {
        var cN = lista.filter(function(x) {
          return x['estado' + p.suffix] === 'Completado' && x['visible' + p.suffix] !== false;
        }).length;
        pills += `<div class="stat-pill">${nexusPersonaDot(p, 12)} Completados: <strong>${cN}</strong></div>`;
      });
      var des = lista.filter(function(x) {
        return (_personas || []).some(function(p) { return x['deseado' + p.suffix] && x['visible' + p.suffix] !== false; });
      }).length;

      bar.style.display = 'flex';
      bar.innerHTML =
        `<div class="stat-pill">${svgIcon('i-folder', 'ico-sm')} Mostrando <strong>${mostrados} / ${total}</strong></div>` +
        pills +
        `<div class="stat-pill">${svgIcon('i-heart-fill', 'ico-sm ico-wish')} Deseados: <strong>${des}</strong></div>`;
    }

    function escaparHTML(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    const FALLBACK_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='450'><rect width='100%25' height='100%25' fill='%23171a21'/><text x='50%25' y='50%25' fill='%2366c0f4' font-family='sans-serif' font-size='16' font-weight='bold' text-anchor='middle' dominant-baseline='middle'>Sin Imagen</text></svg>";

    function renderGrid(items) {
      var grid = document.getElementById('grid');
      if (!items || items.length === 0) {
        grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;color:#8f98a0;margin-top:30px;">No hay elementos en esta vista.</p>';
        return;
      }
      var itemsVisibles = items.slice(0, paginaActual * elementosPorPagina);
      var frag = document.createDocumentFragment();

      itemsVisibles.forEach(function(it) {
        var card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => abrirModal(it.id);

        // personas del item (dinámico multi-vínculo)
        var pers = nexusItemPersonas(it);
        var chipsHTML = '';
        var wishDots = '';
        var anyWish = false;
        pers.forEach(function(p) {
          var vis = it['visible' + p.suffix] !== false;
          if (!vis) return;
          var est = it['estado' + p.suffix] || 'No jugado';
          var cls = est === 'Completado' ? 'status-done' : (est === 'En proceso' ? 'status-playing' : 'status-none');
          var lbl = (!est || est === 'No jugado') ? 'Pendiente' : est;
          var lock = p.mine && it['privado' + p.suffix] === true ? svgIcon('i-lock', 'ico-sm') + ' ' : '';
          chipsHTML += `<div class="status-chip ${cls}" style="display:inline-flex;align-items:center;gap:5px;">${nexusPersonaDot(p, 13)} ${lock}${escaparHTML(lbl)}</div>`;
          if (it['deseado' + p.suffix]) { wishDots += nexusPersonaDot(p, 13); anyWish = true; }
        });

        var topBadgeHTML = '';
        if (currentCategory === 'Juegos') {
          var m = String(it.modos || '').toLowerCase();
          if (m.includes('co-op') || m.includes('cooperativo')) topBadgeHTML = `<div class="top-badge">${svgIcon('i-users', 'ico-sm')} Co-op</div>`;
        } else if (currentCategory === 'Peliculas_Series' && it.tipo) {
          topBadgeHTML = `<div class="top-badge">${it.tipo === 'Serie' ? svgIcon('i-tv', 'ico-sm') + ' Serie' : svgIcon('i-film', 'ico-sm') + ' Película'}</div>`;
        } else if (currentCategory === 'Libros' && it.extension && it.extension !== 'N/A') {
          topBadgeHTML = `<div class="top-badge">${svgIcon('i-book', 'ico-sm')} ${escaparHTML(it.extension)}</div>`;
        } else if (currentCategory === 'Mangas' && it.demografia) {
          topBadgeHTML = `<div class="top-badge">${svgIcon('i-manga', 'ico-sm')} ${escaparHTML(it.demografia)}</div>`;
        }

        var wishBadgeHTML = anyWish ?
          `<div class="wishlist-badge" style="display:flex;align-items:center;gap:2px;">${svgIcon('i-heart-fill', 'ico-sm ico-wish')}${wishDots}</div>` : '';

        card.innerHTML = `
          <div class="img-container">
            ${topBadgeHTML} ${wishBadgeHTML}
            <img src="${escaparHTML(it.portada)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=FALLBACK_SVG;">
          </div>
          <div class="card-content">
            <div class="card-title">${escaparHTML(it.titulo)}</div>
            <div class="card-dev">${escaparHTML((it.creador && String(it.creador).toLowerCase() !== 'undefined') ? it.creador : ((it.autor && String(it.autor).toLowerCase() !== 'undefined') ? it.autor : 'Autor por definir'))}</div>
            <div class="status-container">
              ${chipsHTML}
            </div>
            ${generarBarraLecturaCard(it)}
          </div>`;
        frag.appendChild(card);
      });
      grid.replaceChildren(frag);

      if (itemsVisibles.length < items.length) {
        var sentinel = document.createElement('div');
        sentinel.id = 'scroll-sentinel';
        sentinel.style.gridColumn = '1 / -1'; sentinel.style.height = '35px'; sentinel.style.textAlign = 'center';
        sentinel.innerHTML = '<span style="color:#8f98a0;font-size:11px;">Cargando más...</span>';
        grid.appendChild(sentinel);
        configurarObserver();
      }
    }

    function configurarObserver() {
      if (observer) observer.disconnect();
      var sentinel = document.getElementById('scroll-sentinel');
      if (!sentinel) return;
      observer = new IntersectionObserver(function(entries) {
        if (entries[0].isIntersecting) { paginaActual++; renderGrid(filteredItems); }
      }, { rootMargin: '250px' });
      observer.observe(sentinel);
    }

    function manejarAgregar(silencioso) {
      var val = document.getElementById('inputAgregar').value.trim();
      if (!val) { if (!silencioso) showToast('Escribe un nombre, ID o URL.', 'warning'); return; }

      var esDirecto = false;
      if (currentCategory === 'Juegos' && (/^\d+$/.test(val) || val.includes('steampowered.com/app/'))) esDirecto = true;
      if (currentCategory === 'Peliculas_Series' && (/^(movie|tv)-\d+$/i.test(val) || val.includes('themoviedb.org/'))) esDirecto = true;
      if (currentCategory === 'Libros' && (/^OL\d+[WM]$/i.test(val) || /^(\d{10}|\d{13})$/.test(val.replace(/[-\s]/g, '')) || val.includes('openlibrary.org/'))) esDirecto = true;
      if (currentCategory === 'Mangas' && (/^(al-)?\d+$/i.test(val) || val.includes('myanimelist.net/manga/') || val.includes('anilist.co/manga/'))) esDirecto = true;

      if (esDirecto) { ejecutarAgregarDirecto(val); return; }

      activarModoBusquedaAgregar(true);

      var btn = document.getElementById('btn-add');
      var dd = document.getElementById('search-dropdown');
      btn.innerHTML = '...'; btn.disabled = true;
      dd.innerHTML = '<div style="padding:12px;text-align:center;color:var(--accent);font-size:12px;">Buscando coincidencias...</div>';
      dd.classList.add('open');

      var finalizado = false;
      var timer = setTimeout(function() {
        if (finalizado) return;
        finalizado = true;
        btn.innerHTML = svgIcon('i-plus', 'ico-sm'); btn.disabled = false;
        dd.innerHTML = '<div style="padding:12px;text-align:center;color:#ff8585;font-size:12px;">Tiempo agotado. Intenta de nuevo.</div>';
      }, 12000);

      RUN
        .withSuccessHandler(function(resultados) {
          if (finalizado) return;
          finalizado = true; clearTimeout(timer);
          btn.innerHTML = svgIcon('i-plus', 'ico-sm'); btn.disabled = false;
          if (!resultados || resultados.length === 0) {
            dd.innerHTML = '<div style="padding:12px;text-align:center;color:#8f98a0;font-size:12px;">Sin resultados.</div>';
            return;
          }
          dd.innerHTML = resultados.map(r => `
            <div class="search-result-item" onclick="ejecutarAgregarDirecto('${escaparHTML(r.id)}')">
              <img src="${escaparHTML(r.portada)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=FALLBACK_SVG;">
              <div class="search-result-info">
                <div class="search-result-title">${escaparHTML(r.titulo)}</div>
                <div class="search-result-sub">${escaparHTML(r.subtitulo)}</div>
              </div>
              <span class="search-result-badge">+ Añadir</span>
            </div>
          `).join('');
        })
        .withFailureHandler(function(err) {
          if (finalizado) return;
          finalizado = true; clearTimeout(timer);
          btn.innerHTML = svgIcon('i-plus', 'ico-sm'); btn.disabled = false;
          dd.classList.remove('open');
          showToast(err.message, 'error');
        })
        .buscarCatalogoExterno(currentCategory, val);
    }

    function ejecutarAgregarDirecto(idOUrl) {
      var btn = document.getElementById('btn-add');
      document.getElementById('search-dropdown').classList.remove('open');
      btn.innerHTML = '...'; btn.disabled = true;

      RUN
        .withSuccessHandler(function(res) {
          btn.innerHTML = svgIcon('i-plus', 'ico-sm'); btn.disabled = false;
          if (res.success) {
            document.getElementById('inputAgregar').value = '';
            cerrarBusquedaAgregar();
            showToast(res.msg, 'success');
            forzarSincronizacion();
          } else {
            showToast(res.msg || 'No se pudo añadir', 'warning');
          }
        })
        .withFailureHandler(function(err) {
          btn.innerHTML = svgIcon('i-plus', 'ico-sm'); btn.disabled = false;
          showToast('Error: ' + err.message, 'error');

        .agregarItem(currentCategory, idOUrl);

    function formatearPuntuacionBadge_(val) {
      if (val === null || val === undefined) return '';
      var s = String(val).trim();
      if (!s || s === 'N/A' || s.toLowerCase() === 'undefined' || s.toLowerCase() === 'null' || s === 'NaT') return '';
      // Bloquea fechas (YYYY-MM-DD, ISO o DD/MM/YYYY) para no mostrarlas como puntuación
      if (/^\d{4}-\d{2}-\d{2}/.test(s) || /^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}$/.test(s)) return '';
      return s;
    }

    // ---- MODS TRACKER (per-user, tabla mods + RLS mods_self) ----
    var _modsCtx = null;   // {cat, extId, mediaId}
    var _modsList = [];
    var MODS_SOURCE_LABEL = { nexus_mods: 'Nexus Mods', steam_workshop: 'Steam Workshop', curseforge: 'CurseForge', otra_url: 'Otra URL' };

    async function nexusModsMediaId() {
      if (_modsCtx && _modsCtx.cat === currentCategory && String(_modsCtx.extId) === String(currentItemId)) {
        return _modsCtx.mediaId;
      }
      var mediaId = await nexusMediaId(currentCategory, currentItemId);
      _modsCtx = { cat: currentCategory, extId: currentItemId, mediaId: mediaId };
      return mediaId;
    }

    async function toggleModsPanel() {
      if (!NEXUS_MODE || currentCategory !== 'Juegos') return;
      var panel = document.getElementById('m-mods-panel');
      var showing = panel.style.display === 'none';
      panel.style.display = showing ? 'block' : 'none';
      if (showing) await nexusLoadMods();
    }

    async function nexusLoadMods() {
      var list = document.getElementById('mods-list');
      list.innerHTML = '<div class="mods-empty">Cargando...</div>';
      try {
        await nexusEnsureProfile();
        var mediaId = await nexusModsMediaId();
        if (!mediaId) { list.innerHTML = '<div class="mods-empty">Item no encontrado en el catálogo.</div>'; return; }
        var sb = await nexusSb();
        var r = await sb.from('mods').select('id,name,source,url,version_juego,notes,created_at')
          .eq('media_item_id', mediaId).order('created_at', { ascending: true });
        if (r.error) throw new Error(r.error.message);
        _modsList = r.data || [];
        nexusRenderMods();
        nexusRenderModsSearch();
      } catch (e) {
        list.innerHTML = '<div class="mods-empty">Error: ' + escaparHTML(e.message || '') + '</div>';
      }
    }

    function nexusRenderMods() {
      var list = document.getElementById('mods-list');
      var count = document.getElementById('mods-count');
      count.textContent = _modsList.length ? (_modsList.length + (_modsList.length === 1 ? ' mod' : ' mods')) : '';
      if (!_modsList.length) { list.innerHTML = '<div class="mods-empty">Sin mods guardados todavía.</div>'; return; }
      var groups = {}, order = [];
      _modsList.forEach(function(m) {
        var v = (m.version_juego && String(m.version_juego).trim()) ? String(m.version_juego).trim() : 'Sin versión';
        if (!groups[v]) { groups[v] = []; order.push(v); }
        groups[v].push(m);
      });
      list.innerHTML = order.map(function(v) {
        var rows = groups[v].map(function(m) {
          var src = MODS_SOURCE_LABEL[m.source] || m.source;
          return '<div class="mod-row">'
            + '<div class="mod-row-main">'
            +   '<div class="mod-name">' + (m.url
                  ? '<a href="' + escaparHTML(m.url) + '" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;">' + escaparHTML(m.name) + '</a>'
                  : escaparHTML(m.name)) + '</div>'
            +   '<div class="mod-meta"><span class="mod-source">' + escaparHTML(src) + '</span><span class="mod-version">' + escaparHTML(v) + '</span></div>'
            +   (m.notes ? '<div class="mod-notes">' + escaparHTML(m.notes) + '</div>' : '')
            + '</div>'
            + '<div class="mod-actions">'
            +   (m.url ? '<a class="mod-act" href="' + escaparHTML(m.url) + '" target="_blank" rel="noopener noreferrer" title="Abrir"><svg class="ico ico-sm"><use href="#i-globe"/></svg></a>' : '')
            +   '<button class="mod-act del" onclick="nexusModBorrar(\'' + m.id + '\')" title="Eliminar"><svg class="ico ico-sm"><use href="#i-trash"/></svg></button>'
            + '</div></div>';
        }).join('');
        return '<details class="mods-group" open><summary><svg class="ico ico-sm"><use href="#i-chevron-down"/></svg> ' + escaparHTML(v)
          + ' <span class="mods-group-tag">· ' + groups[v].length + '</span></summary>' + rows + '</details>';
      }).join('');
    }

    function nexusRenderModsSearch() {
      var it = (itemsByCategory[currentCategory] || []).find(function(x) { return String(x.id) === String(currentItemId); });
      var title = it ? (it.titulo || '') : '';
      var q = encodeURIComponent(title);
      var appid = it ? String(it.id) : '';
      var links = [
        ['Nexus Mods', 'https://www.nexusmods.com/search/?gterm=' + q],
        ['Workshop', 'https://steamcommunity.com/workshop/browse/?appid=' + appid + '&searchtext=' + q],
        ['CurseForge', 'https://www.curseforge.com/search?searchText=' + q],
        ['Google', 'https://www.google.com/search?q=' + q + '+mod']
      ];
      document.getElementById('mods-search-row').innerHTML = links.map(function(l) {
        return '<a class="mods-search-btn" href="' + l[1] + '" target="_blank" rel="noopener noreferrer">'
          + svgIcon('i-search', 'ico-sm') + escaparHTML(l[0]) + '</a>';
      }).join('');
    }

    async function nexusModGuardar() {
      var nombre = document.getElementById('mod-nombre').value.trim();
      var fuente = document.getElementById('mod-fuente').value;
      var version = document.getElementById('mod-version').value.trim();
      var url = document.getElementById('mod-url').value.trim();
      var notas = document.getElementById('mod-notas').value.trim();
      if (!nombre) { showToast && showToast('Ponle nombre al mod.', 'error'); return; }
      try {
        await nexusEnsureProfile();
        var mediaId = await nexusModsMediaId();
        if (!mediaId) throw new Error('Item no encontrado en el catálogo.');
        var sb = await nexusSb();
        var r = await sb.from('mods').insert({
          profile_id: _nexusUser.id, media_item_id: mediaId,
          name: nombre, source: fuente,
          url: url || null, version_juego: version || null, notes: notas || null
        });
        if (r.error) throw new Error(r.error.message);
        ['mod-nombre', 'mod-url', 'mod-version', 'mod-notas'].forEach(function(id) { document.getElementById(id).value = ''; });
        showToast && showToast('Mod guardado.', 'success');
        await nexusLoadMods();
      } catch (e) {
        showToast && showToast('Error: ' + (e.message || ''), 'error');
      }
    }

    async function nexusModBorrar(id) {
      try {
        var sb = await nexusSb();
        var r = await sb.from('mods').delete().eq('id', id);
        if (r.error) throw new Error(r.error.message);
        _modsList = _modsList.filter(function(m) { return m.id !== id; });
        nexusRenderMods();
      } catch (e) {
        showToast && showToast('Error: ' + (e.message || ''), 'error');

      var open = el.classList.contains('active');
      document.querySelectorAll('#tracking-personas .player-accordion').forEach(function(a) {

    function actualizarResumenJugador(k, est, pts, wish, nota) {
      var stEl = document.getElementById('sum-status-' + k);
      stEl.innerText = (!est || est === 'No jugado') ? 'Pendiente' : est;
      stEl.className = 'status-chip ' + (est === 'Completado' ? 'status-done' : (est === 'En proceso' ? 'status-playing' : 'status-none'));

      var ptsEl = document.getElementById('sum-stars-' + k);
      ptsEl.innerHTML = pts > 0 ? `${svgIcon('i-star', 'ico-sm ico-gold')} ${pts}/10` : 'Sin nota';

      document.getElementById('sum-wish-' + k).style.display = wish ? 'inline-flex' : 'none';
      document.getElementById('sum-note-' + k).style.display = String(nota || '').trim() ? 'inline-flex' : 'none';

      var wBtn = document.getElementById('btn-wish-' + k);
      wBtn.classList.toggle('active', wish);
      wBtn.innerHTML = wish ?
        `${svgIcon('i-heart-fill', 'ico-sm ico-wish')} En deseados` :
        `${svgIcon('i-heart', 'ico-sm')} Marcar como deseado`;

    function renderEstrellas(containerId, valor, persona) {
      var c = document.getElementById(containerId);
      c.innerHTML = '';
      for (var i = 1; i <= 10; i++) {
        var s = document.createElement('span');
        s.className = 'star ' + (i <= valor ? 'active' : '');
        s.innerHTML = '&#9733;';
        s.onclick = (function(idx) {
          return function() {
            renderEstrellas(containerId, idx, persona);
            guardarTracking(persona, idx);
          };
        })(i);
        c.appendChild(s);
      }
    }

    function extraerNumeroCapitulo(progStr) {
      const m = String(progStr || '').match(/(\d+)/);
      return m ? parseInt(m[1], 10) : 0;
    }

    function obtenerTotalCapitulosItem(it) {
      if (it.capitulosTotales && Number(it.capitulosTotales) > 0) return Number(it.capitulosTotales);
      const mCaps = String(it.extension || '').match(/(\d+)\s*caps/i);
      if (mCaps) return parseInt(mCaps[1], 10);
      return 0;
    }

    function calcularPorcentajeLectura(actual, total) {
      if (!total || total <= 0 || !actual || actual <= 0) return 0;
      return Math.min(100, Math.round((actual / total) * 100));
    }

    function generarBarraLecturaCard(it) {
      if (currentCategory !== 'Libros' && currentCategory !== 'Mangas') return '';
      const total = obtenerTotalCapitulosItem(it);
      const pers = nexusItemPersonas(it);
      let html = '';
      pers.forEach(function(p) {
        const vis = it['visible' + p.suffix] !== false;
        const act = extraerNumeroCapitulo(it['progreso' + p.suffix]);
        if (!vis || (!act && it['estado' + p.suffix] !== 'En proceso')) return;
        const pct = calcularPorcentajeLectura(act, total);
        const txt = (total > 0 ? `Cap. ${act}/${total} (${pct}%)` : `Cap. ${act}`);
        html += `<div class="card-reading-labels"><span style="display:inline-flex;align-items:center;gap:5px;">${nexusPersonaDot(p, 13)} ${txt}</span></div>` +
                (total > 0 ? `<div class="reading-progress-track"><div class="reading-progress-fill" style="width:${pct}%"></div></div>` : '');
      });
      return html ? '<div class="card-reading-bar">' + html + '</div>' : '';
    }

    function inicializarCapitulosModal(k, it, progStr) {
      const actual = extraerNumeroCapitulo(progStr);
      const total = obtenerTotalCapitulosItem(it);
      const curEl = document.getElementById('chap-cur-' + k);
      const totEl = document.getElementById('chap-tot-' + k);
      const hintEl = document.getElementById('chap-hint-' + k);

      curEl.value = actual > 0 ? actual : '';
      totEl.value = total > 0 ? total : '';

      if (currentCategory === 'Mangas') {
        totEl.disabled = true;
        totEl.placeholder = 'Auto';
        hintEl.innerText = 'Auto API (semanal)';
      } else {
        totEl.disabled = false;
        totEl.placeholder = 'Desconocido';
        hintEl.innerText = 'Total editable';
      }
      refrescarPorcentajeUI(k, actual, total);
    }

    function refrescarPorcentajeUI(k, actual, total) {
      const pct = calcularPorcentajeLectura(actual, total);
      document.getElementById('chap-pct-' + k).innerText = pct + '%';
      document.getElementById('chap-bar-' + k).style.width = pct + '%';
    }

    function actualizarCapitulosUI(persona) {
      const k = persona.toLowerCase();
      const actual = Math.max(0, parseInt(document.getElementById('chap-cur-' + k).value, 10) || 0);
      const total = Math.max(0, parseInt(document.getElementById('chap-tot-' + k).value, 10) || 0);
      refrescarPorcentajeUI(k, actual, total);

      document.getElementById('prog-' + k).value = actual > 0 ? `Cap. ${actual}` : '';
      if (actual > 0 && (!document.getElementById('select-estado-' + k).value || document.getElementById('select-estado-' + k).value === 'No jugado')) {
        document.getElementById('select-estado-' + k).value = (total > 0 && actual >= total) ? 'Completado' : 'En proceso';
      }
      guardarTracking(persona);
    }

    function guardarTotalCapsDesdeModal(persona) {
      if (currentCategory === 'Mangas') return;
      const k = persona.toLowerCase();
      const total = Math.max(0, parseInt(document.getElementById('chap-tot-' + k).value, 10) || 0);
      // sincroniza el total con TODAS las demás secciones de persona del modal
      document.querySelectorAll('#tracking-personas [id^="chap-tot-"]').forEach(function(el) {
        if (el.id !== 'chap-tot-' + k) el.value = total > 0 ? total : '';
      });

      const actK = Math.max(0, parseInt(document.getElementById('chap-cur-' + k).value, 10) || 0);
      document.querySelectorAll('#tracking-personas .player-accordion').forEach(function(acc) {
        var kk = acc.id.replace('acc-', '');
        var act = Math.max(0, parseInt((document.getElementById('chap-cur-' + kk) || {}).value, 10) || 0);
        refrescarPorcentajeUI(kk, act, total);
      });

      const it = (itemsByCategory[currentCategory] || []).find(x => String(x.id) === String(currentItemId));
      if (it) {
        it.capitulosTotales = total;
        try { localStorage.setItem(`media_lib_${CACHE_VERSION}_${currentCategory}`, JSON.stringify(itemsByCategory[currentCategory])); } catch (e) {}
        filtrarItems();
      }
      RUN.guardarTotalCapitulos(currentCategory, currentItemId, total);
    }

    function guardarTracking(persona, estrellasOverride) {
      var it = (itemsByCategory[currentCategory] || []).find(x => String(x.id) === String(currentItemId));
      if (!it) return;
      var k = persona.toLowerCase();
      var est = document.getElementById('select-estado-' + k).value || 'No jugado';
      var prog = document.getElementById('prog-' + k).value;
      var pts = estrellasOverride !== undefined ? estrellasOverride : (it['estrellas' + persona] || 0);

      it['estado' + persona] = est;
      it['estrellas' + persona] = pts;
      it['progreso' + persona] = prog;

      actualizarResumenJugador(k, est, pts, Boolean(it['deseado' + persona]), it['nota' + persona]);
      try { localStorage.setItem(`media_lib_${CACHE_VERSION}_${currentCategory}`, JSON.stringify(itemsByCategory[currentCategory])); } catch (e) {}
      filtrarItems();

      RUN.guardarProgresoItem(currentCategory, currentItemId, persona, est, pts, prog);
    }

    function toggleDeseado(persona) {
      var it = (itemsByCategory[currentCategory] || []).find(x => String(x.id) === String(currentItemId));
      if (!it) return;
      var k = persona.toLowerCase();
      var nuevo = !Boolean(it['deseado' + persona]);
      it['deseado' + persona] = nuevo;

      actualizarResumenJugador(k, it['estado' + persona] || 'No jugado', it['estrellas' + persona] || 0, nuevo, it['nota' + persona]);
      try { localStorage.setItem(`media_lib_${CACHE_VERSION}_${currentCategory}`, JSON.stringify(itemsByCategory[currentCategory])); } catch (e) {}
      filtrarItems();

      RUN.guardarDeseadoItem(currentCategory, currentItemId, persona, nuevo);
    }

    function guardarNotaJugador(persona, valor) {
      var it = (itemsByCategory[currentCategory] || []).find(x => String(x.id) === String(currentItemId));
      if (!it) return;
      var k = persona.toLowerCase();
      it['nota' + persona] = valor;
      actualizarResumenJugador(k, it['estado' + persona] || 'No jugado', it['estrellas' + persona] || 0, Boolean(it['deseado' + persona]), valor);
      try { localStorage.setItem(`media_lib_${CACHE_VERSION}_${currentCategory}`, JSON.stringify(itemsByCategory[currentCategory])); } catch (e) {}
      RUN.guardarNotaItem(currentCategory, currentItemId, persona, valor);
    }

    function repararItemActual() {
      var btn = document.getElementById('btn-repair');
      btn.disabled = true; btn.innerText = 'Actualizando...';
      RUN
        .withSuccessHandler(function(res) {
          btn.disabled = false; btn.innerHTML = `${svgIcon('i-wrench', 'ico-sm')} Reparar / Actualizar Metadata`;
          if (res.success && res.data) {
            var lista = itemsByCategory[currentCategory];
            var idx = lista.findIndex(x => String(x.id) === String(currentItemId));
            if (idx !== -1) lista[idx] = res.data;
            try { localStorage.setItem(`media_lib_${CACHE_VERSION}_${currentCategory}`, JSON.stringify(lista)); } catch (e) {}
            abrirModal(res.data.id);
            filtrarItems();
            showToast('Ficha actualizada.', 'success');
          } else showToast(res.msg || 'Error al actualizar', 'error');
        })
        .withFailureHandler(function(err) {
          btn.disabled = false; btn.innerHTML = `${svgIcon('i-wrench', 'ico-sm')} Reparar / Actualizar Metadata`;
          showToast('Error: ' + err.message, 'error');
        })
        .repararItemIndividual(currentCategory, currentItemId);
    }

    function eliminarItemActual() {
      if (!confirm('¿Mover a la Papelera?')) return;
      RUN
        .withSuccessHandler(function(res) {
          if (res.success) {
            showToast('Movido a la papelera.', 'warning');
            cerrarModal();
            forzarSincronizacion();
          } else {
            showToast(res.msg || 'No se pudo eliminar', 'error');
          }
        })
        .withFailureHandler(function(err) {
          showToast('Error: ' + err.message, 'error');
        })
        .eliminarItem(currentCategory, currentItemId);
    }

      renderizarEstadisticas();

    // botones de perfil de stats — uno por persona registrada + "Todos"
    function nexusRenderStatsProfButtons() {
      var wrap = document.getElementById('stats-prof-buttons');
      if (!wrap) return;
      var h = '<button class="stats-prof-btn' + (currentStatsProfile === 'ambos' ? ' active' : '') +
        '" data-prof="ambos" onclick="cambiarPerfilStats(\'ambos\')">' +

          '" data-prof="' + p.key + '" onclick="cambiarPerfilStats(\'' + p.key + '\')">' +
          nexusPersonaDot(p, 14) + ' <span class="stat-prof-name">' + vinculosEsc(p.label || p.suffix) + '</span></button>';
      });
      wrap.innerHTML = h;
    }

    function renderizarEstadisticas() {
      var container = document.getElementById('stats-cards-container');
      nexusRenderStatsProfButtons();
      var pers = (_personas || []).slice();
      if (currentStatsProfile !== 'ambos' && !pers.some(function(p) { return p.key === currentStatsProfile; })) {
        currentStatsProfile = 'ambos';
      }
      var selPers = currentStatsProfile === 'ambos' ? pers :
        pers.filter(function(p) { return p.key === currentStatsProfile; });
      var profTitulo = currentStatsProfile === 'ambos' ? 'Todos' :
        (selPers[0] ? selPers[0].suffix : 'Todos');

      var catsToProcess = currentStatsCategory === 'todas' ? ['Juegos', 'Peliculas_Series', 'Libros', 'Mangas'] : [currentStatsCategory];
      var catTitulo = currentStatsCategory === 'todas' ? 'Global' : (CAT_CONFIG[currentStatsCategory]?.label || currentStatsCategory);

      let totalElementos = 0;
      var stats = {};
      pers.forEach(function(p) { stats[p.suffix] = { comp: 0, proc: 0, wish: 0, suma: 0, cuenta: 0 }; });
      let distribucion = { Juegos: 0, 'Cine/Series': 0, Libros: 0, Mangas: 0 };

      ['Juegos', 'Peliculas_Series', 'Libros', 'Mangas'].forEach(cat => {
        var lista = itemsByCategory[cat] || [];
        distribucion[cat === 'Peliculas_Series' ? 'Cine/Series' : (cat === 'Mangas' ? 'Mangas' : (cat === 'Libros' ? 'Libros' : 'Juegos'))] = lista.length;
      });

      catsToProcess.forEach(cat => {
        var lista = itemsByCategory[cat] || [];
        totalElementos += lista.length;

        lista.forEach(it => {
          pers.forEach(function(p) {
            var s = p.suffix, st = stats[s];
            var est = it['estado' + s] || 'No jugado';
            var nota = Number(it['estrellas' + s]) || 0;
            if (est === 'Completado') st.comp++;
            if (est === 'En proceso') st.proc++;
            if (it['deseado' + s]) st.wish++;
            if (nota > 0) { st.suma += nota; st.cuenta++; }
          });
        });
      });

      function agg(field) {
        return selPers.reduce(function(acc, p) { return acc + stats[p.suffix][field]; }, 0);
      }
      function aggNota() {
        var suma = 0, cuenta = 0;
        selPers.forEach(function(p) { suma += stats[p.suffix].suma; cuenta += stats[p.suffix].cuenta; });
        return cuenta > 0 ? (suma / cuenta).toFixed(1) : '0.0';
      }
      var valCompletados = agg('comp');
      var valProceso = agg('proc');
      var valDeseados = agg('wish');
      var notaMediaVal = aggNota();

      function barraPersona(p, field) {
        var st = stats[p.suffix];
        var pct = totalElementos > 0 ? Math.round((st[field] / totalElementos) * 100) : 0;
        return '<div class="stat-bar-row">' +
          '<div class="stat-bar-labels"><span style="color:' + p.color + ';">' + nexusPersonaDot(p, 14) + ' ' +
          vinculosEsc(p.label || p.suffix) + ': ' + st[field] + '</span><span>' + pct + '%</span></div>' +
          '<div class="stat-bar-track"><div class="stat-bar-fill" style="width:' + pct + '%;background:' + p.color + ';"></div></div>' +
        '</div>';
      }
      function barras(field) {
        return pers.map(function(p) { return barraPersona(p, field); }).join('');
      }
      function lineasNota() {
        return pers.map(function(p) {
          var st = stats[p.suffix];
          var media = st.cuenta > 0 ? (st.suma / st.cuenta).toFixed(1) : '0.0';
          return '<div class="stat-detail-line">' + nexusPersonaDot(p, 14) + ' Nota media ' +
            vinculosEsc(p.label || p.suffix) + ': <strong>' + media + ' / 10</strong> (' + st.cuenta + ' valoraciones)</div>';
        }).join('');
      }

      const toggleHdr = `<span class="stat-toggle-lbl">Desplegar ${svgIcon('i-chevron-down', 'ico-sm')}</span>`;

      container.innerHTML = `
        <div class="stat-card" onclick="toggleStatCard(this)">
          <div class="stat-card-header">
            <div class="stat-card-title">Biblioteca Total (${escaparHTML(catTitulo)})</div>
            ${toggleHdr}
          </div>
          <div class="stat-card-value">${totalElementos}</div>
          <div class="stat-card-sub"><span>Elementos registrados</span><span>${escaparHTML(catTitulo)}</span></div>
          <div class="stat-accordion-content">
            <div style="font-size:11px;color:#8f98a0;margin-bottom:2px;">Desglose general:</div>
            <div class="stat-detail-line">${svgIcon('i-gamepad', 'ico-sm')} Juegos: <strong>${distribucion.Juegos}</strong></div>
            <div class="stat-detail-line">${svgIcon('i-film', 'ico-sm')} Cine/Series: <strong>${distribucion['Cine/Series']}</strong></div>
            <div class="stat-detail-line">${svgIcon('i-book', 'ico-sm')} Libros: <strong>${distribucion.Libros}</strong></div>
            <div class="stat-detail-line">${svgIcon('i-manga', 'ico-sm')} Mangas: <strong>${distribucion.Mangas}</strong></div>
          </div>
        </div>

        <div class="stat-card" onclick="toggleStatCard(this)">
          <div class="stat-card-header">
            <div class="stat-card-title">Completados</div>
            ${toggleHdr}
          </div>
          <div class="stat-card-value">${valCompletados}</div>
          <div class="stat-card-sub"><span>Fines de obra alcanzados</span><span>${escaparHTML(profTitulo)}</span></div>
          <div class="stat-accordion-content">
            ${barras('comp')}
          </div>
        </div>

        <div class="stat-card" onclick="toggleStatCard(this)">
          <div class="stat-card-header">
            <div class="stat-card-title">En Proceso</div>
            ${toggleHdr}
          </div>
          <div class="stat-card-value">${valProceso}</div>
          <div class="stat-card-sub"><span>Actualmente activos</span><span>${escaparHTML(profTitulo)}</span></div>
          <div class="stat-accordion-content">
            ${barras('proc')}
          </div>
        </div>

        <div class="stat-card" onclick="toggleStatCard(this)">
          <div class="stat-card-header">
            <div class="stat-card-title">Lista de Deseados</div>
            ${toggleHdr}
          </div>
          <div class="stat-card-value">${valDeseados}</div>
          <div class="stat-card-sub"><span>Guardados en wishlist</span><span>${escaparHTML(profTitulo)}</span></div>
          <div class="stat-accordion-content">
            ${barras('wish')}
          </div>
        </div>

        <div class="stat-card" onclick="toggleStatCard(this)">
          <div class="stat-card-header">
            <div class="stat-card-title">Nota Media Otorgada</div>
            ${toggleHdr}
          </div>
          <div class="stat-card-value">${svgIcon('i-star', 'ico-lg ico-gold')} ${notaMediaVal} / 10</div>
          <div class="stat-card-sub"><span>Basado en valoraciones</span><span>${escaparHTML(profTitulo)}</span></div>
          <div class="stat-accordion-content">
            ${lineasNota()}
          </div>
        </div>
      `;
    }

      setTimeout(() => modal.style.display = 'none', 220);

    function cambiarMatchCat(cat) {
      currentMatchCategory = cat;
      document.querySelectorAll('.match-tab').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-matchcat') === cat);
      });
      renderMatchGrid(cat);

    function seleccionarMatchItem(cat, id) {
      cerrarMatchModal();
      if (currentCategory !== cat) {
        cambiarCategoria(cat);
      }
      abrirModal(id);
    }

    function renderMatchGrid(cat) {
      var gridEl = document.getElementById('match-grid');
      var lista = itemsByCategory[cat] || [];

      var matches = lista.filter(it => {
        var set = {};
        nexusScanItemPersonas(it, set);
        var sufs = Object.keys(set);
        if (sufs.length === 0) return false;
        var allPend = true, allDeseado = true;
        sufs.forEach(s => {
          var est = it['estado' + s] || 'No jugado';
          if (est !== 'No jugado') allPend = false;
          if (!it['deseado' + s]) allDeseado = false;
        });
        return allPend || allDeseado;
      });

      if (matches.length === 0) {
        gridEl.innerHTML = '<p style="text-align:center;color:#8f98a0;grid-column:1/-1;padding:20px;">No hay coincidencias en esta categoría.</p>';
        return;
      }

      gridEl.innerHTML = matches.map(it => `
        <div class="match-card" onclick="seleccionarMatchItem('${escaparHTML(cat)}', '${escaparHTML(it.id)}')">
          <img src="${escaparHTML(it.portada)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=FALLBACK_SVG;">
          <div class="match-card-body">
            <div class="match-card-title">${escaparHTML(it.titulo)}</div>
            <div style="font-size:10px;color:var(--accent);margin-top:auto;display:inline-flex;align-items:center;gap:4px;">${svgIcon('i-heart-fill', 'ico-sm ico-wish')} Coincidencia</div>
          </div>
        </div>
      `).join('');
    }

    function cerrarPapelera() {
      var m = document.getElementById('modal-papelera');
      m.style.opacity = '0';
      setTimeout(() => m.style.display = 'none', 220);
    }

    function restaurarDesdePapelera(cat, id) {
      RUN
        .withSuccessHandler(function(res) {
          if (res.success) {
            showToast('Restaurado en ' + cat, 'success');
            cerrarPapelera();
            cargarCategoria(cat, true);
          } else {
            showToast('No se pudo restaurar el elemento.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          showToast('Error: ' + err.message, 'error');
        })
        .restaurarItem(cat, id);
    }

    function elegirAleatorio() {
      var pool = filteredItems.length > 0 ? filteredItems : (itemsByCategory[currentCategory] || []);
      if (pool.length === 0) return showToast('No hay elementos para elegir.', 'warning');
      var el = pool[Math.floor(Math.random() * pool.length)];
      showToast('Elegido: ' + el.titulo, 'success');
      abrirModal(el.id);
    }

    function extraerYouTubeId(url) {
      var m = String(url || '').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    // ---- GAME UPDATE HISTORY (Steam news RSS via Edge Function steam-updates) ----
    var _updatesLoaded = false;

    function detenerUpdates() {
      var box = document.getElementById('m-updates-box');
      var btn = document.getElementById('btn-toggle-updates');
      if (box) { box.style.display = 'none'; }
      if (btn) { btn.classList.remove('active'); btn.innerHTML = `${svgIcon('i-sync', 'ico-sm')} Historial de Updates`; }
    }

    async function toggleUpdates() {
      var box = document.getElementById('m-updates-box');
      var btn = document.getElementById('btn-toggle-updates');
      if (box.style.display === 'block') { detenerUpdates(); return; }
      box.style.display = 'block';
      btn.classList.add('active');
      btn.innerHTML = `${svgIcon('i-x', 'ico-sm')} Ocultar Updates`;
      if (!_updatesLoaded) await nexusFetchUpdates();
    }

    function nexusFmtDate(pub) {
      try {
        var d = new Date(pub);
        return isNaN(d) ? String(pub || '') : d.toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' });
      } catch (e) { return String(pub || ''); }
    }

    async function nexusFetchUpdates() {
      var box = document.getElementById('m-updates-box');
      box.innerHTML = '<div class="upd-empty">Cargando updates...</div>';
      try {
        var sb = await nexusSb();
        var it = (itemsByCategory[currentCategory] || []).find(function(x) { return String(x.id) === String(currentItemId); });
        var appid = it ? String(it.id) : '';
        var r = await sb.functions.invoke('steam-updates', { body: { appid: appid } });
        if (r.error) throw new Error(r.error.message || 'Error en steam-updates');
        var items = (r.data && r.data.items) || [];
        _updatesLoaded = true;
        if (!items.length) { box.innerHTML = '<div class="upd-empty">Sin noticias en Steam para este juego.</div>'; return; }
        box.innerHTML = items.map(function(u) {
          return '<div class="upd-item">'
            + '<div class="upd-title">' + (u.url
                ? '<a href="' + escaparHTML(u.url) + '" target="_blank" rel="noopener noreferrer">' + escaparHTML(u.title) + '</a>'
                : escaparHTML(u.title)) + '</div>'
            + '<div class="upd-meta"><span>' + escaparHTML(nexusFmtDate(u.date)) + '</span>'
            + (u.is_update ? '<span class="upd-badge">Update</span>' : '') + '</div>'
            + (u.summary ? '<div class="upd-summary">' + escaparHTML(u.summary) + '</div>' : '')
            + '</div>';
        }).join('');
      } catch (e) {
        box.innerHTML = '<div class="upd-empty">' + escaparHTML('Error: ' + (e.message || '')) + '</div>';
      }
    }

    function toggleTrailer() {
      var box = document.getElementById('m-trailer-box');
      var btn = document.getElementById('btn-toggle-trailer');
      if (box.style.display === 'block') return detenerTrailer();

      detenerTrailer();
      box.style.display = 'block';
      btn.classList.add('active');
      btn.innerHTML = `${svgIcon('i-x', 'ico-sm')} Ocultar Tráiler`;

      var ytId = extraerYouTubeId(currentTrailerUrl);
      if (ytId) {
        var iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&rel=0`;
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
        box.appendChild(iframe);
        return;
      }

      var video = document.createElement('video');
      video.controls = true; video.playsInline = true; video.autoplay = true;
      box.appendChild(video);

      if (currentTrailerUrl.includes('.m3u8')) {
        const iniciarHls = () => {
          if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(currentTrailerUrl);
            hlsInstance.attachMedia(video);
          } else { video.src = currentTrailerUrl; }
        };
        if (typeof Hls === 'undefined') {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1';
          s.onload = iniciarHls;
          document.head.appendChild(s);
        } else { iniciarHls(); }
      } else { video.src = currentTrailerUrl; }
    }

    function detenerTrailer() {
      var box = document.getElementById('m-trailer-box');
      var btn = document.getElementById('btn-toggle-trailer');
      if (hlsInstance) { try { hlsInstance.destroy(); } catch (e) {} hlsInstance = null; }
      if (box) { box.innerHTML = ''; box.style.display = 'none'; }
      if (btn) { btn.classList.remove('active'); btn.innerHTML = `${svgIcon('i-play', 'ico-sm')} Ver Tráiler`; }
    }
  </script>

  <script>
    window.addEventListener('error', (e) => {
      console.error('[NexusLib] Error:', e.message, e.filename, e.lineno);
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.error('[NexusLib] Promesa rechazada:', e.reason);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(() => console.log('PWA lista para instalar'))
          .catch(err => console.log('Error en Service Worker:', err));
      });
    }
  </script>
</body>
