<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NexusLib</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    
    <meta name="theme-color" content="#0b0e14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e14;
            -webkit-font-smoothing: antialiased;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background-color: #0b0e14;
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbzVokcNfyCiGDZG83xrnPrv-MmaYT5U90Iod6tiDekjgtxQOTqIEixvh34DwdsKdt8Now/exec" allow="clipboard-write; fullscreen; autoplay" allowfullscreen></iframe>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(() => console.log('PWA lista para instalar'))
                    .catch(err => console.log('Error en Service Worker:', err));
            });
        }
    </script>
</body>
</html>
