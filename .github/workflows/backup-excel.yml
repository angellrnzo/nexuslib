name: Backup Semanal GameList.xlsx

on:
  schedule:
    - cron: '0 3 * * 0' # Se ejecuta cada domingo a las 3:00 AM UTC
  workflow_dispatch:    # Permite ejecutarlo manualmente con un clic en GitHub

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Descargar copia de Google Sheets a Excel
        run: |
          # Reemplaza TU_ID_DE_GOOGLE_SHEET con el ID real de tu hoja de cálculo
          # (Asegúrate de que la hoja tenga permiso de lectura con enlace: "Cualquiera con el enlace puede leer")
          curl -L -o "AppScript/GameList.xlsx" "https://docs.google.com/spreadsheets/d/${{ secrets.GOOGLE_SHEET_ID || '13ZoOAVmoksF3jyNvFScscnBWhNHxXdOMAiXSlPImYnk' }}/export?format=xlsx"

      - name: Hacer commit y push a GitHub si el archivo cambió
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add AppScript/GameList.xlsx
          if git diff --staged --quiet; then
            echo "No hay cambios en la hoja de cálculo."
          else
            git commit -m "Auto-backup semanal GameList.xlsx [skip ci]"
            git push
          fi
