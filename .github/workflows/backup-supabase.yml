name: Backup Supabase DB

on:
  schedule:
    - cron: '0 5 * * 1' # Lunes 5:00 AM UTC
  workflow_dispatch:    # Ejecucion manual desde Actions

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: pg_dump schema public
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$DB_URL" \
            --schema=public --no-owner --no-privileges \
            --format=custom --compress=9 \
            --file="nexuslib_$(date +%Y%m%d_%H%M).dump"
          ls -lh nexuslib_*.dump

      - name: Upload artifact (90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: nexuslib_*.dump
          retention-days: 90
          if-no-files-found: error

      # --- STANDBY MIRROR -------------------------------------------------
      # Espejo vivo via database/mirror_to_standby.py: vuelca tablas public
      # del principal al standby con TRUNCATE+INSERT y remap de profile ids
      # por username (auth.users tiene UUIDs distintos por proyecto).
      # Antes del mirror se sincroniza el SCHEMA: apply_schema.py --deltas
      # corre solo los archivos 02+ (idempotentes: create or replace,
      # if not exists, drop if exists) para que el standby reciba
      # funciones/tablas nuevas sin tocar bootstrap 00/01.
      # Requiere var SUPABASE_STANDBY_ENABLED=true + secrets standby.
      # Standby real: uxixiwrvobkulkjkicjm (us-west-2).
      - name: Sync schema deltas to standby
        if: ${{ vars.SUPABASE_STANDBY_ENABLED == 'true' }}
        env:
          TARGET_URL: ${{ secrets.SUPABASE_STANDBY_DB_URL }}
        run: |
          pip install -q psycopg2-binary
          python database/apply_schema.py --url "$TARGET_URL" --deltas

      - name: Mirror data to standby
        if: ${{ vars.SUPABASE_STANDBY_ENABLED == 'true' }}
        env:
          SOURCE_URL: ${{ secrets.SUPABASE_DB_URL }}
          TARGET_URL: ${{ secrets.SUPABASE_STANDBY_DB_URL }}
        run: |
          pip install -q psycopg2-binary
          python database/mirror_to_standby.py --source-url "$SOURCE_URL" --target-url "$TARGET_URL"
